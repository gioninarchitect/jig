<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Origin — UAT Proof by Role</title>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#0A0A0A;color:#fff;font-family:'Outfit',system-ui,sans-serif;padding:32px 20px 80px}
.page{max-width:900px;margin:0 auto}
h1{font-size:1.8rem;font-weight:800;color:#C9A84C;margin-bottom:4px}
.sub{color:rgba(255,255,255,.5);font-size:.95rem;margin-bottom:32px}
.mono{font-family:'JetBrains Mono',monospace}

/* Accordion */
.role{margin-bottom:8px;border:1px solid rgba(255,255,255,.06);border-radius:14px;overflow:hidden;background:rgba(255,255,255,.01)}
.role.open{border-color:rgba(201,168,76,.2)}
.role-header{display:flex;align-items:center;justify-content:space-between;padding:16px 20px;cursor:pointer;transition:background .2s}
.role-header:hover{background:rgba(255,255,255,.03)}
.role-left{display:flex;align-items:center;gap:12px}
.role-dot{width:10px;height:10px;border-radius:50%;flex-shrink:0}
.role-name{font-weight:700;font-size:1.05rem}
.role-person{font-size:.85rem;color:rgba(255,255,255,.5);margin-left:4px}
.role-level{font-size:.7rem;padding:2px 8px;border-radius:10px;background:rgba(201,168,76,.1);color:#C9A84C;font-weight:600;border:1px solid rgba(201,168,76,.15)}
.role-arrow{color:rgba(255,255,255,.3);transition:transform .2s;font-size:1.2rem}
.role.open .role-arrow{transform:rotate(180deg)}

.role-body{display:none;padding:0 20px 20px;border-top:1px solid rgba(255,255,255,.04)}
.role.open .role-body{display:block}

/* Sections inside role */
.section{margin-top:16px}
.section-title{font-size:.8rem;color:rgba(201,168,76,.6);font-weight:700;letter-spacing:2px;text-transform:uppercase;margin-bottom:8px}

/* Nav items */
.nav-group{margin-bottom:12px}
.nav-group-label{font-size:.7rem;color:rgba(255,255,255,.3);font-weight:600;letter-spacing:1.5px;text-transform:uppercase;margin-bottom:4px}
.nav-items{display:flex;flex-wrap:wrap;gap:4px}
.nav-item{font-size:.8rem;padding:4px 10px;border-radius:6px;background:rgba(255,255,255,.04);color:rgba(255,255,255,.65);border:1px solid rgba(255,255,255,.06)}

/* KPI cards */
.kpi-row{display:flex;gap:6px;flex-wrap:wrap}
.kpi{padding:8px 12px;border-radius:8px;background:rgba(255,255,255,.03);border:1px solid rgba(255,255,255,.05);text-align:center;min-width:100px;flex:1}
.kpi .val{font-size:1.1rem;font-weight:800;color:#C9A84C;font-family:'JetBrains Mono',monospace}
.kpi .lbl{font-size:.65rem;color:rgba(255,255,255,.35);text-transform:uppercase;letter-spacing:.5px;margin-top:2px}

/* Tickets */
.ticket-stages{display:flex;flex-wrap:wrap;gap:4px}
.ticket-stage{font-size:.7rem;padding:3px 8px;border-radius:4px;border:1px solid rgba(255,255,255,.06)}
.ticket-stage.yes{background:rgba(201,168,76,.08);color:#C9A84C;border-color:rgba(201,168,76,.15)}
.ticket-stage.no{background:rgba(255,255,255,.02);color:rgba(255,255,255,.25);border-color:rgba(255,255,255,.03)}

/* Permissions */
.perms{display:flex;gap:6px;flex-wrap:wrap}
.perm{font-size:.75rem;padding:3px 8px;border-radius:6px}
.perm.yes{background:rgba(34,197,94,.1);color:#22C55E;border:1px solid rgba(34,197,94,.2)}
.perm.no{background:rgba(239,68,68,.05);color:rgba(239,68,68,.3);border:1px solid rgba(239,68,68,.1)}

/* Dashboard widgets */
.widgets{display:flex;flex-wrap:wrap;gap:4px}
.widget{font-size:.7rem;padding:3px 8px;border-radius:4px;background:rgba(201,168,76,.06);color:rgba(201,168,76,.7);border:1px solid rgba(201,168,76,.1)}

/* Notifications */
.notif-list{margin-top:6px}
.notif{font-size:.85rem;color:rgba(255,255,255,.65);padding:4px 0;display:flex;align-items:center;gap:6px}
.notif-dot{width:5px;height:5px;border-radius:50%;flex-shrink:0}
.notif-dot.red{background:#EF4444}
.notif-dot.amber{background:#F59E0B}
.notif-dot.blue{background:#3B82F6}

/* Objective */
.objective{background:rgba(201,168,76,.06);border:1px solid rgba(201,168,76,.12);border-radius:10px;padding:12px 16px;margin-top:12px;font-size:.85rem;color:rgba(255,255,255,.7);line-height:1.6}
.objective strong{color:#C9A84C}

/* Quick actions */
.actions{display:flex;gap:4px;flex-wrap:wrap}
.action{font-size:.7rem;padding:4px 10px;border-radius:6px;background:rgba(255,255,255,.03);color:rgba(255,255,255,.35);border:1px solid rgba(255,255,255,.06)}

.footer{text-align:center;margin-top:40px;color:rgba(255,255,255,.08);font-size:.75rem;font-family:'JetBrains Mono',monospace}
</style>
</head>

        <div class="actions">${role.quickActions.map(a => `<div class="action">${a}</div>`).join('')}</div>
      </div>` : ''}

      <div class="section">
        <div class="section-title">Sidebar Navigation</div>
        ${Object.entries(role.navGroups).map(([group, items]) => `
          <div class="nav-group">
            <div class="nav-group-label">${group}</div>
            <div class="nav-items">${items.map(i => `<div class="nav-item">${i}</div>`).join('')}</div>
          </div>
        `).join('')}
      </div>

      ${role.kpis.length ? `
      <div class="section">
        <div class="section-title">KPIs</div>
        <div class="kpi-row">${role.kpis.map(k => `<div class="kpi"><div class="val">${k.val}</div><div class="lbl">${k.lbl}</div></div>`).join('')}</div>
      </div>` : ''}

      <div class="section">
        <div class="section-title">Dashboard Widgets</div>
        <div class="widgets">${role.widgets.map(w => `<div class="widget">${w}</div>`).join('')}</div>
      </div>

      <div class="section">
        <div class="section-title">Ticket Visibility (Workflow Stages)</div>
        <div class="ticket-stages">${ALL_STAGES.map(s => `<div class="ticket-stage ${role.ticketStages.includes(s) ? 'yes' : 'no'}">${s.replace(/_/g,' ')}</div>`).join('')}</div>
      </div>

      <div class="section">
        <div class="section-title">Permissions</div>
        <div class="perms">${Object.entries(role.perms).map(([k,v]) => `<div class="perm ${v ? 'yes' : 'no'}">${v ? '✓' : '✗'} ${k}</div>`).join('')}</div>
      </div>

      ${role.notifications.length ? `
      <div class="section">
        <div class="section-title">Smart Notifications</div>
        <div class="notif-list">${role.notifications.map(n => `<div class="notif"><div class="notif-dot ${n.type}"></div>${n.text}</div>`).join('')}</div>
      </div>` : ''}
    </div>
  `;
  container.appendChild(div);
});
</script>
</body>
</html>
