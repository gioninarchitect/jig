services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: tntza
      POSTGRES_PASSWORD: tntza
      POSTGRES_DB: tntza
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tntza"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build: ./backend
    ports:
      - "4000:4000"
    environment:
      DATABASE_URL: postgresql://tntza:tntza@postgres:5432/tntza
      JWT_SECRET: ${JWT_SECRET:-tnt-za-dev-secret-change-in-production}
      PORT: 4000
      CORS_ORIGIN: http://localhost
      NODE_ENV: production
    depends_on:
      postgres:
        condition: service_healthy

  frontend:
    build: ./frontend
    ports:
      - "80:80"
    depends_on:
      - backend

volumes:
  pgdata:
