<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Shopping Cart - Origin by ILCO Farming</title>
    <link rel="icon" type="image/png" href="images/origin-logo.png">
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;500;600;700;800;900&family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
    <style>
        :root {
            /* Origin by ILCO Farming Brand Colors */
            --black: #0E0E0E;
            --white: #FAFAFA;
            --or-gold: #C9A84C;
            --or-gold-muted: #8B6914;
            --or-gold-bright: #D4B86A;
            --or-black: #0A0A0A;
            --or-white: #F5F0E8;
            --or-dark: #141414;
            --or-dark-2: #1C1C1C;
            --or-gold: #C9A84C;
            --or-gold-light: #E8D5A3;
            --or-grey-2: #A89F8C;
            --or-grey-3: #6B6458;
            --or-grad-brand: linear-gradient(135deg, #8B6914 0%, #C9A84C 40%, #E8D5A3 70%, #C9A84C 100%);
            --green: #C9A84C;
            --green-dark: #8B6914;
            --green-light: #D4B86A;
            --amber: #C9A84C;
            --amber-dark: #8B6914;
            --amber-light: #E8D5A3;
            --slate: #1A1A1A;
            --slate-light: #222222;
            /* Legacy aliases */
            --cream: #1A1A1A;
            --green-deep: #8B6914;
            --gold: #C9A84C;
            --gold-dark: #8B6914;
            --gold-light: #E8D5A3;
            --red: #DC2626;
            --red-dark: #B91C1C;
            --red-light: #EF4444;
            /* Neutrals (inverted for dark theme) */
            --gray-50: #111111;
            --gray-100: #1A1A1A;
            --gray-200: #222222;
            --gray-300: #3A3A3A;
            --gray-400: #6B7280;
            --gray-500: #9CA3AF;
            --gray-600: #D1D5DB;
            --gray-700: #E5E7EB;
            --gray-800: #F3F4F6;
            --gray-900: #FAFAFA;
            /* Semantic */
            --success: #22C55E;
            --warning: #F8C242;
            --danger: #DC2626;
            --error: #EF4444;
            --info: #3B82F6;
            /* Shadows */
            --shadow-sm: 0 2px 8px rgba(0,0,0,0.3);
            --shadow-md: 0 8px 24px rgba(0,0,0,0.4);
            --shadow-lg: 0 16px 48px rgba(0,0,0,0.5);
            --shadow-xl: 0 24px 60px rgba(0,0,0,0.6);
            --shadow-or-gold: 0 8px 32px rgba(201,168,76,0.25);
            --shadow-gold: 0 8px 32px rgba(240,165,0,0.2);
            --shadow-green: 0 8px 32px rgba(139,105,20,0.2);
            --shadow-red: 0 8px 32px rgba(220,38,38,0.2);
            /* Gradients */
            --gradient-brand: linear-gradient(135deg, #8B6914 0%, #C9A84C 40%, #E8D5A3 70%, #C9A84C 100%);
            --gradient-dark: linear-gradient(180deg, #1A1A1A 0%, #0E0E0E 100%);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            background: #0A0A0A;
            color: var(--or-white);
            min-height: 100vh;
        }

        header {
            background: linear-gradient(135deg, #1A1A1A 0%, #0E0E0E 100%);
            padding: 1rem 2rem;
            border-bottom: 3px solid var(--gold);
        }

        nav {
            display: flex;
            justify-content: space-between;
            align-items: center;
            max-width: 1400px;
            margin: 0 auto;
        }

        .logo {
            font-family: 'Cinzel', sans-serif;
            font-size: 1.5rem;
            font-weight: bold;
            color: var(--cream);
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .nav-links {
            display: flex;
            gap: 2rem;
            align-items: center;
        }

        .nav-links a {
            color: var(--cream);
            text-decoration: none;
            font-weight: 500;
            transition: color 0.3s ease;
        }

        .nav-links a:hover {
            color: var(--gold);
        }

        .container {
            max-width: 1200px;
            margin: 2rem auto;
            padding: 0 2rem;
        }

        .cart-header {
            font-family: 'Cinzel', sans-serif;
            font-size: 2.5rem;
            margin-bottom: 2rem;
            color: var(--or-gold-muted);
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .cart-content {
            display: grid;
            grid-template-columns: 2fr 1fr;
            gap: 2rem;
        }

        .cart-items {
            background: #1A1A1A;
            border-radius: 12px;
            padding: 2rem;
            box-shadow: 0 4px 20px rgba(0,0,0,0.3);
            border: 1px solid #222222;
        }

        .cart-item {
            display: grid;
            grid-template-columns: 100px 1fr auto auto auto;
            gap: 1rem;
            align-items: center;
            padding: 1rem 0;
            border-bottom: 1px solid rgba(63, 192, 65, 0.1);
        }

        .cart-item:last-child {
            border-bottom: none;
        }

        .item-image {
            width: 100px;
            height: 100px;
            border-radius: 8px;
            background: var(--or-black);
            object-fit: cover;
            border: 1px solid rgba(63, 192, 65, 0.1);
        }

        .item-details h3 {
            margin-bottom: 0.5rem;
            color: var(--or-gold-muted);
            font-weight: 600;
        }

        .item-details p {
            color: var(--green-light);
            font-size: 0.9rem;
        }

        .quantity-controls {
            display: flex;
            align-items: center;
            background: var(--or-black);
            border-radius: 8px;
            border: 1px solid rgba(63, 192, 65, 0.2);
        }

        .quantity-btn {
            padding: 0.5rem 0.75rem;
            background: none;
            border: none;
            color: var(--or-gold);
            cursor: pointer;
            font-size: 1.2rem;
            font-weight: 600;
            transition: all 0.3s ease;
        }

        .quantity-btn:hover {
            background: var(--or-gold);
            color: var(--cream);
        }

        .quantity-value {
            padding: 0 1rem;
            min-width: 40px;
            text-align: center;
            color: var(--or-gold-muted);
            font-weight: 600;
        }

        .item-price {
            font-size: 1.2rem;
            color: var(--or-gold-muted);
            font-weight: bold;
        }

        .remove-btn {
            background: none;
            border: none;
            color: var(--red);
            cursor: pointer;
            font-size: 1.5rem;
            transition: transform 0.3s ease;
        }

        .remove-btn:hover {
            transform: scale(1.1);
        }

        .cart-summary {
            background: #1A1A1A;
            border-radius: 12px;
            padding: 2rem;
            height: fit-content;
            position: sticky;
            top: 2rem;
            box-shadow: 0 4px 20px rgba(0,0,0,0.3);
            border: 1px solid #222222;
        }

        .summary-title {
            font-family: 'Cinzel', sans-serif;
            font-size: 1.5rem;
            margin-bottom: 1.5rem;
            color: var(--or-gold-muted);
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .summary-row {
            display: flex;
            justify-content: space-between;
            margin-bottom: 1rem;
            color: var(--or-white);
        }

        .summary-row.total {
            font-size: 1.25rem;
            font-weight: bold;
            padding-top: 1rem;
            border-top: 2px solid var(--gold);
            color: var(--or-gold-muted);
            margin-top: 1rem;
        }

        .coupon-section {
            margin: 1.5rem 0;
            padding: 1.5rem 0;
            border-top: 1px solid rgba(63, 192, 65, 0.1);
        }

        .coupon-input-group {
            display: flex;
            gap: 0.5rem;
        }

        .coupon-input {
            flex: 1;
            padding: 0.75rem;
            background: var(--or-black);
            border: 1px solid rgba(63, 192, 65, 0.2);
            border-radius: 8px;
            color: var(--or-gold-muted);
            font-family: 'Inter', sans-serif;
        }

        .coupon-input::placeholder {
            color: var(--green-light);
        }

        .coupon-input:focus {
            outline: none;
            border-color: var(--or-gold);
        }

        .apply-btn {
            padding: 0.75rem 1.5rem;
            background: var(--gold);
            border: none;
            border-radius: 8px;
            color: var(--or-gold-muted);
            cursor: pointer;
            font-weight: 600;
            transition: all 0.3s ease;
        }

        .apply-btn:hover {
            background: var(--gold-dark);
        }

        .checkout-btn {
            width: 100%;
            padding: 1rem;
            background: linear-gradient(135deg, #1A1A1A 0%, #0E0E0E 100%);
            border: none;
            border-radius: 8px;
            color: var(--cream);
            font-size: 1.1rem;
            font-weight: 600;
            cursor: pointer;
            margin-top: 2rem;
            text-transform: uppercase;
            letter-spacing: 1px;
            transition: all 0.3s ease;
            font-family: 'Cinzel', sans-serif;
        }

        .checkout-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 4px 15px rgba(63, 192, 65, 0.3);
        }

        .empty-cart {
            text-align: center;
            padding: 4rem;
            background: #1A1A1A;
            border-radius: 12px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.3);
            border: 1px solid #222222;
        }

        .empty-cart h2 {
            margin-bottom: 1rem;
            color: var(--or-gold-muted);
            font-family: 'Cinzel', sans-serif;
            text-transform: uppercase;
        }

        .empty-cart p {
            color: var(--green-light);
            margin-bottom: 1.5rem;
        }

        .shop-now-btn {
            display: inline-block;
            padding: 1rem 2rem;
            background: linear-gradient(135deg, #1A1A1A 0%, #0E0E0E 100%);
            border-radius: 8px;
            color: var(--cream);
            text-decoration: none;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 1px;
            font-family: 'Cinzel', sans-serif;
            transition: all 0.3s ease;
        }

        .shop-now-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 4px 15px rgba(63, 192, 65, 0.3);
        }

        @media (max-width: 768px) {
            .cart-content {
                grid-template-columns: 1fr;
            }

            .cart-item {
                grid-template-columns: 80px 1fr;
                gap: 0.75rem;
            }

            .cart-item .quantity-controls,
            .cart-item .item-price,
            .cart-item .remove-btn {
                grid-column: 2;
            }

            .item-image {
                width: 80px;
                height: 80px;
            }

            .cart-summary {
                position: static;
            }

            .cart-header {
                font-size: 2rem;
            }

            header {
                padding: 1rem;
            }

            .container {
                padding: 0 1rem;
            }
        }

        /* Toast Notification Styles */
        .toast-container {
            position: fixed;
            top: 20px;
            right: 20px;
            z-index: 10000;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .toast {
            min-width: 300px;
            max-width: 400px;
            padding: 16px 20px;
            border-radius: 12px;
            background: #1A1A1A;
            border: 1px solid #222222;
            box-shadow: 0 4px 20px rgba(63, 192, 65, 0.15);
            display: flex;
            align-items: flex-start;
            gap: 12px;
            animation: slideIn 0.3s ease;
        }

        .toast.removing {
            animation: slideOut 0.3s ease forwards;
        }

        @keyframes slideIn {
            from {
                transform: translateX(100%);
                opacity: 0;
            }
            to {
                transform: translateX(0);
                opacity: 1;
            }
        }

        @keyframes slideOut {
            from {
                transform: translateX(0);
                opacity: 1;
            }
            to {
                transform: translateX(100%);
                opacity: 0;
            }
        }

        .toast-icon {
            width: 24px;
            height: 24px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
            font-size: 14px;
            font-weight: bold;
        }

        .toast.success .toast-icon {
            background: rgba(63, 192, 65, 0.15);
            color: var(--or-gold);
        }

        .toast.error .toast-icon {
            background: rgba(220, 38, 38, 0.15);
            color: var(--red);
        }

        .toast.info .toast-icon {
            background: rgba(240, 165, 0, 0.15);
            color: var(--gold-dark);
        }

        .toast.warning .toast-icon {
            background: rgba(240, 165, 0, 0.2);
            color: var(--gold-dark);
        }

        .toast-content {
            flex: 1;
        }

        .toast-title {
            font-weight: 600;
            font-size: 14px;
            color: var(--or-gold-muted);
            margin-bottom: 4px;
        }

        .toast-message {
            font-size: 13px;
            color: var(--green-light);
            line-height: 1.4;
        }

        .toast-close {
            background: none;
            border: none;
            color: var(--green-light);
            cursor: pointer;
            padding: 0;
            font-size: 18px;
            line-height: 1;
            transition: color 0.3s ease;
        }

        .toast-close:hover {
            color: var(--or-gold-muted);
        }
    </style>
</head>
<body>
    <!-- Toast Container -->
    <div class="toast-container" id="toastContainer"></div>

    <header>
        <nav>
            <div class="logo">Origin by ILCO Farming</div>
            <div class="nav-links">
                <a href="index.html">Home</a>
                <a href="products.html">Products</a>
                <a href="dashboard.html">Account</a>
            </div>
        </nav>
    </header>

    <div class="container">
        <h1 class="cart-header">Shopping Cart</h1>
        
        <div id="cartContainer">
            <!-- Dynamic content -->
        </div>
    </div>

    <script src="/frontend/config.js"></script>
    <script src="/frontend/or-utils.js"></script>
    <script src="/frontend/or-auth.js"></script>
    <script>
        let cartItems = [];
        let couponDiscount = 0;
        let isAuthenticated = false;

        function getToken() {
            return sessionStorage.getItem('token') || localStorage.getItem('token');
        }

        // Check if user is logged in
        async function checkAuth() {
            const token = getToken();
            if (token) {
                try {
                    // Verify token by fetching cart
                    const response = await fetch(`${API_URL}/cart`, {
                        headers: {
                            'Authorization': `Bearer ${token}`
                        }
                    });
                    if (response.ok) {
                        isAuthenticated = true;
                        const data = await response.json();
                        cartItems = data.cart.items.map(item => ({
                            productId: item.product._id || item.product,
                            name: item.name,
                            price: item.price,
                            quantity: item.quantity,
                            image: item.image
                        }));
                    } else {
                        // Token invalid, use localStorage
                        isAuthenticated = false;
                        cartItems = JSON.parse(localStorage.getItem('cart')) || [];
                    }
                } catch (error) {
                    console.error('Auth check error:', error);
                    isAuthenticated = false;
                    cartItems = JSON.parse(localStorage.getItem('cart')) || [];
                }
            } else {
                // No token, use localStorage and normalize item format
                const rawCart = JSON.parse(localStorage.getItem('cart')) || [];
                // Normalize items to consistent format
                cartItems = rawCart.map(item => ({
                    productId: item.productId || item.id || item._id,
                    name: item.name,
                    price: item.price,
                    quantity: item.quantity || item.qty || 1,
                    image: item.image || '/images/origin-logo.png'
                }));
            }
            displayCart();
        }

        function displayCart() {
            const container = document.getElementById('cartContainer');
            
            if (cartItems.length === 0) {
                container.innerHTML = `
                    <div class="empty-cart">
                        <h2>Your cart is empty</h2>
                        <p>Add some amazing products to get started!</p>
                        <a href="products.html" class="shop-now-btn">Shop Now</a>
                    </div>
                `;
                return;
            }

            const subtotal = cartItems.reduce((sum, item) => sum + (item.price * item.quantity), 0);
            const shipping = subtotal > 100 ? 0 : 10;
            const total = subtotal - couponDiscount + shipping;

            container.innerHTML = `
                <div class="cart-content">
                    <div class="cart-items">
                        ${cartItems.map((item, index) => `
                            <div class="cart-item">
                                <img src="${item.image || '/images/origin-logo.png'}" alt="${item.name}" class="item-image" onerror="this.src='/images/origin-logo.png'">
                                <div class="item-details">
                                    <h3>${item.name}</h3>
                                    ${item.size ? `<p>Size: ${item.size}</p>` : ''}
                                    ${item.color ? `<p>Color: ${item.color}</p>` : ''}
                                </div>
                                <div class="quantity-controls">
                                    <button class="quantity-btn" onclick="updateQuantity(${index}, -1)">−</button>
                                    <span class="quantity-value">${item.quantity}</span>
                                    <button class="quantity-btn" onclick="updateQuantity(${index}, 1)">+</button>
                                </div>
                                <div class="item-price">R ${(item.price * item.quantity).toFixed(2)}</div>
                                <button class="remove-btn" onclick="removeItem(${index})">×</button>
                            </div>
                        `).join('')}
                    </div>

                    <div class="cart-summary">
                        <h2 class="summary-title">Order Summary</h2>
                        
                        <div class="summary-row">
                            <span>Subtotal</span>
                            <span>R ${subtotal.toFixed(2)}</span>
                        </div>

                        ${couponDiscount > 0 ? `
                            <div class="summary-row">
                                <span>Discount</span>
                                <span style="color: #4caf50;">-R ${couponDiscount.toFixed(2)}</span>
                            </div>
                        ` : ''}

                        <div class="summary-row">
                            <span>Shipping</span>
                            <span>${shipping === 0 ? 'FREE' : 'R ' + shipping.toFixed(2)}</span>
                        </div>

                        <div class="summary-row total">
                            <span>Total</span>
                            <span>R ${total.toFixed(2)}</span>
                        </div>

                        <div class="coupon-section">
                            <div class="coupon-input-group">
                                <input type="text" class="coupon-input" id="couponCode" placeholder="Enter voucher code" style="text-transform: uppercase;">
                                <button class="apply-btn" onclick="applyVoucher()">Apply</button>
                            </div>
                            <div id="voucherSuccess" style="display: none; margin-top: 10px; padding: 10px; background: rgba(34, 197, 94, 0.15); border: 1px solid #c3e6cb; border-radius: 4px; color: #155724;">
                                <i class="fas fa-check-circle"></i>
                                <span id="voucherSuccessMessage"></span>
                                <button onclick="removeVoucher()" style="float: right; background: none; border: none; color: #155724; cursor: pointer; font-weight: bold;">Remove</button>
                            </div>
                            <div id="voucherError" style="display: none; margin-top: 10px; padding: 10px; background: rgba(220, 38, 38, 0.15); border: 1px solid #f5c6cb; border-radius: 4px; color: #721c24;">
                                <i class="fas fa-exclamation-circle"></i>
                                <span id="voucherErrorMessage"></span>
                            </div>
                        </div>

                        <button class="checkout-btn" onclick="proceedToCheckout()">
                            Proceed to Checkout
                        </button>
                    </div>
                </div>
            `;
        }

        async function updateQuantity(index, change) {
            const newQuantity = Math.max(1, cartItems[index].quantity + change);

            if (isAuthenticated) {
                // Update via API
                try {
                    const token = getToken();
                    const response = await fetch(`${API_URL}/cart/item/${index}`, {
                        method: 'PUT',
                        headers: {
                            'Content-Type': 'application/json',
                            'Authorization': `Bearer ${token}`
                        },
                        body: JSON.stringify({ quantity: newQuantity })
                    });

                    if (response.ok) {
                        const data = await response.json();
                        cartItems = data.cart.items.map(item => ({
                            productId: item.product._id || item.product,
                            name: item.name,
                            price: item.price,
                            quantity: item.quantity,
                            image: item.image
                        }));
                        displayCart();
                    } else {
                        showToast('Update Failed', 'Failed to update cart. Please try again.', 'error');
                    }
                } catch (error) {
                    console.error('Update cart error:', error);
                    showToast('Error', 'Error updating cart. Please try again.', 'error');
                }
            } else {
                // Update localStorage
                cartItems[index].quantity = newQuantity;
                localStorage.setItem('cart', JSON.stringify(cartItems));
                displayCart();
            }
        }

        async function removeItem(index) {
            if (isAuthenticated) {
                // Remove via API
                try {
                    const token = getToken();
                    const response = await fetch(`${API_URL}/cart/item/${index}`, {
                        method: 'DELETE',
                        headers: {
                            'Authorization': `Bearer ${token}`
                        }
                    });

                    if (response.ok) {
                        const data = await response.json();
                        cartItems = data.cart.items.map(item => ({
                            productId: item.product._id || item.product,
                            name: item.name,
                            price: item.price,
                            quantity: item.quantity,
                            image: item.image
                        }));
                        displayCart();
                    } else {
                        showToast('Remove Failed', 'Failed to remove item. Please try again.', 'error');
                    }
                } catch (error) {
                    console.error('Remove item error:', error);
                    showToast('Error', 'Error removing item. Please try again.', 'error');
                }
            } else {
                // Remove from localStorage
                cartItems.splice(index, 1);
                localStorage.setItem('cart', JSON.stringify(cartItems));
                displayCart();
            }
        }

        let appliedVoucher = null;

        async function applyVoucher() {
            const code = document.getElementById('couponCode').value.trim().toUpperCase();

            if (!code) {
                showVoucherError('Please enter a voucher code');
                return;
            }

            // Hide previous messages
            document.getElementById('voucherSuccess').style.display = 'none';
            document.getElementById('voucherError').style.display = 'none';

            try {
                const token = getToken();
                const userId = token ? JSON.parse(atob(token.split('.')[1])).id : null;

                // Calculate cart total
                const cartTotal = cartItems.reduce((sum, item) => sum + (item.price * item.quantity), 0);

                // Validate voucher with API
                const response = await fetch(`${API_URL}/vouchers/validate`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        code: code,
                        cartTotal: cartTotal,
                        cartItems: cartItems.map(item => ({
                            productId: item.id,
                            name: item.name,
                            price: item.price,
                            quantity: item.quantity,
                            requiresSection21: item.requiresSection21 || false
                        })),
                        userId: userId
                    })
                });

                const data = await response.json();

                if (data.success) {
                    appliedVoucher = data.voucher;
                    couponDiscount = data.voucher.discountAmount;

                    showVoucherSuccess(`Voucher ${code} applied! You saved R${couponDiscount.toFixed(2)}`);
                    displayCart();
                } else {
                    showVoucherError(data.error || 'Invalid voucher code');
                }
            } catch (error) {
                console.error('Voucher validation error:', error);
                showVoucherError('Failed to validate voucher. Please try again.');
            }
        }

        function removeVoucher() {
            appliedVoucher = null;
            couponDiscount = 0;
            document.getElementById('couponCode').value = '';
            document.getElementById('voucherSuccess').style.display = 'none';
            document.getElementById('voucherError').style.display = 'none';
            displayCart();
        }

        function showVoucherSuccess(message) {
            document.getElementById('voucherSuccessMessage').textContent = message;
            document.getElementById('voucherSuccess').style.display = 'block';
            document.getElementById('voucherError').style.display = 'none';
        }

        function showVoucherError(message) {
            document.getElementById('voucherErrorMessage').textContent = message;
            document.getElementById('voucherError').style.display = 'block';
            document.getElementById('voucherSuccess').style.display = 'none';
        }

        function proceedToCheckout() {
            if (cartItems.length === 0) {
                showToast('Empty Cart', 'Your cart is empty. Add some products first.', 'warning');
                return;
            }
            // Save cart and voucher to localStorage for order page
            localStorage.setItem('checkoutCart', JSON.stringify(cartItems));
            if (appliedVoucher) {
                localStorage.setItem('appliedVoucher', JSON.stringify(appliedVoucher));
            } else {
                localStorage.removeItem('appliedVoucher');
            }
            window.location.href = 'order.html';
        }

        // Initialize
        checkAuth();
    </script>
</body>
</html>
