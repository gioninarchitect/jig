<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Wholesale POS - Origin by ILCO Farming</title>
    <link href="https://fonts.googleapis.com/css2?family=Yeseva+One&family=Montserrat:wght@400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>
        :root {
            /* Origin by ILCO Farming Brand Colors */
            --black: #0E0E0E;
            --white: #FAFAFA;
            --or-gold: #C9A84C;
            --or-gold-muted: #8B6914;
            --or-gold-bright: #D4B86A;
            --or-black: #0A0A0A;
            --or-white: #F5F0E8;
            --or-dark: #141414;
            --or-dark-2: #1C1C1C;
            --or-gold: #C9A84C;
            --or-gold-light: #E8D5A3;
            --or-grey-2: #A89F8C;
            --or-grey-3: #6B6458;
            --or-grad-brand: linear-gradient(135deg, #8B6914 0%, #C9A84C 40%, #E8D5A3 70%, #C9A84C 100%);
            --green: #C9A84C;
            --green-dark: #8B6914;
            --green-light: #D4B86A;
            --amber: #C9A84C;
            --amber-dark: #8B6914;
            --amber-light: #E8D5A3;
            --slate: #1A1A1A;
            --slate-light: #222222;
            /* Legacy aliases */
            --cream: #1A1A1A;
            --green-deep: #8B6914;
            --gold: #C9A84C;
            --gold-dark: #8B6914;
            --gold-light: #E8D5A3;
            --red: #DC2626;
            --red-dark: #B91C1C;
            --red-light: #EF4444;
            /* Neutrals (inverted for dark theme) */
            --gray-50: #111111;
            --gray-100: #1A1A1A;
            --gray-200: #222222;
            --gray-300: #3A3A3A;
            --gray-400: #6B7280;
            --gray-500: #9CA3AF;
            --gray-600: #D1D5DB;
            --gray-700: #E5E7EB;
            --gray-800: #F3F4F6;
            --gray-900: #FAFAFA;
            /* Semantic */
            --success: #22C55E;
            --warning: #F8C242;
            --danger: #DC2626;
            --error: #EF4444;
            --info: #3B82F6;
            /* Shadows */
            --shadow-sm: 0 2px 8px rgba(0,0,0,0.3);
            --shadow-md: 0 8px 24px rgba(0,0,0,0.4);
            --shadow-lg: 0 16px 48px rgba(0,0,0,0.5);
            --shadow-xl: 0 24px 60px rgba(0,0,0,0.6);
            --shadow-or-gold: 0 8px 32px rgba(201,168,76,0.25);
            --shadow-gold: 0 8px 32px rgba(240,165,0,0.2);
            --shadow-green: 0 8px 32px rgba(139,105,20,0.2);
            --shadow-red: 0 8px 32px rgba(220,38,38,0.2);
            /* Gradients */
            --gradient-brand: linear-gradient(135deg, #8B6914 0%, #C9A84C 40%, #E8D5A3 70%, #C9A84C 100%);
            --gradient-dark: linear-gradient(180deg, #1A1A1A 0%, #0E0E0E 100%);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Montserrat', sans-serif;
            background: var(--bg-dark);
            color: var(--text-primary);
            min-height: 100vh;
        }

        .wholesale-container {
            display: flex;
            height: 100vh;
        }

        /* Left Panel - Order */
        .order-panel {
            width: 450px;
            background: var(--bg-panel);
            border-right: 3px solid var(--gold);
            display: flex;
            flex-direction: column;
        }

        .order-header {
            padding: 15px 20px;
            border-bottom: 1px solid var(--bg-card);
        }

        .order-header h1 {
            font-family: 'Yeseva One', serif;
            font-size: 1.5rem;
            color: var(--gold);
            margin-bottom: 10px;
        }

        /* Customer Select */
        .customer-select {
            background: var(--bg-card);
            border: none;
            color: var(--text-primary);
            padding: 12px 15px;
            border-radius: 8px;
            width: 100%;
            font-size: 1rem;
            cursor: pointer;
        }

        .customer-info {
            margin-top: 10px;
            padding: 10px;
            background: var(--bg-dark);
            border-radius: 8px;
            font-size: 0.85rem;
        }

        .customer-info .label {
            color: var(--text-secondary);
        }

        .customer-info .credit {
            color: var(--or-gold);
            font-weight: 600;
        }

        /* Order Items */
        .order-items {
            flex: 1;
            overflow-y: auto;
            padding: 15px;
        }

        .order-item {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 12px;
            background: var(--bg-card);
            border-radius: 8px;
            margin-bottom: 10px;
        }

        .order-item-info {
            flex: 1;
        }

        .order-item-name {
            font-weight: 600;
            margin-bottom: 3px;
        }

        .order-item-sku {
            font-size: 0.8rem;
            color: var(--text-secondary);
        }

        .order-item-qty {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .qty-btn {
            width: 30px;
            height: 30px;
            border: none;
            border-radius: 6px;
            background: var(--bg-dark);
            color: var(--text-primary);
            cursor: pointer;
            font-size: 1rem;
        }

        .qty-btn:hover { background: var(--gold); color: var(--bg-dark); }

        .qty-input {
            width: 60px;
            text-align: center;
            background: var(--bg-dark);
            border: none;
            color: var(--text-primary);
            padding: 8px;
            border-radius: 6px;
            font-size: 1rem;
        }

        .order-item-price {
            text-align: right;
            min-width: 100px;
        }

        .order-item-unit {
            font-size: 0.8rem;
            color: var(--text-secondary);
        }

        .order-item-line {
            font-weight: 600;
            color: var(--gold);
        }

        .remove-item {
            color: var(--red);
            cursor: pointer;
            padding: 5px;
        }

        /* Order Totals */
        .order-totals {
            padding: 15px 20px;
            background: var(--bg-dark);
            border-top: 1px solid var(--bg-card);
        }

        .total-row {
            display: flex;
            justify-content: space-between;
            padding: 8px 0;
        }

        .total-row.grand {
            font-size: 1.3rem;
            font-weight: 700;
            color: var(--gold);
            border-top: 2px solid var(--gold);
            margin-top: 10px;
            padding-top: 15px;
        }

        /* Action Buttons */
        .order-actions {
            padding: 15px;
            display: flex;
            gap: 10px;
        }

        .action-btn {
            flex: 1;
            padding: 15px;
            border: none;
            border-radius: 8px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }

        .btn-quote {
            background: var(--blue);
            color: white;
        }

        .btn-order {
            background: var(--gold);
            color: var(--bg-dark);
        }

        .btn-clear {
            background: var(--bg-card);
            color: var(--text-primary);
            flex: 0.5;
        }

        /* Right Panel - Products */
        .products-panel {
            flex: 1;
            display: flex;
            flex-direction: column;
            padding: 20px;
        }

        .search-bar {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
        }

        .search-input {
            flex: 1;
            padding: 12px 15px;
            background: var(--bg-panel);
            border: 1px solid var(--bg-card);
            border-radius: 8px;
            color: var(--text-primary);
            font-size: 1rem;
        }

        .search-input:focus {
            outline: none;
            border-color: var(--gold);
        }

        .category-filter {
            padding: 12px 20px;
            background: var(--bg-panel);
            border: 1px solid var(--bg-card);
            border-radius: 8px;
            color: var(--text-primary);
        }

        /* Products Grid */
        .products-grid {
            flex: 1;
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
            gap: 15px;
            overflow-y: auto;
            padding-right: 10px;
        }

        .product-card {
            background: var(--bg-panel);
            border-radius: 10px;
            padding: 15px;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
            border: 2px solid transparent;
        }

        .product-card:hover {
            transform: translateY(-3px);
            box-shadow: 0 8px 20px rgba(0,0,0,0.3);
            border-color: var(--gold);
        }

        .product-name {
            font-weight: 600;
            margin-bottom: 5px;
        }

        .product-sku {
            font-size: 0.8rem;
            color: var(--text-secondary);
            margin-bottom: 10px;
        }

        .product-prices {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .retail-price {
            font-size: 0.85rem;
            color: var(--text-secondary);
            text-decoration: line-through;
        }

        .wholesale-price {
            font-size: 1.1rem;
            font-weight: 700;
            color: var(--gold);
        }

        .product-stock {
            font-size: 0.8rem;
            margin-top: 8px;
            color: var(--or-gold);
        }

        .product-stock.low {
            color: var(--red);
        }

        /* Quick Add Modal */
        .modal-overlay {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0,0,0,0.7);
            align-items: center;
            justify-content: center;
            z-index: 1000;
        }

        .modal-overlay.active {
            display: flex;
        }

        .modal {
            background: var(--bg-panel);
            border-radius: 12px;
            padding: 25px;
            min-width: 350px;
            max-width: 90%;
        }

        .modal h2 {
            font-family: 'Yeseva One', serif;
            color: var(--gold);
            margin-bottom: 20px;
        }

        .modal-field {
            margin-bottom: 15px;
        }

        .modal-field label {
            display: block;
            margin-bottom: 5px;
            color: var(--text-secondary);
        }

        .modal-field input {
            width: 100%;
            padding: 12px;
            background: var(--bg-dark);
            border: 1px solid var(--bg-card);
            border-radius: 8px;
            color: var(--text-primary);
            font-size: 1rem;
        }

        .modal-actions {
            display: flex;
            gap: 10px;
            margin-top: 20px;
        }

        .modal-actions button {
            flex: 1;
            padding: 12px;
            border: none;
            border-radius: 8px;
            font-weight: 600;
            cursor: pointer;
        }

        .modal-cancel {
            background: var(--bg-card);
            color: var(--text-primary);
        }

        .modal-confirm {
            background: var(--gold);
            color: var(--bg-dark);
        }

        /* Toast */
        .toast {
            position: fixed;
            bottom: 20px;
            right: 20px;
            padding: 15px 25px;
            background: var(--or-gold);
            color: white;
            border-radius: 8px;
            font-weight: 600;
            transform: translateY(100px);
            opacity: 0;
            transition: all 0.3s;
            z-index: 2000;
        }

        .toast.show {
            transform: translateY(0);
            opacity: 1;
        }

        .toast.error {
            background: var(--red);
        }

        /* ===== MOBILE TAB SWITCHER ===== */
        .mobile-tab-bar {
            display: none;
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            background: var(--bg-panel);
            border-top: 2px solid var(--gold);
            z-index: 900;
            padding: 0;
        }

        .mobile-tab-bar .tab-row {
            display: flex;
        }

        .mobile-tab-bar button {
            flex: 1;
            padding: 12px 0;
            border: none;
            background: transparent;
            color: var(--text-secondary);
            font-weight: 600;
            font-size: 0.85rem;
            cursor: pointer;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 3px;
        }

        .mobile-tab-bar button.active {
            color: var(--gold);
            background: rgba(240, 165, 0, 0.1);
        }

        .mobile-tab-bar button i {
            font-size: 1.1rem;
        }

        /* ===== RESPONSIVE ===== */

        @media (max-width: 900px) {
            .wholesale-container {
                flex-direction: column;
                height: auto;
                min-height: 100vh;
            }

            .order-panel {
                width: 100%;
                border-right: none;
                border-bottom: 2px solid var(--gold);
                max-height: none;
            }

            .products-panel {
                padding: 15px;
            }

            .products-grid {
                grid-template-columns: repeat(auto-fill, minmax(160px, 1fr));
                gap: 10px;
            }

            .search-bar {
                flex-direction: column;
                gap: 8px;
            }
        }

        @media (max-width: 600px) {
            .mobile-tab-bar { display: block; }

            .wholesale-container {
                flex-direction: column;
                height: auto;
                padding-bottom: 60px; /* space for bottom tabs */
            }

            .order-panel {
                width: 100%;
                border-right: none;
                border-bottom: none;
                min-height: calc(100vh - 60px);
            }

            .order-panel.mobile-hidden { display: none; }
            .products-panel.mobile-hidden { display: none; }

            .products-panel {
                padding: 12px;
                min-height: calc(100vh - 60px);
            }

            .products-grid {
                grid-template-columns: repeat(2, 1fr);
                gap: 8px;
            }

            .product-card {
                padding: 10px;
            }

            .product-name {
                font-size: 0.85rem;
            }

            .wholesale-price {
                font-size: 0.95rem;
            }

            .product-stock {
                font-size: 0.75rem;
            }

            .order-header h1 {
                font-size: 1.2rem;
            }

            .order-item {
                padding: 10px;
                gap: 8px;
            }

            .order-item-name { font-size: 0.9rem; }
            .order-item-price { min-width: 80px; }
            .qty-input { width: 45px; font-size: 0.9rem; padding: 6px; }
            .qty-btn { width: 28px; height: 28px; font-size: 0.9rem; }

            .order-actions {
                padding: 10px;
                gap: 8px;
            }

            .action-btn {
                padding: 12px 8px;
                font-size: 0.85rem;
            }

            .total-row.grand {
                font-size: 1.1rem;
            }

            .modal {
                min-width: auto;
                width: 90%;
                margin: 15px;
            }

            .search-bar {
                flex-direction: column;
                gap: 8px;
                margin-bottom: 12px;
            }
        }

        /* Empty State */
        .empty-order {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            color: var(--text-secondary);
        }

        .empty-order i {
            font-size: 3rem;
            margin-bottom: 15px;
            opacity: 0.5;
        }
    </style>
</head>
<body>
    <div class="wholesale-container">
        <!-- Left Panel - Order -->
        <div class="order-panel">
            <div class="order-header">
                <h1><i class="fas fa-warehouse"></i> Wholesale Order</h1>
                <div style="display:flex;gap:8px;align-items:center;">
                    <select class="customer-select" id="customerSelect" onchange="selectCustomer()" style="flex:1;">
                        <option value="">-- Select Customer --</option>
                    </select>
                    <button onclick="openNewCustomerModal()" style="background:#C9A84C;color:#0E0E0E;border:none;border-radius:6px;padding:8px 14px;cursor:pointer;white-space:nowrap;font-size:0.85rem;font-weight:600;" title="Add New Customer"><i class="fas fa-plus"></i></button>
                </div>
                <div class="customer-info" id="customerInfo" style="display: none;">
                    <div><span class="label">Type:</span> <span id="customerType">-</span></div>
                    <div><span class="label">Terms:</span> <span id="customerTerms">-</span></div>
                    <div><span class="label">Credit Available:</span> <span class="credit" id="customerCredit">-</span></div>
                </div>
            </div>

            <div class="order-items" id="orderItems">
                <div class="empty-order">
                    <i class="fas fa-box-open"></i>
                    <p>Add products to order</p>
                </div>
            </div>

            <div class="order-totals">
                <div class="total-row">
                    <span>Subtotal</span>
                    <span id="subtotal">R0.00</span>
                </div>
                <div class="total-row">
                    <span>VAT (15%)</span>
                    <span id="vatAmount">R0.00</span>
                </div>
                <div class="total-row grand">
                    <span>Total</span>
                    <span id="grandTotal">R0.00</span>
                </div>
            </div>

            <div class="order-actions">
                <button class="action-btn btn-clear" onclick="clearOrder()">
                    <i class="fas fa-trash"></i>
                </button>
                <button class="action-btn btn-quote" onclick="createOrder('quote')">
                    <i class="fas fa-file-invoice"></i> Quote
                </button>
                <button class="action-btn btn-order" onclick="createOrder('order')">
                    <i class="fas fa-check"></i> Order
                </button>
            </div>
        </div>

        <!-- Right Panel - Products -->
        <div class="products-panel">
            <div class="search-bar">
                <input type="text" class="search-input" id="searchInput" placeholder="Search products..." oninput="filterProducts()">
                <select class="category-filter" id="categoryFilter" onchange="filterProducts()">
                    <option value="">All Categories</option>
                    <option value="flower">Flower</option>
                    <option value="pre-rolls">Pre-Rolls</option>
                    <option value="concentrates">Concentrates</option>
                    <option value="edibles">Edibles</option>
                    <option value="oils">Oils</option>
                    <option value="accessories">Accessories</option>
                </select>
            </div>

            <div class="products-grid" id="productsGrid">
                <!-- Products loaded dynamically -->
            </div>
        </div>
    </div>

    <!-- Quick Add Modal -->
    <div class="modal-overlay" id="quickAddModal">
        <div class="modal">
            <h2 id="modalProductName">Product Name</h2>
            <div class="modal-field">
                <label>Quantity</label>
                <input type="number" id="modalQty" min="1" value="10">
            </div>
            <div class="modal-field">
                <label>Unit Price</label>
                <input type="number" id="modalPrice" step="0.01" readonly>
            </div>
            <div class="modal-field">
                <label>Line Total</label>
                <input type="text" id="modalTotal" readonly>
            </div>
            <div class="modal-actions">
                <button class="modal-cancel" onclick="closeModal()">Cancel</button>
                <button class="modal-confirm" onclick="confirmAddItem()">Add to Order</button>
            </div>
        </div>
    </div>

    <div class="toast" id="toast"></div>

    <!-- Origin Shared Libraries -->
    <script src="frontend/config.js"></script>
    <script src="frontend/or-utils.js"></script>
    <script src="frontend/or-auth.js"></script>

    <script>

        let token = sessionStorage.getItem('adminToken') || localStorage.getItem('token');
        let customers = [];
        let products = [];
        let selectedCustomer = null;
        let orderItems = [];
        let selectedProduct = null;

        // Allowed roles — ONLY owner, inventory_manager, admin, super_admin
        const WHOLESALE_ALLOWED_ROLES = ['super_admin', 'admin', 'owner', 'inventory_manager'];

        // Initialize
        document.addEventListener('DOMContentLoaded', async () => {
            if (!token) {
                window.location.href = '/login.html';
                return;
            }

            // RBAC check — decode token and verify role
            try {
                const payload = JSON.parse(atob(token.split('.')[1]));
                const userRole = payload.role || '';
                if (!WHOLESALE_ALLOWED_ROLES.includes(userRole)) {
                    showToast('Access denied. Wholesale is restricted to Owner and Inventory Manager.', true);
                    setTimeout(() => { window.location.href = '/login.html'; }, 2000);
                    return;
                }
            } catch (e) {
                window.location.href = '/login.html';
                return;
            }

            await loadCustomers();
            await loadProducts();
        });

        // Load customers
        async function loadCustomers() {
            try {
                const res = await fetch(`${API_URL}/wholesale/customers`, {
                    headers: { 'Authorization': `Bearer ${token}` }
                });
                const data = await res.json();
                if (data.success) {
                    customers = data.data;
                    renderCustomerSelect();
                }
            } catch (error) {
                showToast('Failed to load customers', true);
            }
        }

        function renderCustomerSelect() {
            const select = document.getElementById('customerSelect');
            select.innerHTML = '<option value="">-- Select Customer --</option>';
            customers.forEach(c => {
                const opt = document.createElement('option');
                opt.value = c._id;
                opt.textContent = `${c.businessName} (${c.customerType})`;
                select.appendChild(opt);
            });
        }

        function selectCustomer() {
            const id = document.getElementById('customerSelect').value;
            selectedCustomer = customers.find(c => c._id === id);

            const info = document.getElementById('customerInfo');
            if (selectedCustomer) {
                info.style.display = 'block';
                document.getElementById('customerType').textContent = selectedCustomer.customerType;
                document.getElementById('customerTerms').textContent = selectedCustomer.paymentTerms;

                const available = selectedCustomer.creditLimit - selectedCustomer.currentBalance;
                document.getElementById('customerCredit').textContent = `R${available.toFixed(2)}`;
            } else {
                info.style.display = 'none';
            }
        }

        // Load products
        async function loadProducts() {
            try {
                const res = await fetch(`${API_URL}/products?limit=500`, {
                    headers: { 'Authorization': `Bearer ${token}` }
                });
                const data = await res.json();
                if (data.success) {
                    products = data.products || data.data?.products || data.data || [];
                    renderProducts();
                }
            } catch (error) {
                showToast('Failed to load products', true);
            }
        }

        function renderProducts() {
            const grid = document.getElementById('productsGrid');
            const search = document.getElementById('searchInput').value.toLowerCase();
            const category = document.getElementById('categoryFilter').value;

            let filtered = products.filter(p => {
                const matchSearch = !search || p.name.toLowerCase().includes(search) || p.sku?.toLowerCase().includes(search);
                const matchCategory = !category || p.category === category;
                return matchSearch && matchCategory;
            });

            grid.innerHTML = filtered.map(p => {
                const stock = p.inventory?.quantity || 0;
                const wholesalePrice = p.wholesalePrice || p.price * 0.7;

                return `
                    <div class="product-card" onclick="openQuickAdd('${p._id}')">
                        <div class="product-name">${p.name}</div>
                        <div class="product-sku">${p.sku || '-'}</div>
                        <div class="product-prices">
                            <span class="retail-price">R${p.price.toFixed(2)}</span>
                            <span class="wholesale-price">R${wholesalePrice.toFixed(2)}</span>
                        </div>
                        <div class="product-stock ${stock < 10 ? 'low' : ''}">${stock} in stock</div>
                    </div>
                `;
            }).join('');
        }

        function filterProducts() {
            renderProducts();
        }

        // Quick Add Modal
        function openQuickAdd(productId) {
            selectedProduct = products.find(p => p._id === productId);
            if (!selectedProduct) return;

            const wholesalePrice = selectedProduct.wholesalePrice || selectedProduct.price * 0.7;

            document.getElementById('modalProductName').textContent = selectedProduct.name;
            document.getElementById('modalQty').value = selectedProduct.minWholesaleQty || 10;
            document.getElementById('modalPrice').value = wholesalePrice.toFixed(2);
            updateModalTotal();

            document.getElementById('quickAddModal').classList.add('active');
            document.getElementById('modalQty').focus();
        }

        function closeModal() {
            document.getElementById('quickAddModal').classList.remove('active');
            selectedProduct = null;
        }

        document.getElementById('modalQty').addEventListener('input', updateModalTotal);

        function updateModalTotal() {
            const qty = parseFloat(document.getElementById('modalQty').value) || 0;
            const price = parseFloat(document.getElementById('modalPrice').value) || 0;
            document.getElementById('modalTotal').value = `R${(qty * price).toFixed(2)}`;
        }

        function confirmAddItem() {
            const qty = parseInt(document.getElementById('modalQty').value) || 0;
            const price = parseFloat(document.getElementById('modalPrice').value) || 0;

            if (qty < 1) {
                showToast('Quantity must be at least 1', true);
                return;
            }

            // Check if already in order
            const existing = orderItems.find(i => i.productId === selectedProduct._id);
            if (existing) {
                existing.quantity += qty;
                existing.lineTotal = existing.quantity * existing.unitPrice;
            } else {
                orderItems.push({
                    productId: selectedProduct._id,
                    sku: selectedProduct.sku,
                    name: selectedProduct.name,
                    quantity: qty,
                    unitPrice: price,
                    lineTotal: qty * price
                });
            }

            renderOrderItems();
            closeModal();
            showToast(`Added ${qty}x ${selectedProduct.name}`);
        }

        // Order Items
        function renderOrderItems() {
            const container = document.getElementById('orderItems');

            if (orderItems.length === 0) {
                container.innerHTML = `
                    <div class="empty-order">
                        <i class="fas fa-box-open"></i>
                        <p>Add products to order</p>
                    </div>
                `;
                updateTotals();
                return;
            }

            container.innerHTML = orderItems.map((item, idx) => `
                <div class="order-item">
                    <div class="order-item-info">
                        <div class="order-item-name">${item.name}</div>
                        <div class="order-item-sku">${item.sku || ''}</div>
                    </div>
                    <div class="order-item-qty">
                        <button class="qty-btn" onclick="updateQty(${idx}, -1)">-</button>
                        <input type="number" class="qty-input" value="${item.quantity}" onchange="setQty(${idx}, this.value)">
                        <button class="qty-btn" onclick="updateQty(${idx}, 1)">+</button>
                    </div>
                    <div class="order-item-price">
                        <div class="order-item-unit">R${item.unitPrice.toFixed(2)} ea</div>
                        <div class="order-item-line">R${item.lineTotal.toFixed(2)}</div>
                    </div>
                    <i class="fas fa-times remove-item" onclick="removeItem(${idx})"></i>
                </div>
            `).join('');

            updateTotals();
        }

        function updateQty(idx, delta) {
            orderItems[idx].quantity = Math.max(1, orderItems[idx].quantity + delta);
            orderItems[idx].lineTotal = orderItems[idx].quantity * orderItems[idx].unitPrice;
            renderOrderItems();
        }

        function setQty(idx, val) {
            orderItems[idx].quantity = Math.max(1, parseInt(val) || 1);
            orderItems[idx].lineTotal = orderItems[idx].quantity * orderItems[idx].unitPrice;
            renderOrderItems();
        }

        function removeItem(idx) {
            orderItems.splice(idx, 1);
            renderOrderItems();
        }

        function updateTotals() {
            const subtotal = orderItems.reduce((sum, i) => sum + i.lineTotal, 0);
            const vat = subtotal * 0.15;
            const total = subtotal + vat;

            document.getElementById('subtotal').textContent = `R${subtotal.toFixed(2)}`;
            document.getElementById('vatAmount').textContent = `R${vat.toFixed(2)}`;
            document.getElementById('grandTotal').textContent = `R${total.toFixed(2)}`;
        }

        function clearOrder() {
            orderItems = [];
            renderOrderItems();
        }

        // Create Order
        async function createOrder(type) {
            if (!selectedCustomer) {
                showToast('Please select a customer', true);
                return;
            }

            if (orderItems.length === 0) {
                showToast('Add items to the order', true);
                return;
            }

            try {
                const res = await fetch(`${API_URL}/wholesale/orders`, {
                    method: 'POST',
                    headers: {
                        'Authorization': `Bearer ${token}`,
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        customerId: selectedCustomer._id,
                        items: orderItems.map(i => ({
                            productId: i.productId,
                            quantity: i.quantity
                        })),
                        orderType: type
                    })
                });

                const data = await res.json();
                if (data.success) {
                    showToast(`${type === 'quote' ? 'Quote' : 'Order'} created: ${data.data.orderNumber}`);
                    clearOrder();
                    document.getElementById('customerSelect').value = '';
                    selectCustomer();
                } else {
                    showToast(data.message || 'Failed to create order', true);
                }
            } catch (error) {
                showToast('Error creating order', true);
            }
        }

        // showToast provided by /frontend/or-utils.js (handles boolean isError pattern)

        // ============================================
        // New Customer Modal
        // ============================================
        function openNewCustomerModal() {
            document.getElementById('newCustomerModal').style.display = 'flex';
        }

        function closeNewCustomerModal() {
            document.getElementById('newCustomerModal').style.display = 'none';
        }

        async function saveNewCustomer() {
            const businessName = document.getElementById('ncBusinessName').value.trim();
            const contactName = document.getElementById('ncContactName').value.trim();
            const contactEmail = document.getElementById('ncContactEmail').value.trim();
            const contactPhone = document.getElementById('ncContactPhone').value.trim();
            const customerType = document.getElementById('ncCustomerType').value;
            const paymentTerms = document.getElementById('ncPaymentTerms').value;

            if (!businessName || !contactName || !contactEmail || !contactPhone) {
                showToast('Please fill in all required fields', true);
                return;
            }

            try {
                const res = await fetch(`${API_URL}/wholesale/customers`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${token}` },
                    body: JSON.stringify({
                        businessName,
                        customerType,
                        contactPerson: { name: contactName, email: contactEmail, phone: contactPhone },
                        paymentTerms,
                        creditLimit: customerType === 'internal_branch' ? 50000 : 15000,
                        priceTier: 'standard',
                        status: 'active'
                    })
                });
                const data = await res.json();
                if (data.success) {
                    showToast(`Customer "${businessName}" created`);
                    closeNewCustomerModal();
                    await loadCustomers();
                    // Auto-select the new customer
                    const select = document.getElementById('customerSelect');
                    select.value = data.data._id;
                    selectCustomer();
                } else {
                    showToast(data.message || 'Failed to create customer', true);
                }
            } catch (err) {
                showToast('Error creating customer', true);
            }
        }

        // Keyboard shortcut
        document.addEventListener('keydown', e => {
            if (e.key === 'Escape') { closeModal(); closeNewCustomerModal(); }
        });

        // Mobile tab switcher — toggle between Order and Products panels
        function switchWholesaleTab(tab) {
            const orderPanel = document.querySelector('.order-panel');
            const productsPanel = document.querySelector('.products-panel');
            const btns = document.querySelectorAll('#wholesaleMobileBar button');

            btns.forEach(b => b.classList.remove('active'));

            if (tab === 'order') {
                orderPanel.classList.remove('mobile-hidden');
                productsPanel.classList.add('mobile-hidden');
                btns[0].classList.add('active');
            } else {
                orderPanel.classList.add('mobile-hidden');
                productsPanel.classList.remove('mobile-hidden');
                btns[1].classList.add('active');
            }
        }
    </script>

    <!-- Mobile Tab Bar (wholesale) -->
    <div class="mobile-tab-bar" id="wholesaleMobileBar">
        <div class="tab-row">
            <button class="active" onclick="switchWholesaleTab('order')">
                <i class="fas fa-file-invoice-dollar"></i>
                <span>Order</span>
            </button>
            <button onclick="switchWholesaleTab('products')">
                <i class="fas fa-boxes"></i>
                <span>Products</span>
            </button>
        </div>
    </div>

    <!-- New Customer Modal -->
    <div id="newCustomerModal" style="display:none;position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,0.6);z-index:1060;align-items:center;justify-content:center;">
        <div style="background:var(--bg-panel);border:1px solid var(--gold);border-radius:12px;width:90%;max-width:480px;padding:28px;">
            <h2 style="margin:0 0 20px;color:var(--gold);font-size:1.3rem;"><i class="fas fa-user-plus"></i> New Wholesale Customer</h2>
            <div style="display:flex;flex-direction:column;gap:12px;">
                <div>
                    <label style="display:block;font-size:0.8rem;color:var(--text-secondary);margin-bottom:4px;">Business Name *</label>
                    <input type="text" id="ncBusinessName" style="width:100%;padding:10px;border:1px solid var(--bg-card);border-radius:6px;font-size:0.95rem;background:var(--bg-dark);color:var(--text-primary);" placeholder="e.g. GreenLeaf Distributors">
                </div>
                <div style="display:flex;gap:12px;">
                    <div style="flex:1;">
                        <label style="display:block;font-size:0.8rem;color:var(--text-secondary);margin-bottom:4px;">Type</label>
                        <select id="ncCustomerType" style="width:100%;padding:10px;border:1px solid var(--bg-card);border-radius:6px;font-size:0.95rem;background:var(--bg-dark);color:var(--text-primary);">
                            <option value="external">External</option>
                            <option value="supplier">Supplier</option>
                            <option value="distributor">Distributor</option>
                            <option value="reseller">Reseller</option>
                            <option value="internal_branch">Internal Branch</option>
                        </select>
                    </div>
                    <div style="flex:1;">
                        <label style="display:block;font-size:0.8rem;color:var(--text-secondary);margin-bottom:4px;">Payment Terms</label>
                        <select id="ncPaymentTerms" style="width:100%;padding:10px;border:1px solid var(--bg-card);border-radius:6px;font-size:0.95rem;background:var(--bg-dark);color:var(--text-primary);">
                            <option value="cod">COD</option>
                            <option value="prepaid">Prepaid</option>
                            <option value="7days">7 Days</option>
                            <option value="14days">14 Days</option>
                            <option value="30days" selected>30 Days</option>
                            <option value="60days">60 Days</option>
                        </select>
                    </div>
                </div>
                <div>
                    <label style="display:block;font-size:0.8rem;color:var(--text-secondary);margin-bottom:4px;">Contact Name *</label>
                    <input type="text" id="ncContactName" style="width:100%;padding:10px;border:1px solid var(--bg-card);border-radius:6px;font-size:0.95rem;background:var(--bg-dark);color:var(--text-primary);" placeholder="Full name">
                </div>
                <div style="display:flex;gap:12px;">
                    <div style="flex:1;">
                        <label style="display:block;font-size:0.8rem;color:var(--text-secondary);margin-bottom:4px;">Email *</label>
                        <input type="email" id="ncContactEmail" style="width:100%;padding:10px;border:1px solid var(--bg-card);border-radius:6px;font-size:0.95rem;background:var(--bg-dark);color:var(--text-primary);" placeholder="email@example.com">
                    </div>
                    <div style="flex:1;">
                        <label style="display:block;font-size:0.8rem;color:var(--text-secondary);margin-bottom:4px;">Phone *</label>
                        <input type="tel" id="ncContactPhone" style="width:100%;padding:10px;border:1px solid var(--bg-card);border-radius:6px;font-size:0.95rem;background:var(--bg-dark);color:var(--text-primary);" placeholder="082 123 4567">
                    </div>
                </div>
            </div>
            <div style="display:flex;gap:10px;margin-top:24px;justify-content:flex-end;">
                <button onclick="closeNewCustomerModal()" style="padding:10px 20px;border:1px solid var(--bg-card);border-radius:6px;background:var(--bg-dark);color:var(--text-secondary);cursor:pointer;font-size:0.9rem;">Cancel</button>
                <button onclick="saveNewCustomer()" style="padding:10px 20px;border:none;border-radius:6px;background:var(--gold);color:var(--bg-dark);cursor:pointer;font-size:0.9rem;font-weight:600;">Create Customer</button>
            </div>
        </div>
    </div>
</body>
</html>
