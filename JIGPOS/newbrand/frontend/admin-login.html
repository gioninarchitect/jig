<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Login - JIG Craft Cannabis</title>
    <link rel="icon" type="image/x-icon" href="/images/favicon.ico">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Anton&family=Oswald:wght@400;500;600;700&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            /* JIG Craft Cannabis Brand Colors */
            --black: #0A0A0A;
            --white: #FAFAFA;
            --purple: #7C3AED;
            --purple-dark: #6D28D9;
            --purple-light: #A855F7;
            --green: #15803D;
            --green-dark: #166534;
            --green-light: #22C55E;
            --amber: #D97706;
            --amber-dark: #B45309;
            --amber-light: #F59E0B;
            --slate: #1E1E1E;
            --slate-light: #2A2A2A;
            /* Legacy aliases */
            --cream: #0A0A0A;
            --green-deep: #0A0A0A;
            --gold: #D97706;
            --gold-dark: #B45309;
            --gold-light: #F59E0B;
            --red: #DC2626;
            --red-dark: #B91C1C;
            --red-light: #EF4444;
            /* Neutrals (inverted for dark theme) */
            --gray-50: #111111;
            --gray-100: #1A1A1A;
            --gray-200: #2A2A2A;
            --gray-300: #3A3A3A;
            --gray-400: #6B7280;
            --gray-500: #9CA3AF;
            --gray-600: #D1D5DB;
            --gray-700: #E5E7EB;
            --gray-800: #F3F4F6;
            --gray-900: #FAFAFA;
            /* Semantic */
            --success: #22C55E;
            --warning: #F59E0B;
            --danger: #DC2626;
            --error: #EF4444;
            --info: #3B82F6;
            /* Shadows */
            --shadow-sm: 0 2px 8px rgba(0,0,0,0.3);
            --shadow-md: 0 8px 24px rgba(0,0,0,0.4);
            --shadow-lg: 0 16px 48px rgba(0,0,0,0.5);
            --shadow-xl: 0 24px 60px rgba(0,0,0,0.6);
            --shadow-purple: 0 8px 32px rgba(124,58,237,0.25);
            --shadow-gold: 0 8px 32px rgba(217,119,6,0.2);
            --shadow-green: 0 8px 32px rgba(21,128,61,0.2);
            --shadow-red: 0 8px 32px rgba(220,38,38,0.2);
            /* Gradients */
            --gradient-brand: linear-gradient(135deg, #7C3AED 0%, #A855F7 40%, #D97706 100%);
            --gradient-dark: linear-gradient(180deg, #1E1E1E 0%, #0A0A0A 100%);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Inter', sans-serif;
            background: linear-gradient(135deg, #1E1E1E 0%, #0A0A0A 100%);
            color: var(--cream);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .login-container {
            background: rgba(244, 240, 230, 0.98);
            padding: 40px;
            border-radius: 20px;
            width: 100%;
            max-width: 400px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            border: 3px solid var(--gold);
        }

        .logo {
            text-align: center;
            margin-bottom: 30px;
        }

        .logo h1 {
            font-family: 'Oswald', sans-serif;
            color: var(--purple);
            font-size: 2rem;
            margin-bottom: 10px;
            text-transform: uppercase;
            letter-spacing: 2px;
        }

        .logo p {
            font-family: 'Oswald', sans-serif;
            font-style: italic;
            color: var(--gold-dark);
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-group label {
            display: block;
            margin-bottom: 8px;
            color: var(--green-dark);
            text-transform: uppercase;
            font-size: 0.9rem;
            letter-spacing: 1px;
        }

        .form-group input {
            width: 100%;
            padding: 15px;
            background: #0A0A0A;
            border: 1px solid rgba(124, 58, 237, 0.3);
            border-radius: 10px;
            color: var(--white);
            font-size: 1rem;
        }

        .form-group input:focus {
            outline: none;
            border-color: var(--purple);
            box-shadow: 0 0 10px rgba(124, 58, 237, 0.2);
        }

        .btn-login {
            width: 100%;
            padding: 15px;
            background: var(--green);
            color: var(--cream);
            border: none;
            border-radius: 10px;
            font-size: 1.1rem;
            font-weight: bold;
            cursor: pointer;
            text-transform: uppercase;
            letter-spacing: 2px;
            margin-top: 20px;
            transition: all 0.3s;
        }

        .btn-login:hover {
            background: var(--green-dark);
            transform: translateY(-2px);
            box-shadow: 0 10px 30px rgba(124, 58, 237, 0.4);
        }

        .error {
            background: rgba(220, 38, 38, 0.1);
            color: var(--red);
            padding: 10px;
            border-radius: 5px;
            margin-bottom: 20px;
            display: none;
            text-align: center;
            border: 1px solid var(--red);
        }
    </style>
</head>
<body>
    <div class="login-container">
        <div class="logo">
            <h1>Admin Access</h1>
            <p>JIG Craft Cannabis Control Panel</p>
        </div>

        <div id="error" class="error">Invalid credentials</div>

        <form id="adminLoginForm">
            <div class="form-group">
                <label>Username</label>
                <input type="text" id="username" required>
            </div>
            <div class="form-group">
                <label>Password</label>
                <input type="password" id="password" required>
            </div>
            <button type="submit" class="btn-login">LOGIN</button>
        </form>
    </div>

    <script>
        document.getElementById('adminLoginForm').onsubmit = function(e) {
            e.preventDefault();

            const username = document.getElementById('username').value;
            const password = document.getElementById('password').value;

            // Admin credentials (in production, this should be server-side)
            if (username === 'admin' && password === 'JigCraft2024!') {
                sessionStorage.setItem('adminAuth', 'true');
                window.location.href = 'admin.html';
            } else {
                document.getElementById('error').style.display = 'block';
                setTimeout(() => {
                    document.getElementById('error').style.display = 'none';
                }, 3000);
            }
        };
    </script>
</body>
</html>
