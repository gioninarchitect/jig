<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Product Details - Origin by ILCO Farming</title>
    <link rel="icon" type="image/png" href="images/origin-logo.png">
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;500;600;700;800;900&family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
    <style>
        :root {
            /* Origin by ILCO Farming Brand Colors */
            --black: #0E0E0E;
            --white: #FAFAFA;
            --or-gold: #C9A84C;
            --or-gold-muted: #8B6914;
            --or-gold-bright: #D4B86A;
            --or-black: #0A0A0A;
            --or-white: #F5F0E8;
            --or-dark: #141414;
            --or-dark-2: #1C1C1C;
            --or-gold: #C9A84C;
            --or-gold-light: #E8D5A3;
            --or-grey-2: #A89F8C;
            --or-grey-3: #6B6458;
            --or-grad-brand: linear-gradient(135deg, #8B6914 0%, #C9A84C 40%, #E8D5A3 70%, #C9A84C 100%);
            --green: #C9A84C;
            --green-dark: #8B6914;
            --green-light: #D4B86A;
            --amber: #C9A84C;
            --amber-dark: #8B6914;
            --amber-light: #E8D5A3;
            --slate: #1A1A1A;
            --slate-light: #222222;
            /* Legacy aliases */
            --cream: #1A1A1A;
            --green-deep: #8B6914;
            --gold: #C9A84C;
            --gold-dark: #8B6914;
            --gold-light: #E8D5A3;
            --red: #DC2626;
            --red-dark: #B91C1C;
            --red-light: #EF4444;
            /* Neutrals (inverted for dark theme) */
            --gray-50: #111111;
            --gray-100: #1A1A1A;
            --gray-200: #222222;
            --gray-300: #3A3A3A;
            --gray-400: #6B7280;
            --gray-500: #9CA3AF;
            --gray-600: #D1D5DB;
            --gray-700: #E5E7EB;
            --gray-800: #F3F4F6;
            --gray-900: #FAFAFA;
            /* Semantic */
            --success: #22C55E;
            --warning: #F8C242;
            --danger: #DC2626;
            --error: #EF4444;
            --info: #3B82F6;
            /* Shadows */
            --shadow-sm: 0 2px 8px rgba(0,0,0,0.3);
            --shadow-md: 0 8px 24px rgba(0,0,0,0.4);
            --shadow-lg: 0 16px 48px rgba(0,0,0,0.5);
            --shadow-xl: 0 24px 60px rgba(0,0,0,0.6);
            --shadow-or-gold: 0 8px 32px rgba(201,168,76,0.25);
            --shadow-gold: 0 8px 32px rgba(240,165,0,0.2);
            --shadow-green: 0 8px 32px rgba(139,105,20,0.2);
            --shadow-red: 0 8px 32px rgba(220,38,38,0.2);
            /* Gradients */
            --gradient-brand: linear-gradient(135deg, #8B6914 0%, #C9A84C 40%, #E8D5A3 70%, #C9A84C 100%);
            --gradient-dark: linear-gradient(180deg, #1A1A1A 0%, #0E0E0E 100%);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', -apple-system, sans-serif;
            background: #0A0A0A;
            color: var(--or-white);
            min-height: 100vh;
        }

        /* Header */
        header {
            background: linear-gradient(135deg, #1A1A1A 0%, #0E0E0E 100%);
            padding: 1rem 2rem;
            position: sticky;
            top: 0;
            z-index: 100;
            border-bottom: 3px solid var(--gold);
        }

        nav {
            display: flex;
            justify-content: space-between;
            align-items: center;
            max-width: 1400px;
            margin: 0 auto;
        }

        .logo {
            font-family: 'Cinzel', sans-serif;
            font-size: 1.5rem;
            color: var(--cream);
            text-transform: uppercase;
            font-weight: bold;
        }

        .nav-links {
            display: flex;
            gap: 2rem;
            align-items: center;
        }

        .nav-links a {
            color: var(--cream);
            text-decoration: none;
            transition: color 0.3s;
            font-weight: 500;
        }

        .nav-links a:hover {
            color: var(--gold);
        }

        .cart-icon {
            position: relative;
            cursor: pointer;
            color: var(--cream);
        }

        .cart-count {
            position: absolute;
            top: -8px;
            right: -8px;
            background: var(--gold);
            color: var(--or-white);
            border-radius: 50%;
            width: 20px;
            height: 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 0.75rem;
            font-weight: 600;
        }

        /* Breadcrumb */
        .breadcrumb {
            max-width: 1400px;
            margin: 2rem auto;
            padding: 0 2rem;
            color: var(--or-gold);
        }

        .breadcrumb a {
            color: var(--or-gold);
            text-decoration: none;
            opacity: 0.7;
        }

        .breadcrumb a:hover {
            color: var(--or-gold-muted);
            opacity: 1;
        }

        /* Product Container */
        .product-container {
            max-width: 1400px;
            margin: 0 auto;
            padding: 0 2rem 4rem;
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 4rem;
        }

        /* Product Images */
        .product-images {
            position: sticky;
            top: 100px;
            height: fit-content;
        }

        .main-image {
            width: 100%;
            height: 500px;
            background: #1A1A1A;
            border-radius: 12px;
            overflow: hidden;
            margin-bottom: 1rem;
            box-shadow: 0 4px 20px rgba(63, 192, 65, 0.1);
            border: 1px solid rgba(63, 192, 65, 0.1);
        }

        .main-image img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .thumbnail-container {
            display: flex;
            gap: 1rem;
            overflow-x: auto;
        }

        .thumbnail {
            width: 80px;
            height: 80px;
            border-radius: 8px;
            overflow: hidden;
            cursor: pointer;
            opacity: 0.6;
            transition: all 0.3s;
            flex-shrink: 0;
            border: 2px solid transparent;
            background: #1A1A1A;
        }

        .thumbnail.active {
            opacity: 1;
            border: 2px solid var(--gold);
        }

        .thumbnail:hover {
            opacity: 0.9;
        }

        .thumbnail img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        /* Product Details */
        .product-details {
            padding-top: 2rem;
        }

        .product-title {
            font-family: 'Cinzel', sans-serif;
            font-size: 2.5rem;
            margin-bottom: 1rem;
            color: var(--or-gold-muted);
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .product-price {
            font-size: 2rem;
            color: var(--or-gold);
            margin-bottom: 1rem;
            font-weight: 700;
        }

        .old-price {
            text-decoration: line-through;
            color: var(--or-gold);
            opacity: 0.5;
            margin-right: 1rem;
            font-weight: 400;
        }

        .discount-badge {
            background: var(--gold);
            color: var(--or-white);
            padding: 0.25rem 0.75rem;
            border-radius: 5px;
            font-size: 0.875rem;
            font-weight: 600;
        }

        .stock-status {
            margin-bottom: 2rem;
            padding: 0.5rem 1rem;
            background: #1A1A1A;
            border-radius: 5px;
            display: inline-block;
            border: 1px solid #222222;
        }

        .in-stock {
            color: var(--or-gold);
            font-weight: 600;
        }

        .low-stock {
            color: var(--gold-dark);
            font-weight: 600;
        }

        .out-of-stock {
            color: #c53030;
            font-weight: 600;
        }

        /* Options */
        .product-options {
            margin-bottom: 2rem;
        }

        .option-group {
            margin-bottom: 1.5rem;
        }

        .option-label {
            display: block;
            margin-bottom: 0.5rem;
            color: var(--or-gold-muted);
            font-weight: 600;
        }

        .size-options, .color-options {
            display: flex;
            gap: 1rem;
            flex-wrap: wrap;
        }

        .size-option, .color-option {
            padding: 0.5rem 1rem;
            border: 2px solid var(--green);
            border-radius: 5px;
            background: #1A1A1A;
            color: var(--or-white);
            cursor: pointer;
            transition: all 0.3s;
            font-weight: 500;
        }

        .size-option:hover, .color-option:hover {
            border-color: var(--gold);
            background: rgba(240, 165, 0, 0.1);
        }

        .size-option.selected, .color-option.selected {
            background: var(--or-gold);
            border-color: var(--or-gold);
            color: var(--cream);
        }

        .color-option {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            padding: 0;
        }

        /* Quantity and Add to Cart */
        .purchase-section {
            display: flex;
            gap: 1rem;
            margin-bottom: 2rem;
        }

        .quantity-selector {
            display: flex;
            align-items: center;
            background: #1A1A1A;
            border-radius: 5px;
            overflow: hidden;
            border: 2px solid var(--green);
        }

        .quantity-btn {
            padding: 1rem;
            background: none;
            border: none;
            color: var(--or-gold-muted);
            cursor: pointer;
            font-size: 1.25rem;
            font-weight: 600;
        }

        .quantity-btn:hover {
            background: rgba(63, 192, 65, 0.1);
        }

        .quantity-input {
            width: 60px;
            padding: 1rem;
            background: none;
            border: none;
            color: var(--or-gold-muted);
            text-align: center;
            font-size: 1rem;
            font-weight: 600;
        }

        .add-to-cart {
            flex: 1;
            padding: 1rem 2rem;
            background: var(--or-gold);
            border: none;
            border-radius: 5px;
            color: var(--cream);
            font-size: 1.1rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .add-to-cart:hover {
            background: var(--green-dark);
        }

        .add-to-cart:disabled {
            background: #ccc;
            cursor: not-allowed;
        }

        .buy-now {
            padding: 1rem 2rem;
            background: transparent;
            border: 2px solid var(--gold);
            border-radius: 5px;
            color: var(--gold-dark);
            font-size: 1.1rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .buy-now:hover {
            background: var(--gold);
            color: var(--or-white);
        }

        .buy-now:disabled {
            border-color: #ccc;
            color: #ccc;
            cursor: not-allowed;
        }

        /* Product Description */
        .product-description {
            margin-bottom: 3rem;
        }

        .description-title {
            font-family: 'Cinzel', sans-serif;
            font-size: 1.5rem;
            margin-bottom: 1rem;
            color: var(--or-gold-muted);
            text-transform: uppercase;
        }

        .description-content {
            line-height: 1.8;
            color: var(--or-white);
        }

        /* Product Features */
        .product-features {
            margin-bottom: 3rem;
        }

        .features-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 1rem;
            margin-top: 1rem;
        }

        .feature-item {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            color: var(--or-white);
        }

        .feature-icon {
            color: var(--or-gold);
            font-weight: bold;
        }

        /* Related Products */
        .related-section {
            max-width: 1400px;
            margin: 4rem auto;
            padding: 0 2rem;
        }

        .related-title {
            font-family: 'Cinzel', sans-serif;
            font-size: 2rem;
            margin-bottom: 2rem;
            color: var(--or-gold-muted);
            text-transform: uppercase;
        }

        .related-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 2rem;
        }

        .related-product {
            background: #1A1A1A;
            border-radius: 12px;
            overflow: hidden;
            cursor: pointer;
            transition: all 0.3s;
            box-shadow: 0 4px 20px rgba(0,0,0,0.3);
            border: 1px solid #222222;
        }

        .related-product:hover {
            transform: translateY(-5px);
            box-shadow: 0 8px 30px rgba(63, 192, 65, 0.15);
        }

        .related-image {
            width: 100%;
            height: 200px;
            object-fit: cover;
            background: var(--or-black);
        }

        .related-info {
            padding: 1rem;
        }

        .related-name {
            margin-bottom: 0.5rem;
            color: var(--or-gold-muted);
            font-weight: 600;
        }

        .related-price {
            color: var(--or-gold);
            font-weight: 700;
        }

        /* Loading */
        .loading {
            text-align: center;
            padding: 3rem;
            color: var(--or-gold-muted);
        }

        .spinner {
            border: 3px solid rgba(63, 192, 65, 0.1);
            border-top: 3px solid var(--green);
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
            margin: 0 auto 1rem;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        /* Mobile Responsive */
        @media (max-width: 768px) {
            header {
                padding: 1rem;
            }

            .logo {
                font-size: 1.25rem;
            }

            .nav-links {
                gap: 1rem;
            }

            .nav-links a {
                font-size: 0.9rem;
            }

            .breadcrumb {
                padding: 0 1rem;
                margin: 1rem auto;
                font-size: 0.875rem;
            }

            .product-container {
                grid-template-columns: 1fr;
                gap: 2rem;
                padding: 0 1rem 2rem;
            }

            .product-images {
                position: static;
            }

            .main-image {
                height: 300px;
            }

            .product-title {
                font-size: 2rem;
            }

            .product-price {
                font-size: 1.5rem;
            }

            .purchase-section {
                flex-direction: column;
            }

            .quantity-selector {
                justify-content: center;
            }

            .related-section {
                padding: 0 1rem;
                margin: 2rem auto;
            }

            .related-grid {
                grid-template-columns: repeat(2, 1fr);
                gap: 1rem;
            }

            .related-image {
                height: 150px;
            }

            .features-grid {
                grid-template-columns: 1fr;
            }
        }

        /* Toast Notification Styles */
        .toast-container {
            position: fixed;
            top: 20px;
            right: 20px;
            z-index: 10000;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .toast {
            min-width: 300px;
            max-width: 400px;
            padding: 16px 20px;
            border-radius: 8px;
            background: #1A1A1A;
            border: 1px solid #222222;
            box-shadow: 0 4px 20px rgba(63, 192, 65, 0.15);
            display: flex;
            align-items: flex-start;
            gap: 12px;
            animation: toastSlideIn 0.3s ease;
        }

        .toast.removing { animation: toastSlideOut 0.3s ease forwards; }
        @keyframes toastSlideIn { from { transform: translateX(100%); opacity: 0; } to { transform: translateX(0); opacity: 1; } }
        @keyframes toastSlideOut { from { transform: translateX(0); opacity: 1; } to { transform: translateX(100%); opacity: 0; } }

        .toast-icon {
            width: 24px; height: 24px; border-radius: 50%;
            display: flex; align-items: center; justify-content: center;
            flex-shrink: 0; font-size: 14px;
        }
        .toast.success .toast-icon { background: rgba(63, 192, 65, 0.15); color: var(--or-gold); }
        .toast.error .toast-icon { background: rgba(197, 48, 48, 0.15); color: #c53030; }
        .toast.warning .toast-icon { background: rgba(240, 165, 0, 0.2); color: var(--gold-dark); }
        .toast.info .toast-icon { background: rgba(63, 192, 65, 0.1); color: var(--or-gold); }
        .toast-content { flex: 1; }
        .toast-title { font-weight: 600; font-size: 14px; color: var(--or-gold-muted); margin-bottom: 4px; }
        .toast-message { font-size: 13px; color: var(--or-gold); opacity: 0.8; line-height: 1.4; }
        .toast-close { background: none; border: none; color: var(--or-gold); opacity: 0.5; cursor: pointer; padding: 0; font-size: 18px; }
        .toast-close:hover { opacity: 1; }
    </style>
</head>
<body>
    <!-- Toast Container -->
    <div class="toast-container" id="toastContainer"></div>

    <!-- Header -->
    <header>
        <nav>
            <div class="logo">Origin by ILCO Farming</div>
            <div class="nav-links">
                <a href="index.html">Home</a>
                <a href="products.html">Products</a>
                <a href="dashboard.html">Account</a>
                <div class="cart-icon" onclick="window.location.href='cart.html'">
                    🛒 <span class="cart-count" id="cartCount">0</span>
                </div>
            </div>
        </nav>
    </header>

    <!-- Breadcrumb -->
    <div class="breadcrumb" id="breadcrumb">
        <a href="index.html">Home</a> / 
        <a href="products.html">Products</a> / 
        <span id="breadcrumbName">Loading...</span>
    </div>

    <!-- Product Container -->
    <div class="product-container" id="productContainer">
        <div class="loading">
            <div class="spinner"></div>
            <p>Loading product...</p>
        </div>
    </div>

    <!-- Related Products -->
    <section class="related-section" id="relatedSection" style="display: none;">
        <h2 class="related-title">You May Also Like</h2>
        <div class="related-grid" id="relatedGrid">
            <!-- Dynamically populated -->
        </div>
    </section>

    <script src="/frontend/config.js"></script>
    <script src="/frontend/or-utils.js"></script>
    <script src="/frontend/or-auth.js"></script>
    <script>
        let currentProduct = null;
        let selectedSize = null;
        let selectedColor = null;
        let cartItems = JSON.parse(localStorage.getItem('cart')) || [];

        // Get product ID from URL
        const urlParams = new URLSearchParams(window.location.search);
        const productId = urlParams.get('id');

        // Update cart count
        function updateCartCount() {
            const count = cartItems.reduce((sum, item) => sum + item.quantity, 0);
            document.getElementById('cartCount').textContent = count;
        }

        // Load product details
        async function loadProduct() {
            if (!productId) {
                window.location.href = 'products.html';
                return;
            }

            try {
                const response = await fetch(`${API_URL}/products/${productId}`);
                
                if (!response.ok) {
                    throw new Error('Product not found');
                }

                const data = await response.json();
                currentProduct = data.product || data;
                displayProduct(currentProduct);
                document.getElementById('breadcrumbName').textContent = currentProduct.name;
                
                // Load related products
                loadRelatedProducts();
            } catch (error) {
                console.error('Error loading product:', error);
                document.getElementById('productContainer').innerHTML = 
                    '<p>Product not found</p>';
            }
        }

        // Display product
        function displayProduct(product) {
            const container = document.getElementById('productContainer');

            // Get stock from inventory object or fallback
            const stock = product.inventory?.quantity || product.stock || 0;

            const stockStatus = stock > 10
                ? '<span class="in-stock">In Stock</span>'
                : stock > 0
                ? `<span class="low-stock">Only ${stock} left!</span>`
                : '<span class="out-of-stock">Out of Stock</span>';

            // Handle images - can be array of strings or objects with url property
            const getImageUrl = (img) => {
                if (typeof img === 'string') return img;
                return img?.url || 'images/logo.png';
            };
            const mainImageUrl = product.images?.length ? getImageUrl(product.images[0]) : 'images/logo.png';

            container.innerHTML = `
                <!-- Product Images -->
                <div class="product-images">
                    <div class="main-image">
                        <img src="${mainImageUrl}"
                             alt="${product.name}" id="mainImage">
                    </div>
                    <div class="thumbnail-container">
                        ${product.images?.map((img, index) => {
                            const imgUrl = getImageUrl(img);
                            return `
                            <div class="thumbnail ${index === 0 ? 'active' : ''}"
                                 onclick="changeImage('${imgUrl}', this)">
                                <img src="${imgUrl}" alt="Product ${index + 1}">
                            </div>
                        `;}).join('') || ''}
                    </div>
                </div>

                <!-- Product Details -->
                <div class="product-details">
                    <h1 class="product-title">${product.name}</h1>

                    <div class="product-price">
                        ${product.originalPrice ? `
                            <span class="old-price">R${product.originalPrice.toFixed(2)}</span>
                        ` : ''}
                        R${product.price.toFixed(2)}
                        ${product.discount ? `
                            <span class="discount-badge">-${product.discount}%</span>
                        ` : ''}
                    </div>

                    <div class="stock-status">${stockStatus}</div>

                    <!-- Options -->
                    <div class="product-options">
                        ${product.sizes?.length ? `
                            <div class="option-group">
                                <label class="option-label">Size:</label>
                                <div class="size-options">
                                    ${product.sizes.map(size => `
                                        <div class="size-option" onclick="selectSize('${size}', this)">
                                            ${size}
                                        </div>
                                    `).join('')}
                                </div>
                            </div>
                        ` : ''}

                        ${product.colors?.length ? `
                            <div class="option-group">
                                <label class="option-label">Color:</label>
                                <div class="color-options">
                                    ${product.colors.map(color => `
                                        <div class="color-option" 
                                             style="background: ${color};"
                                             onclick="selectColor('${color}', this)"
                                             title="${color}">
                                        </div>
                                    `).join('')}
                                </div>
                            </div>
                        ` : ''}
                    </div>

                    <!-- Purchase Section -->
                    <div class="purchase-section">
                        <div class="quantity-selector">
                            <button class="quantity-btn" onclick="decreaseQuantity()">-</button>
                            <input type="number" class="quantity-input" id="quantity" value="1" min="1" max="${stock}">
                            <button class="quantity-btn" onclick="increaseQuantity()">+</button>
                        </div>
                        <button class="add-to-cart" onclick="addToCart()" ${stock === 0 ? 'disabled' : ''}>
                            Add to Cart
                        </button>
                        <button class="buy-now" onclick="buyNow()" ${stock === 0 ? 'disabled' : ''}>
                            Buy Now
                        </button>
                    </div>

                    <!-- Description -->
                    <div class="product-description">
                        <h3 class="description-title">Description</h3>
                        <div class="description-content">
                            ${product.description || 'No description available.'}
                        </div>
                    </div>

                    <!-- Features -->
                    ${product.features?.length ? `
                        <div class="product-features">
                            <h3 class="description-title">Features</h3>
                            <div class="features-grid">
                                ${product.features.map(feature => `
                                    <div class="feature-item">
                                        <span class="feature-icon">✓</span>
                                        <span>${feature}</span>
                                    </div>
                                `).join('')}
                            </div>
                        </div>
                    ` : ''}
                </div>
            `;
        }

        // Change main image
        function changeImage(src, thumbnail) {
            document.getElementById('mainImage').src = src;
            document.querySelectorAll('.thumbnail').forEach(t => t.classList.remove('active'));
            thumbnail.classList.add('active');
        }

        // Select size
        function selectSize(size, element) {
            selectedSize = size;
            document.querySelectorAll('.size-option').forEach(s => s.classList.remove('selected'));
            element.classList.add('selected');
        }

        // Select color
        function selectColor(color, element) {
            selectedColor = color;
            document.querySelectorAll('.color-option').forEach(c => c.classList.remove('selected'));
            element.classList.add('selected');
        }

        // Quantity controls
        function increaseQuantity() {
            const input = document.getElementById('quantity');
            const max = parseInt(input.max);
            const current = parseInt(input.value);
            if (current < max) {
                input.value = current + 1;
            }
        }

        function decreaseQuantity() {
            const input = document.getElementById('quantity');
            const current = parseInt(input.value);
            if (current > 1) {
                input.value = current - 1;
            }
        }

        // Add to cart
        function addToCart() {
            if (currentProduct.sizes?.length && !selectedSize) {
                showToast('Selection Required', 'Please select a size before adding to cart.', 'warning');
                return;
            }

            if (currentProduct.colors?.length && !selectedColor) {
                showToast('Selection Required', 'Please select a color before adding to cart.', 'warning');
                return;
            }

            const quantity = parseInt(document.getElementById('quantity').value);
            
            // Get image URL - handle both string and object formats
            const imageUrl = currentProduct.images?.[0]?.url || currentProduct.images?.[0] || 'images/logo.png';

            const cartItem = {
                productId: currentProduct._id,
                name: currentProduct.name,
                price: currentProduct.price,
                image: imageUrl,
                quantity,
                size: selectedSize,
                color: selectedColor
            };

            // Check if item already exists
            const existingIndex = cartItems.findIndex(item => 
                item.productId === cartItem.productId &&
                item.size === cartItem.size &&
                item.color === cartItem.color
            );

            if (existingIndex > -1) {
                cartItems[existingIndex].quantity += quantity;
            } else {
                cartItems.push(cartItem);
            }

            localStorage.setItem('cart', JSON.stringify(cartItems));
            updateCartCount();

            // Visual feedback
            const button = event.target;
            button.textContent = 'Added to Cart!';
            setTimeout(() => {
                button.textContent = 'Add to Cart';
            }, 2000);
        }

        // Buy now
        function buyNow() {
            addToCart();
            window.location.href = 'checkout.html';
        }

        // Load related products
        async function loadRelatedProducts() {
            try {
                const response = await fetch(`${API_URL}/products/${productId}/related`);
                const data = await response.json();
                const related = data.products || data || [];

                if (related.length > 0) {
                    document.getElementById('relatedSection').style.display = 'block';
                    document.getElementById('relatedGrid').innerHTML = related.map(product => {
                        const imgUrl = product.images?.[0]?.url || product.images?.[0] || 'images/logo.png';
                        return `
                        <div class="related-product" onclick="window.location.href='product.html?id=${product._id}'">
                            <img src="${imgUrl}"
                                 alt="${product.name}" class="related-image">
                            <div class="related-info">
                                <h4 class="related-name">${product.name}</h4>
                                <p class="related-price">R${product.price.toFixed(2)}</p>
                            </div>
                        </div>
                    `;}).join('');
                }
            } catch (error) {
                console.error('Error loading related products:', error);
            }
        }

        // Initialize
        updateCartCount();
        loadProduct();
    </script>
    <!-- UAT Bug Reporter -->
</body>
