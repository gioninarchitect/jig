<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Da Bud Chef - Menu Board</title>
    <link href="https://fonts.googleapis.com/css2?family=Yeseva+One&family=Montserrat:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            /* JIG Craft Cannabis Brand Colors */
            --black: #0A0A0A;
            --white: #FAFAFA;
            --purple: #7C3AED;
            --purple-dark: #6D28D9;
            --purple-light: #A855F7;
            --green: #15803D;
            --green-dark: #166534;
            --green-light: #22C55E;
            --amber: #D97706;
            --amber-dark: #B45309;
            --amber-light: #F59E0B;
            --slate: #1E1E1E;
            --slate-light: #2A2A2A;
            /* Legacy aliases */
            --cream: #0A0A0A;
            --green-deep: #0A0A0A;
            --gold: #D97706;
            --gold-dark: #B45309;
            --gold-light: #F59E0B;
            --red: #DC2626;
            --red-dark: #B91C1C;
            --red-light: #EF4444;
            /* Neutrals (inverted for dark theme) */
            --gray-50: #111111;
            --gray-100: #1A1A1A;
            --gray-200: #2A2A2A;
            --gray-300: #3A3A3A;
            --gray-400: #6B7280;
            --gray-500: #9CA3AF;
            --gray-600: #D1D5DB;
            --gray-700: #E5E7EB;
            --gray-800: #F3F4F6;
            --gray-900: #FAFAFA;
            /* Semantic */
            --success: #22C55E;
            --warning: #F59E0B;
            --danger: #DC2626;
            --error: #EF4444;
            --info: #3B82F6;
            /* Shadows */
            --shadow-sm: 0 2px 8px rgba(0,0,0,0.3);
            --shadow-md: 0 8px 24px rgba(0,0,0,0.4);
            --shadow-lg: 0 16px 48px rgba(0,0,0,0.5);
            --shadow-xl: 0 24px 60px rgba(0,0,0,0.6);
            --shadow-purple: 0 8px 32px rgba(124,58,237,0.25);
            --shadow-gold: 0 8px 32px rgba(217,119,6,0.2);
            --shadow-green: 0 8px 32px rgba(21,128,61,0.2);
            --shadow-red: 0 8px 32px rgba(220,38,38,0.2);
            /* Gradients */
            --gradient-brand: linear-gradient(135deg, #7C3AED 0%, #A855F7 40%, #D97706 100%);
            --gradient-dark: linear-gradient(180deg, #1E1E1E 0%, #0A0A0A 100%);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Montserrat', sans-serif;
            background: var(--bg-color);
            color: var(--text-color);
            min-height: 100vh;
            overflow: hidden;
        }

        .menu-board {
            width: 100vw;
            height: 100vh;
            display: flex;
            flex-direction: column;
            padding: 20px;
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px 20px;
            border-bottom: 2px solid var(--accent-color);
            margin-bottom: 20px;
        }

        .logo {
            font-family: 'Yeseva One', serif;
            font-size: 2.5rem;
            color: var(--accent-color);
        }

        .branch-name {
            font-size: 1.2rem;
            opacity: 0.8;
        }

        .time-display {
            font-size: 1.5rem;
            font-weight: 600;
        }

        .products-grid {
            flex: 1;
            display: grid;
            grid-template-columns: repeat(var(--columns, 3), 1fr);
            gap: 15px;
            overflow: hidden;
            padding: 10px;
        }

        .product-card {
            background: var(--card-bg);
            border: 1px solid rgba(255,255,255,0.1);
            border-radius: 12px;
            padding: 15px;
            display: flex;
            flex-direction: column;
            transition: transform 0.3s, opacity 0.3s;
        }

        .product-card.highlight {
            border-color: var(--accent-color);
            box-shadow: 0 0 20px rgba(217, 119, 6, 0.3);
        }

        .product-image {
            width: 100%;
            height: 120px;
            object-fit: cover;
            border-radius: 8px;
            margin-bottom: 10px;
            background: rgba(0,0,0,0.3);
        }

        .product-name {
            font-family: 'Yeseva One', serif;
            font-size: 1.3rem;
            margin-bottom: 5px;
            color: var(--text-color);
        }

        .product-category {
            font-size: 0.8rem;
            text-transform: uppercase;
            color: var(--accent-color);
            margin-bottom: 10px;
        }

        .product-price {
            font-size: 1.8rem;
            font-weight: 700;
            color: var(--accent-color);
            margin-top: auto;
        }

        .product-stock {
            font-size: 0.9rem;
            opacity: 0.7;
        }

        .stock-low {
            color: #ff6b6b;
        }

        /* Category colors */
        .category-flower { border-left: 4px solid #22c55e; }
        .category-pre-rolls { border-left: 4px solid #f97316; }
        .category-edibles { border-left: 4px solid #ec4899; }
        .category-concentrates { border-left: 4px solid #a855f7; }
        .category-accessories { border-left: 4px solid #06b6d4; }
        .category-vapes { border-left: 4px solid #6366f1; }
        .category-oils { border-left: 4px solid #eab308; }

        /* Promo banner */
        .promo-banner {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            background: linear-gradient(90deg, var(--accent-color), #B45309);
            color: #0A0A0A;
            padding: 15px 30px;
            font-size: 1.3rem;
            font-weight: 600;
            text-align: center;
            animation: slideIn 0.5s ease-out;
        }

        .promo-banner.hidden {
            transform: translateY(100%);
        }

        @keyframes slideIn {
            from { transform: translateY(100%); }
            to { transform: translateY(0); }
        }

        /* Rotation animation */
        .fade-out {
            opacity: 0;
            transform: scale(0.95);
        }

        .fade-in {
            opacity: 1;
            transform: scale(1);
        }

        /* Loading */
        .loading {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            font-size: 2rem;
        }

        .loading-spinner {
            width: 50px;
            height: 50px;
            border: 4px solid rgba(255,255,255,0.1);
            border-top-color: var(--accent-color);
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin-right: 20px;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        /* Fullscreen button */
        .fullscreen-btn {
            position: fixed;
            top: 10px;
            right: 10px;
            background: var(--accent-color);
            color: #0A0A0A;
            border: none;
            padding: 10px 15px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 600;
            z-index: 100;
            opacity: 0.7;
            transition: opacity 0.3s;
        }

        .fullscreen-btn:hover {
            opacity: 1;
        }
    </style>
</head>
<body>
    <button class="fullscreen-btn" onclick="toggleFullscreen()">Fullscreen</button>

    <div id="loadingScreen" class="loading">
        <div class="loading-spinner"></div>
        <span>Loading Menu Board...</span>
    </div>

    <div id="menuBoard" class="menu-board" style="display: none;">
        <header class="header">
            <div>
                <div class="logo">Da Bud Chef</div>
                <div class="branch-name" id="branchName">-</div>
            </div>
            <div class="time-display" id="timeDisplay">--:--</div>
        </header>

        <div class="products-grid" id="productsGrid"></div>

        <div class="promo-banner hidden" id="promoBanner"></div>
    </div>

    <script src="/frontend/config.js"></script>
    <script src="/frontend/jig-utils.js"></script>
    <script src="/frontend/jig-auth.js"></script>
    <script>

        let boardConfig = null;
        let products = [];
        let promotions = [];
        let currentPage = 0;
        let itemsPerPage = 9;
        let rotationInterval = null;
        let promoIndex = 0;

        // Get board ID from URL
        const urlParams = new URLSearchParams(window.location.search);
        const boardId = urlParams.get('id');

        async function loadMenuBoard() {
            if (!boardId) {
                showError('No menu board ID provided. Add ?id=BOARD_ID to URL');
                return;
            }

            try {
                const response = await fetch(`${API_URL}/menu-boards/display/${boardId}`);
                const data = await response.json();

                if (!data.success) {
                    showError(data.message || 'Failed to load menu board');
                    return;
                }

                boardConfig = data.data.board;
                products = data.data.products;
                promotions = data.data.promotions || [];

                applyTheme();
                renderProducts();
                startRotation();
                startPromoRotation();
                updateTime();
                setInterval(updateTime, 1000);

                document.getElementById('branchName').textContent = data.data.branch?.name || '';
                document.getElementById('loadingScreen').style.display = 'none';
                document.getElementById('menuBoard').style.display = 'flex';

            } catch (error) {
                showError('Failed to connect to server');
                console.error(error);
            }
        }

        function applyTheme() {
            if (!boardConfig) return;

            document.documentElement.style.setProperty('--bg-color', boardConfig.backgroundColor);
            document.documentElement.style.setProperty('--text-color', boardConfig.textColor);
            document.documentElement.style.setProperty('--accent-color', boardConfig.accentColor);
            document.documentElement.style.setProperty('--columns', boardConfig.columns);

            itemsPerPage = boardConfig.columns * 3; // 3 rows
        }

        function renderProducts() {
            const grid = document.getElementById('productsGrid');
            const start = currentPage * itemsPerPage;
            const pageProducts = products.slice(start, start + itemsPerPage);

            grid.innerHTML = pageProducts.map(p => `
                <div class="product-card category-${p.category}">
                    ${boardConfig.showImages && p.images?.[0]
                        ? `<img src="${p.images[0]}" alt="${p.name}" class="product-image">`
                        : '<div class="product-image"></div>'}
                    <div class="product-category">${formatCategory(p.category)}</div>
                    <div class="product-name">${p.name}</div>
                    ${boardConfig.showPrices ? `<div class="product-price">R${p.price.toFixed(2)}</div>` : ''}
                    ${boardConfig.showStock ? `<div class="product-stock ${(p.inventory?.quantity || 0) < 10 ? 'stock-low' : ''}">
                        ${p.inventory?.quantity || 0} in stock
                    </div>` : ''}
                </div>
            `).join('');
        }

        function formatCategory(cat) {
            return cat.replace(/-/g, ' ').replace(/\b\w/g, l => l.toUpperCase());
        }

        function startRotation() {
            if (!boardConfig.rotationEnabled || products.length <= itemsPerPage) return;

            const totalPages = Math.ceil(products.length / itemsPerPage);

            rotationInterval = setInterval(() => {
                const grid = document.getElementById('productsGrid');
                grid.classList.add('fade-out');

                setTimeout(() => {
                    currentPage = (currentPage + 1) % totalPages;
                    renderProducts();
                    grid.classList.remove('fade-out');
                    grid.classList.add('fade-in');

                    setTimeout(() => grid.classList.remove('fade-in'), 300);
                }, 300);

            }, boardConfig.rotationInterval);
        }

        function startPromoRotation() {
            if (promotions.length === 0) return;

            const banner = document.getElementById('promoBanner');

            function showPromo() {
                const promo = promotions[promoIndex];
                banner.textContent = `${promo.title}: ${promo.description}`;
                banner.classList.remove('hidden');

                setTimeout(() => {
                    banner.classList.add('hidden');
                    promoIndex = (promoIndex + 1) % promotions.length;
                }, 8000);
            }

            showPromo();
            setInterval(showPromo, 15000);
        }

        function updateTime() {
            const now = new Date();
            document.getElementById('timeDisplay').textContent =
                now.toLocaleTimeString('en-ZA', { hour: '2-digit', minute: '2-digit' });
        }

        function showError(message) {
            document.getElementById('loadingScreen').innerHTML = `
                <div style="text-align: center; color: #ff6b6b;">
                    <div style="font-size: 3rem; margin-bottom: 20px;">!</div>
                    <div>${message}</div>
                </div>
            `;
        }

        function toggleFullscreen() {
            if (!document.fullscreenElement) {
                document.documentElement.requestFullscreen();
            } else {
                document.exitFullscreen();
            }
        }

        // Auto-refresh every 5 minutes
        setInterval(() => {
            location.reload();
        }, 5 * 60 * 1000);

        // Start
        loadMenuBoard();
    </script>
</body>
</html>
