<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Origin — Section 21 Review</title>
<link rel="icon" type="image/png" href="images/origin-logo.png">
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600;700&family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400&display=swap" rel="stylesheet">
<style>
  :root{ --gold:#C9A84C; --gold-d:#8B6914; --panel:#15130d; --line:#2a2620; --txt:#F2ECDD; --grey:#9a9486; --green:#22C55E; --amber:#F59E0B; --red:#DC2626; }
  *{ box-sizing:border-box; margin:0; padding:0; font-family:'Inter',sans-serif; }
  body{ background:#0A0A0A; color:var(--txt); }
  header{ background:linear-gradient(135deg,#0A0A0A,#1a1408); border-bottom:2px solid var(--gold); padding:14px 22px; display:flex; align-items:center; justify-content:space-between; gap:10px; flex-wrap:wrap; }
  .brand{ display:flex; align-items:center; gap:12px; } .brand img{ height:34px; } .brand b{ font-family:'Cinzel'; letter-spacing:2px; color:var(--gold); } .brand span{ color:var(--grey); font-size:.8rem; }
  .btn{ background:#222; color:var(--txt); border:none; border-radius:9px; padding:9px 14px; font-weight:700; cursor:pointer; font-size:.82rem; text-decoration:none; display:inline-block; }
  .btn-gold{ background:var(--gold); color:#1a1a1a; } .btn-green{ background:var(--green); color:#04210f; } .btn-red{ background:var(--red); color:#fff; }
  .wrap{ max-width:820px; margin:0 auto; padding:24px 20px 60px; }
  .gate{ max-width:350px; margin:50px auto; background:#161616; border:1px solid #2a2a2a; border-radius:16px; padding:26px; }
  .lbl{ font-size:.72rem; color:var(--grey); display:flex; flex-direction:column; gap:5px; }
  .lbl input{ padding:11px; background:#1d1d1d; border:1px solid #2a2a2a; border-radius:9px; color:#fff; }
  .doc{ background:var(--panel); border:1px solid var(--line); border-radius:15px; padding:18px 20px; margin-bottom:16px; }
  .doc .top{ display:flex; justify-content:space-between; gap:12px; flex-wrap:wrap; align-items:flex-start; }
  .doc h3{ font-size:1.05rem; color:#fff; } .doc .em{ color:var(--grey); font-size:.82rem; font-family:'JetBrains Mono'; }
  .meta{ display:flex; gap:18px; flex-wrap:wrap; margin:12px 0; }
  .meta div .l{ color:var(--grey); font-size:.66rem; text-transform:uppercase; letter-spacing:1px; } .meta div .v{ color:#e6e0d2; font-size:.9rem; }
  .acts{ display:flex; gap:10px; flex-wrap:wrap; align-items:center; margin-top:6px; }
  .acts input{ flex:1; min-width:160px; padding:10px; background:#1d1d1d; border:1px solid var(--line); border-radius:9px; color:#fff; font-size:.85rem; }
  .chip{ font-size:.66rem;font-weight:800;padding:3px 10px;border-radius:20px;background:rgba(245,158,11,.16);color:var(--amber); }
  .empty{ text-align:center; color:#888; padding:50px 20px; }
  .toast{ position:fixed; bottom:20px; left:50%; transform:translateX(-50%); background:var(--gold); color:#1a1a1a; padding:12px 22px; border-radius:10px; font-weight:700; z-index:99; display:none; }
  .verify{ background:rgba(245,158,11,.1); border:1px solid rgba(245,158,11,.3); color:#f0c674; font-size:.78rem; padding:10px 13px; border-radius:10px; margin-bottom:16px; }
</style>
</head>
<body>
<header>
  <div class="brand"><img src="images/origin-logo.png"><b>ORIGIN</b><span>Section 21 — Pharmacist Review</span></div>
  <div style="display:flex;gap:8px;"><button class="btn" onclick="load()">Refresh</button><a class="btn" href="pos.html">← POS</a></div>
</header>
<div class="wrap">
  <div id="gate" class="gate" style="display:none;">
    <div style="font-family:'Cinzel';color:var(--gold);font-size:1.3rem;text-align:center;">Pharmacist / Admin Login</div>
    <div style="color:#888;text-align:center;font-size:.82rem;margin:4px 0 20px;">Section 21 approvals</div>
    <label class="lbl">EMAIL<input id="lgEmail" type="email" style="margin:6px 0 14px;"></label>
    <label class="lbl">PIN<input id="lgPin" type="password" inputmode="numeric" style="letter-spacing:5px;" onkeydown="if(event.key==='Enter')doLogin()"></label>
    <div id="lgMsg" style="color:var(--red);font-size:.8rem;min-height:15px;margin-top:6px;"></div>
    <button class="btn btn-gold" style="width:100%;margin-top:8px;" onclick="doLogin()">Sign In</button>
  </div>
  <div id="main" style="display:none;">
    <div class="verify">Approving confirms you have verified a valid Section 21 authorisation &amp; prescription as the responsible pharmacist. Every decision is recorded against your account.</div>
    <div id="rows"></div>
  </div>
</div>
<div class="toast" id="toast"></div>
<script>
const API=(location.hostname==='localhost'||location.hostname==='127.0.0.1')?'/api/v1':'/pos/api/v1';
let token=sessionStorage.getItem('adminToken')||localStorage.getItem('token')||'';
let me=JSON.parse(sessionStorage.getItem('user')||localStorage.getItem('user')||'null');
function hdr(){return{'Authorization':`Bearer ${token}`,'Content-Type':'application/json'};}
function toast(m){const t=document.getElementById('toast');t.textContent=m;t.style.display='block';setTimeout(()=>t.style.display='none',2200);}
function fmt(d){return d?new Date(d).toLocaleDateString('en-ZA',{day:'2-digit',month:'short',year:'numeric'}):'—';}
async function doLogin(){
  const email=document.getElementById('lgEmail').value.trim().toLowerCase(),pin=document.getElementById('lgPin').value.trim(),msg=document.getElementById('lgMsg');
  if(!email||!pin){msg.textContent='Enter email and PIN';return;} msg.style.color='#888';msg.textContent='Signing in…';
  try{const r=await fetch(`${API}/auth/otp/verify-pin`,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({email,pin})});const d=await r.json();
    if(!d.success||!d.token){msg.style.color='var(--red)';msg.textContent=d.message||'Invalid';return;}
    token=d.token;me=d.user;sessionStorage.setItem('adminToken',token);localStorage.setItem('token',token);
    sessionStorage.setItem('user',JSON.stringify(d.user));localStorage.setItem('user',JSON.stringify(d.user));
    document.getElementById('gate').style.display='none';load();
  }catch(e){msg.style.color='var(--red)';msg.textContent='Login failed';}
}
async function load(){
  try{
    const r=await fetch(`${API}/section21/admin/pending`,{headers:hdr()});
    if(r.status===401||r.status===403){document.getElementById('gate').style.display='block';document.getElementById('main').style.display='none';return;}
    const docs=await r.json();
    document.getElementById('main').style.display='block';
    const rows=document.getElementById('rows');
    if(!Array.isArray(docs)||!docs.length){ rows.innerHTML='<div class="empty">No Section 21 submissions awaiting review. 🎉</div>'; return; }
    rows.innerHTML=docs.map(d=>{
      const u=d.userId||{}; const name=((u.firstName||'')+' '+(u.lastName||'')).trim()||'(unknown patient)';
      const url=(d.documentUrl||'').startsWith('http')?d.documentUrl:d.documentUrl;
      return `<div class="doc" data-id="${d._id}">
        <div class="top"><div><h3>${name} <span class="chip">PENDING</span></h3><div class="em">${u.email||''}</div></div>
          <a class="btn btn-gold" href="${url}" target="_blank" rel="noopener">View document ↗</a></div>
        <div class="meta">
          <div><div class="l">Rx number</div><div class="v">${d.prescriptionNumber||'—'}</div></div>
          <div><div class="l">Prescribed by</div><div class="v">${d.prescribedBy||'—'}</div></div>
          <div><div class="l">Issued</div><div class="v">${fmt(d.issuedDate)}</div></div>
          <div><div class="l">Expires</div><div class="v">${fmt(d.expiryDate)}</div></div>
          <div><div class="l">Uploaded</div><div class="v">${fmt(d.uploadedAt||d.createdAt)}</div></div>
        </div>
        <div class="acts">
          <input id="note_${d._id}" placeholder="Note / rejection reason (optional)">
          <button class="btn btn-green" onclick="decide('${d._id}','approve')">Approve</button>
          <button class="btn btn-red" onclick="decide('${d._id}','reject')">Reject</button>
        </div>
      </div>`;
    }).join('');
  }catch(e){document.getElementById('gate').style.display='block';}
}
async function decide(id,action){
  const note=(document.getElementById('note_'+id)||{}).value||'';
  if(action==='reject' && !note){ toast('Add a rejection reason'); return; }
  const adminId=me&&(me.id||me._id);
  const body=action==='approve'?{adminId,adminNotes:note}:{adminId,rejectionReason:note};
  const r=await fetch(`${API}/section21/admin/${action}/${id}`,{method:'POST',headers:hdr(),body:JSON.stringify(body)});
  const d=await r.json();
  if(r.ok && !d.error){ toast(action==='approve'?'Approved — patient can order medical':'Rejected'); load(); }
  else toast(d.error||d.message||'Failed');
}
if(!token){document.getElementById('gate').style.display='block';}else{load();}
</script>
</body>
</html>
