<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JIG Craft Cannabis - Member Portal</title>
    <style>
        :root {
            --cbd-forest-green: #2a2a2a;
            --cbd-sage-green: #FFFFFF;
            --cbd-mint: #1A1A1A;
            --cbd-cream: #F4F1DE;
            --cbd-earth: #8B7355;
            --cbd-charcoal: #2F2F2F;
            --cbd-gold: #C9A961;
            --cbd-white: #FFFFFF;
            --cbd-black: #000000;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: var(--cbd-black);
            color: var(--cbd-white);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            overflow-y: auto;
            overflow-x: hidden;
        }

        body::before {
            content: '';
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: linear-gradient(135deg, var(--cbd-forest-green) 0%, var(--cbd-black) 100%);
            z-index: -2;
        }

        body::after {
            content: '';
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: radial-gradient(circle at center,
                rgba(74, 124, 89, 0.1) 0%,
                rgba(0, 0, 0, 0.7) 40%,
                rgba(0, 0, 0, 0.95) 100%);
            z-index: -1;
            animation: pulse 4s ease-in-out infinite;
        }
        
        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.9; }
        }
        
        .portal-container {
            width: 100%;
            max-width: 1200px;
            padding: 20px;
        }
        
        .logo-section {
            text-align: center;
            margin-bottom: 40px;
        }
        
        .logo-section img {
            max-width: 300px;
            width: 100%;
            height: auto;
            filter: drop-shadow(0 0 20px rgba(106, 144, 128, 0.5));
            margin-bottom: 20px;
        }

        .logo-section h1 {
            color: var(--cbd-mint);
            font-size: 3rem;
            text-transform: uppercase;
            letter-spacing: 3px;
            margin-bottom: 10px;
        }
        
        .logo-section p {
            opacity: 0.8;
            font-size: 1.2rem;
        }
        
        .auth-wrapper {
            display: flex;
            gap: 40px;
            justify-content: center;
            flex-wrap: wrap;
        }
        
        .auth-box {
            background: rgba(47, 47, 47, 0.9);
            backdrop-filter: blur(10px);
            padding: 40px;
            border-radius: 20px;
            width: 100%;
            max-width: 400px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            border: 2px solid var(--cbd-sage-green);
        }

        .auth-box h2 {
            color: var(--cbd-mint);
            margin-bottom: 30px;
            font-size: 1.8rem;
        }
        
        .form-group {
            margin-bottom: 20px;
        }
        
        .form-group label {
            display: block;
            margin-bottom: 8px;
            color: #ccc;
            font-size: 0.9rem;
            text-transform: uppercase;
            letter-spacing: 1px;
        }
        
        .form-group input {
            width: 100%;
            padding: 15px;
            background: #333;
            border: 1px solid #444;
            border-radius: 10px;
            color: #fff;
            font-size: 1rem;
            transition: all 0.3s;
        }
        
        .form-group input:focus {
            outline: none;
            border-color: var(--cbd-sage-green);
            box-shadow: 0 0 10px rgba(74, 124, 89, 0.3);
        }

        .btn-submit {
            width: 100%;
            padding: 15px;
            background: linear-gradient(135deg, var(--cbd-forest-green), var(--cbd-sage-green));
            color: var(--cbd-white);
            border: none;
            border-radius: 10px;
            font-size: 1.1rem;
            font-weight: bold;
            cursor: pointer;
            text-transform: uppercase;
            letter-spacing: 2px;
            transition: all 0.3s;
            margin-top: 10px;
        }

        .btn-submit:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 30px rgba(45, 80, 22, 0.6);
            background: linear-gradient(135deg, var(--cbd-sage-green), var(--cbd-mint));
        }
        
        .divider {
            text-align: center;
            margin: 20px 0;
            color: #666;
        }
        
        .member-benefits {
            background: rgba(74, 124, 89, 0.15);
            padding: 20px;
            border-radius: 10px;
            margin-top: 20px;
        }

        .member-benefits h3 {
            color: var(--cbd-mint);
            margin-bottom: 15px;
        }
        
        .member-benefits ul {
            list-style: none;
        }
        
        .member-benefits li {
            padding: 8px 0;
            padding-left: 25px;
            position: relative;
        }
        
        .member-benefits li:before {
            content: '✓';
            position: absolute;
            left: 0;
            color: var(--cbd-sage-green);
            font-weight: bold;
        }

        .forgot-link {
            text-align: center;
            margin-top: 15px;
        }

        .forgot-link a {
            color: var(--cbd-mint);
            text-decoration: none;
            transition: color 0.3s;
        }

        .forgot-link a:hover {
            color: var(--cbd-sage-green);
        }

        .error-msg {
            background: rgba(220, 38, 38, 0.2);
            color: #ff6666;
            padding: 10px;
            border-radius: 5px;
            margin-bottom: 20px;
            display: none;
        }
        
        .success-msg {
            background: rgba(34, 197, 94, 0.2);
            color: #4ade80;
            padding: 10px;
            border-radius: 5px;
            margin-bottom: 20px;
            display: none;
        }
        
        /* Mobile Responsiveness */
        @media (max-width: 1024px) {
            .portal-container {
                flex-direction: column;
                min-height: 100vh;
                padding: 2rem 1rem;
            }
            
            .logo-section {
                flex: none;
                padding: 2rem;
                margin-bottom: 2rem;
            }
            
            .logo-section img {
                width: 120px;
                height: 120px;
            }
            
            .logo-section h1 {
                font-size: 2.5rem;
            }
            
            .auth-wrapper {
                flex: none;
                width: 100%;
                max-width: 500px;
                margin: 0 auto;
            }
        }
        
        @media (max-width: 768px) {
            .portal-container {
                padding: 1rem;
                gap: 1rem;
            }
            
            .logo-section {
                padding: 1.5rem;
                margin-bottom: 1rem;
            }
            
            .logo-section img {
                width: 100px;
                height: 100px;
            }
            
            .logo-section h1 {
                font-size: 2rem;
                margin-bottom: 0.5rem;
            }
            
            .logo-section p {
                font-size: 1rem;
            }
            
            .auth-box {
                padding: 2rem 1.5rem;
                margin-bottom: 1rem;
            }
            
            .auth-box h2 {
                font-size: 1.5rem;
                margin-bottom: 1.5rem;
            }
            
            .form-group {
                margin-bottom: 1rem;
            }
            
            .form-group label {
                font-size: 0.9rem;
            }
            
            .form-group input {
                padding: 12px;
                font-size: 1rem;
            }
            
            .btn-submit {
                padding: 12px;
                font-size: 1rem;
            }
            
            .auth-toggle {
                padding: 1rem;
                font-size: 0.9rem;
            }
        }
        
        @media (max-width: 480px) {
            .portal-container {
                padding: 0.75rem;
            }
            
            .logo-section {
                padding: 1rem;
            }
            
            .logo-section img {
                width: 80px;
                height: 80px;
            }
            
            .logo-section h1 {
                font-size: 1.75rem;
                margin-bottom: 0.25rem;
            }
            
            .logo-section p {
                font-size: 0.9rem;
            }
            
            .auth-box {
                padding: 1.5rem 1rem;
            }
            
            .auth-box h2 {
                font-size: 1.3rem;
                margin-bottom: 1rem;
            }
            
            .form-group {
                margin-bottom: 1rem;
            }
            
            .form-group input {
                padding: 14px 12px;
                font-size: 16px; /* Prevents zoom on iOS */
            }
            
            .btn-submit {
                padding: 14px;
                font-size: 1rem;
                min-height: 48px; /* Better touch target */
            }
            
            .auth-toggle {
                padding: 0.75rem;
                font-size: 0.85rem;
            }
            
            .benefits-list {
                padding-left: 1rem;
            }
            
            .benefits-list li {
                font-size: 0.85rem;
                margin-bottom: 0.5rem;
            }
            
            .forgot-link {
                margin-top: 1rem;
            }
            
            .forgot-link a {
                font-size: 0.9rem;
            }
        }
        
        @media (max-width: 360px) {
            .portal-container {
                padding: 0.5rem;
            }
            
            .logo-section {
                padding: 0.75rem;
            }
            
            .logo-section img {
                width: 70px;
                height: 70px;
            }
            
            .logo-section h1 {
                font-size: 1.5rem;
            }
            
            .auth-box {
                padding: 1rem 0.75rem;
            }
            
            .auth-box h2 {
                font-size: 1.2rem;
            }
            
            .form-group input {
                padding: 12px 10px;
            }
            
            .btn-submit {
                padding: 12px;
                font-size: 0.95rem;
            }
        }
        
        /* Landscape orientation for mobile */
        @media (max-width: 768px) and (orientation: landscape) {
            .portal-container {
                flex-direction: row;
                align-items: center;
                padding: 1rem;
            }
            
            .logo-section {
                flex: 1;
                max-width: 400px;
                padding: 1rem;
                margin-bottom: 0;
                margin-right: 2rem;
            }
            
            .logo-section img {
                width: 80px;
                height: 80px;
            }
            
            .logo-section h1 {
                font-size: 1.75rem;
            }
            
            .auth-wrapper {
                flex: 1;
                max-width: 400px;
            }
        }
        
        /* High DPI screens */
        @media (-webkit-min-device-pixel-ratio: 2), (min-resolution: 2dppx) {
            .logo-section img {
                image-rendering: -webkit-optimize-contrast;
                image-rendering: crisp-edges;
            }
        }
        
        /* Ensure proper touch targets */
        @media (pointer: coarse) {
            .btn-submit, .auth-toggle a {
                min-height: 44px;
                min-width: 44px;
            }
            
            .form-group input {
                min-height: 44px;
            }
        }
        
        /* Dark mode support */
        @media (prefers-color-scheme: dark) {
            /* Colors are already optimized for dark theme */
        }
        
        /* Reduced motion support */
        @media (prefers-reduced-motion: reduce) {
            * {
                animation-duration: 0.01ms !important;
                animation-iteration-count: 1 !important;
                transition-duration: 0.01ms !important;
            }
        }
    </style>
</head>
<body>
    <div class="portal-container">
        <div class="logo-section">
            <img src="images/jig-logo-nobg.png" alt="JIG Craft Cannabis" onerror="this.style.display='none'">
            <h1>JIG Craft Cannabis</h1>
            <p>Member Portal Access</p>
        </div>
        
        <div class="auth-wrapper">
            <!-- Login Form -->
            <div class="auth-box">
                <h2>Login</h2>
                <div id="loginError" class="error-msg"></div>
                <form id="loginForm">
                    <div class="form-group">
                        <label>Email</label>
                        <input type="email" name="email" required placeholder="your@email.com">
                    </div>
                    <div class="form-group">
                        <label>Password</label>
                        <input type="password" name="password" required placeholder="••••••••">
                    </div>
                    <button type="submit" class="btn-submit">Login to Portal</button>
                </form>
                <div class="forgot-link">
                    <a href="#" onclick="alert('Password reset coming soon')">Forgot Password?</a>
                </div>
            </div>
            
            <!-- Register Form -->
            <div class="auth-box">
                <h2>Become a Member</h2>
                <div id="registerError" class="error-msg"></div>
                <div id="registerSuccess" class="success-msg"></div>
                <form id="registerForm">
                    <div class="form-group">
                        <label>Full Name</label>
                        <input type="text" name="fullname" required placeholder="John Doe">
                    </div>
                    <div class="form-group">
                        <label>Email</label>
                        <input type="email" name="email" required placeholder="your@email.com">
                    </div>
                    <div class="form-group">
                        <label>Password</label>
                        <input type="password" name="password" required placeholder="Min 8 characters">
                    </div>
                    <div class="form-group">
                        <label>Phone</label>
                        <input type="tel" name="phone" required placeholder="+27 XX XXX XXXX">
                    </div>
                    <button type="submit" class="btn-submit">Join the Movement</button>
                </form>
                
                <div class="member-benefits">
                    <h3>Wellness Membership Benefits</h3>
                    <ul>
                        <li>Access to premium CBD products</li>
                        <li>Members-only pricing on accessories</li>
                        <li>Wellness Points rewards program</li>
                        <li>Early access to new products</li>
                        <li>Thaba Café cafe menu access</li>
                    </ul>
                </div>
            </div>
        </div>
    </div>
    
    <script src="/frontend/config.js"></script>
    <script src="/frontend/jig-utils.js"></script>
    <script src="/frontend/jig-auth.js"></script>
    <script>

        // Login functionality with real API
        document.getElementById('loginForm').onsubmit = async function(e) {
            e.preventDefault();
            const formData = new FormData(e.target);
            const email = formData.get('email');
            const password = formData.get('password');
            const submitBtn = e.target.querySelector('.btn-submit');

            // Show loading
            submitBtn.textContent = 'Logging in...';
            submitBtn.disabled = true;
            document.getElementById('loginError').style.display = 'none';

            // Simple demo login for local testing

            if (email === 'admin@jig.cleva-ai.co.za' && password === 'DBC2025!') {
                    sessionStorage.setItem('adminUser', JSON.stringify({
                        loggedIn: true,
                        role: 'admin',
                        email: email
                    }));
                    window.location.href = 'admin.html';
                } else if (email && password) {
                    // Demo mode - accept any email/password for testing
                    sessionStorage.setItem('user', JSON.stringify({
                        email,
                        loggedIn: true,
                        isWellnessMember: true, // Allow dashboard access for testing
                        name: email.split('@')[0]
                    }));
                    sessionStorage.setItem('token', 'demo-token');
                    window.location.href = 'dashboard.html';
                } else {
                    document.getElementById('loginError').style.display = 'block';
                    document.getElementById('loginError').textContent = 'Invalid credentials';
                }

                submitBtn.textContent = 'Login to Portal';
                submitBtn.disabled = false;
            }
        };
        
        // Register functionality with real API
        document.getElementById('registerForm').onsubmit = async function(e) {
            e.preventDefault();
            const formData = new FormData(e.target);
            const fullname = formData.get('fullname');
            const email = formData.get('email');
            const password = formData.get('password');
            const phone = formData.get('phone');
            const submitBtn = e.target.querySelector('.btn-submit');
            
            // Validate
            if (password.length < 8) {
                document.getElementById('registerError').style.display = 'block';
                document.getElementById('registerError').textContent = 'Password must be at least 8 characters';
                return;
            }
            
            // Show loading
            submitBtn.textContent = 'Creating account...';
            submitBtn.disabled = true;
            document.getElementById('registerError').style.display = 'none';
            document.getElementById('registerSuccess').style.display = 'none';
            
            // For demo, just use localStorage registration
            {
                // Fallback for demo - save to localStorage
                const users = JSON.parse(localStorage.getItem('bmh_users') || '[]');
                const exists = users.find(u => u.email === email);

                if (!exists) {
                    users.push({
                        name: fullname,
                        email,
                        phone,
                        joined: new Date().toISOString(),
                        isWellness: false
                    });
                    localStorage.setItem('bmh_users', JSON.stringify(users));

                    document.getElementById('registerSuccess').style.display = 'block';
                    document.getElementById('registerSuccess').textContent = 'Registration successful! Redirecting to shop...';
                    e.target.reset();

                    // Auto-login and redirect to shop
                    setTimeout(() => {
                        sessionStorage.setItem('token', 'demo-token');
                        sessionStorage.setItem('user', JSON.stringify({
                            email: email,
                            name: fullname,
                            loggedIn: true,
                            isWellnessMember: false,
                            needsMembership: true
                        }));
                        window.location.href = 'index.html';
                    }, 2000);
                } else {
                    document.getElementById('registerError').style.display = 'block';
                    document.getElementById('registerError').textContent = 'Email already registered';
                }
            }
                submitBtn.textContent = 'Join the Movement';
                submitBtn.disabled = false;
            }
        };
    </script>
    <!-- UAT Bug Reporter -->
</body>
</html>
