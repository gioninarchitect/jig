<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create Account - Origin by ILCO Farming</title>
    <link rel="icon" type="image/png" href="images/origin-logo.png">
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;500;600;700;800;900&family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
    <style>
        :root {
            /* Origin by ILCO Farming Brand Colors */
            --black: #0E0E0E;
            --white: #FAFAFA;
            --or-gold: #C9A84C;
            --or-gold-muted: #8B6914;
            --or-gold-bright: #D4B86A;
            --or-black: #0A0A0A;
            --or-white: #F5F0E8;
            --or-dark: #141414;
            --or-dark-2: #1C1C1C;
            --or-gold: #C9A84C;
            --or-gold-light: #E8D5A3;
            --or-grey-2: #A89F8C;
            --or-grey-3: #6B6458;
            --or-grad-brand: linear-gradient(135deg, #8B6914 0%, #C9A84C 40%, #E8D5A3 70%, #C9A84C 100%);
            --green: #C9A84C;
            --green-dark: #8B6914;
            --green-light: #D4B86A;
            --amber: #C9A84C;
            --amber-dark: #8B6914;
            --amber-light: #E8D5A3;
            --slate: #1A1A1A;
            --slate-light: #222222;
            /* Legacy aliases */
            --cream: #1A1A1A;
            --green-deep: #8B6914;
            --gold: #C9A84C;
            --gold-dark: #8B6914;
            --gold-light: #E8D5A3;
            --red: #DC2626;
            --red-dark: #B91C1C;
            --red-light: #EF4444;
            /* Neutrals (inverted for dark theme) */
            --gray-50: #111111;
            --gray-100: #1A1A1A;
            --gray-200: #222222;
            --gray-300: #3A3A3A;
            --gray-400: #6B7280;
            --gray-500: #9CA3AF;
            --gray-600: #D1D5DB;
            --gray-700: #E5E7EB;
            --gray-800: #F3F4F6;
            --gray-900: #FAFAFA;
            /* Semantic */
            --success: #22C55E;
            --warning: #F8C242;
            --danger: #DC2626;
            --error: #EF4444;
            --info: #3B82F6;
            /* Shadows */
            --shadow-sm: 0 2px 8px rgba(0,0,0,0.3);
            --shadow-md: 0 8px 24px rgba(0,0,0,0.4);
            --shadow-lg: 0 16px 48px rgba(0,0,0,0.5);
            --shadow-xl: 0 24px 60px rgba(0,0,0,0.6);
            --shadow-or-gold: 0 8px 32px rgba(201,168,76,0.25);
            --shadow-gold: 0 8px 32px rgba(240,165,0,0.2);
            --shadow-green: 0 8px 32px rgba(139,105,20,0.2);
            --shadow-red: 0 8px 32px rgba(220,38,38,0.2);
            /* Gradients */
            --gradient-brand: linear-gradient(135deg, #8B6914 0%, #C9A84C 40%, #E8D5A3 70%, #C9A84C 100%);
            --gradient-dark: linear-gradient(180deg, #1A1A1A 0%, #0E0E0E 100%);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #0A0A0A;
            position: relative;
            overflow-x: hidden;
            padding: 2rem 1rem;
        }

        /* Subtle pattern overlay */
        body::before {
            content: '';
            position: fixed;
            inset: 0;
            opacity: 0.03;
            background-image: url("data:image/svg+xml,%3Csvg width='60' height='60' viewBox='0 0 60 60' xmlns='http://www.w3.org/2000/svg'%3E%3Cg fill='%233A5F48'%3E%3Ccircle cx='30' cy='30' r='2'/%3E%3C/g%3E%3C/svg%3E");
            background-size: 30px 30px;
            pointer-events: none;
            z-index: 0;
        }

        /* Decorative elements */
        .decor {
            position: fixed;
            border-radius: 50%;
            pointer-events: none;
            z-index: 0;
        }
        .decor-1 {
            width: 400px;
            height: 400px;
            background: linear-gradient(135deg, var(--green) 0%, transparent 70%);
            opacity: 0.08;
            top: -150px;
            right: -100px;
        }
        .decor-2 {
            width: 300px;
            height: 300px;
            background: linear-gradient(135deg, var(--gold) 0%, transparent 70%);
            opacity: 0.1;
            bottom: -100px;
            left: -80px;
        }

        .register-container {
            position: relative;
            z-index: 10;
            width: 100%;
            max-width: 480px;
        }

        .register-card {
            background: var(--or-dark);
            border-radius: 16px;
            padding: 2.5rem;
            box-shadow: 0 4px 24px rgba(42, 140, 44,0.12);
            border: 1px solid rgba(63, 192, 65,0.1);
        }

        .logo-container {
            text-align: center;
            margin-bottom: 1.5rem;
        }

        .logo {
            width: 80px;
            height: 80px;
            margin: 0 auto 0.75rem;
        }

        .logo img {
            width: 100%;
            height: 100%;
            object-fit: contain;
        }

        .brand-name {
            font-family: 'Cinzel', sans-serif;
            font-size: 1.75rem;
            color: var(--or-gold);
            text-transform: uppercase;
            letter-spacing: 0.02em;
            line-height: 1;
        }

        .brand-tagline {
            font-family: 'Inter', sans-serif;
            font-size: 0.8rem;
            font-weight: 500;
            color: var(--gold-dark);
            margin-top: 0.25rem;
            letter-spacing: 0.05em;
        }

        .register-title {
            font-family: 'Cinzel', sans-serif;
            font-size: 1.5rem;
            color: var(--or-gold);
            text-transform: uppercase;
            text-align: center;
            margin-bottom: 0.4rem;
        }

        .register-subtitle {
            text-align: center;
            color: var(--or-gold-muted);
            font-size: 0.875rem;
            margin-bottom: 1.5rem;
        }

        .form-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 1rem;
        }

        .form-group {
            margin-bottom: 1rem;
        }

        .form-label {
            display: block;
            font-size: 0.75rem;
            font-weight: 600;
            color: var(--or-gold-muted);
            margin-bottom: 0.5rem;
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }

        .form-input {
            width: 100%;
            padding: 0.875rem 1rem;
            background: var(--or-black);
            border: 2px solid transparent;
            border-radius: 8px;
            font-size: 1rem;
            color: var(--gray-900);
            transition: all 0.2s ease;
            font-family: 'Inter', sans-serif;
        }

        .form-input:focus {
            outline: none;
            border-color: var(--or-gold);
            background: var(--or-white);
            box-shadow: 0 0 0 3px rgba(63, 192, 65,0.1);
        }

        .form-input::placeholder {
            color: var(--or-grey-2);
        }

        .password-requirements {
            font-size: 0.75rem;
            color: var(--or-gold);
            margin-top: 0.4rem;
        }

        .terms-checkbox {
            display: flex;
            align-items: flex-start;
            gap: 0.75rem;
            margin-bottom: 1.5rem;
            font-size: 0.85rem;
            color: var(--gray-700);
        }

        .terms-checkbox input[type="checkbox"] {
            width: 20px;
            height: 20px;
            accent-color: var(--or-gold);
            margin-top: 2px;
            flex-shrink: 0;
            cursor: pointer;
        }

        .terms-checkbox a {
            color: var(--or-gold);
            text-decoration: none;
            font-weight: 600;
            transition: color 0.2s;
        }

        .terms-checkbox a:hover {
            color: var(--gold-dark);
        }

        .btn-register {
            width: 100%;
            padding: 1rem;
            background: var(--or-gold);
            color: var(--or-white);
            border: none;
            border-radius: 8px;
            font-family: 'Cinzel', sans-serif;
            font-size: 1.125rem;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .btn-register:hover {
            background: var(--green-dark);
            transform: translateY(-1px);
            box-shadow: 0 4px 12px rgba(42, 140, 44,0.25);
        }

        .btn-register:active {
            transform: translateY(0);
        }

        .btn-register:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none;
        }

        .divider {
            display: flex;
            align-items: center;
            margin: 1.5rem 0;
            color: var(--or-grey-2);
            font-size: 0.8rem;
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }

        .divider::before,
        .divider::after {
            content: '';
            flex: 1;
            height: 1px;
            background: var(--gray-200);
        }

        .divider span {
            padding: 0 1rem;
        }

        .login-link {
            text-align: center;
            color: var(--or-gold-muted);
            font-size: 0.9rem;
        }

        .login-link a {
            color: var(--or-gold);
            font-weight: 600;
            text-decoration: none;
            transition: color 0.2s;
        }

        .login-link a:hover {
            color: var(--gold-dark);
        }

        .error-message {
            background: rgba(220,38,38,0.08);
            border: 1px solid rgba(220,38,38,0.3);
            color: var(--error);
            padding: 0.875rem;
            border-radius: 8px;
            margin-bottom: 1.25rem;
            font-size: 0.85rem;
            display: none;
        }

        .error-message.show {
            display: block;
        }

        .success-message {
            background: rgba(22,163,74,0.08);
            border: 1px solid rgba(22,163,74,0.3);
            color: var(--success);
            padding: 0.875rem;
            border-radius: 8px;
            margin-bottom: 1.25rem;
            font-size: 0.85rem;
            display: none;
        }

        .success-message.show {
            display: block;
        }

        /* Benefits section */
        .benefits {
            margin-top: 1.5rem;
            padding: 1.25rem;
            background: var(--or-black);
            border-radius: 12px;
            border: 1px solid rgba(63, 192, 65,0.1);
        }

        .benefits-title {
            font-family: 'Cinzel', sans-serif;
            font-size: 1rem;
            color: var(--or-gold);
            text-transform: uppercase;
            margin-bottom: 0.75rem;
            letter-spacing: 0.02em;
        }

        .benefits-list {
            list-style: none;
        }

        .benefits-list li {
            padding: 0.5rem 0;
            font-size: 0.85rem;
            color: var(--gray-700);
            padding-left: 1.75rem;
            position: relative;
        }

        .benefits-list li::before {
            content: '';
            position: absolute;
            left: 0;
            top: 50%;
            transform: translateY(-50%);
            width: 16px;
            height: 16px;
            background: var(--gold);
            border-radius: 50%;
        }

        .benefits-list li::after {
            content: '\2713';
            position: absolute;
            left: 3px;
            top: 50%;
            transform: translateY(-50%);
            font-size: 10px;
            color: var(--or-white);
            font-weight: bold;
        }

        /* Toast notifications */
        .toast-container {
            position: fixed;
            top: 1.5rem;
            right: 1.5rem;
            z-index: 9999;
        }

        .toast {
            background: var(--or-white);
            border-radius: 8px;
            padding: 1rem 1.5rem;
            box-shadow: 0 4px 24px rgba(0,0,0,0.15);
            display: flex;
            align-items: center;
            gap: 1rem;
            min-width: 280px;
            animation: slideIn 0.3s ease-out;
            border-left: 4px solid var(--green);
            margin-bottom: 0.75rem;
        }

        .toast-success { border-left-color: var(--success); }
        .toast-error { border-left-color: var(--error); }

        @keyframes slideIn {
            from { transform: translateX(100%); opacity: 0; }
            to { transform: translateX(0); opacity: 1; }
        }

        /* Responsive */
        @media (max-width: 540px) {
            body { padding: 1rem; }
            .register-card { padding: 2rem 1.5rem; }
            .form-row { grid-template-columns: 1fr; gap: 0; }
            .brand-name { font-size: 1.5rem; }
            .logo { width: 70px; height: 70px; }
        }

        @media (max-width: 360px) {
            .register-card { padding: 1.5rem 1rem; }
            .logo { width: 60px; height: 60px; }
            .brand-name { font-size: 1.25rem; }
            .form-input { padding: 0.75rem; }
        }
    </style>
</head>
<body>
    <div class="decor decor-1"></div>
    <div class="decor decor-2"></div>

    <div class="toast-container" id="toastContainer"></div>

    <div class="register-container">
        <div class="register-card">
            <div class="logo-container">
                <div class="logo">
                    <img src="images/origin-logo.png" alt="Origin by ILCO Farming" style="width:100%;height:100%;object-fit:contain;">
                </div>
                <div class="brand-tagline">Premium Cannabis Care</div>
            </div>

            <h1 class="register-title">Create Account</h1>
            <p class="register-subtitle">Join the Origin community</p>

            <div class="error-message" id="errorMessage"></div>
            <div class="success-message" id="successMessage"></div>

            <form id="registerForm" onsubmit="handleRegister(event)">
                <div class="form-row">
                    <div class="form-group">
                        <label class="form-label" for="firstName">First Name</label>
                        <input type="text" id="firstName" class="form-input" placeholder="John" required>
                    </div>
                    <div class="form-group">
                        <label class="form-label" for="lastName">Last Name</label>
                        <input type="text" id="lastName" class="form-input" placeholder="Doe" required>
                    </div>
                </div>

                <div class="form-group">
                    <label class="form-label" for="email">Email Address</label>
                    <input type="email" id="email" class="form-input" placeholder="your@email.com" required>
                </div>

                <div class="form-group">
                    <label class="form-label" for="phone">Phone Number</label>
                    <input type="tel" id="phone" class="form-input" placeholder="+27 XX XXX XXXX" required>
                </div>

                <div class="form-group">
                    <label class="form-label" for="password">Password</label>
                    <input type="password" id="password" class="form-input" placeholder="Create a password" required minlength="8">
                    <p class="password-requirements">Minimum 8 characters</p>
                </div>

                <div class="form-group">
                    <label class="form-label" for="confirmPassword">Confirm Password</label>
                    <input type="password" id="confirmPassword" class="form-input" placeholder="Confirm your password" required>
                </div>

                <label class="terms-checkbox">
                    <input type="checkbox" id="terms" required>
                    <span>I agree to the <a href="terms.html">Terms of Service</a> and <a href="privacy.html">Privacy Policy</a></span>
                </label>

                <button type="submit" class="btn-register" id="registerBtn">
                    Create Account
                </button>
            </form>

            <div class="divider"><span>Already a member?</span></div>

            <p class="login-link">
                Have an account? <a href="login.html">Sign In</a>
            </p>

            <div class="benefits">
                <h4 class="benefits-title">Member Benefits</h4>
                <ul class="benefits-list">
                    <li>Access to premium quality products</li>
                    <li>Collection from 8 convenient locations</li>
                    <li>Member-only pricing & deals</li>
                    <li>Order tracking & history</li>
                </ul>
            </div>
        </div>
    </div>

    <script src="frontend/config.js"></script>
    <script src="frontend/or-utils.js"></script>
    <script src="frontend/or-auth.js"></script>
    <script>
        // Handle registration
        async function handleRegister(e) {
            e.preventDefault();

            const firstName = document.getElementById('firstName').value.trim();
            const lastName = document.getElementById('lastName').value.trim();
            const email = document.getElementById('email').value.trim();
            const phone = document.getElementById('phone').value.trim();
            const password = document.getElementById('password').value;
            const confirmPassword = document.getElementById('confirmPassword').value;
            const terms = document.getElementById('terms').checked;
            const registerBtn = document.getElementById('registerBtn');
            const errorMessage = document.getElementById('errorMessage');
            const successMessage = document.getElementById('successMessage');

            // Hide previous messages
            errorMessage.classList.remove('show');
            successMessage.classList.remove('show');

            // Validate
            if (!firstName || !lastName || !email || !phone || !password) {
                errorMessage.textContent = 'Please fill in all fields.';
                errorMessage.classList.add('show');
                return;
            }

            if (password.length < 8) {
                errorMessage.textContent = 'Password must be at least 8 characters.';
                errorMessage.classList.add('show');
                return;
            }

            if (password !== confirmPassword) {
                errorMessage.textContent = 'Passwords do not match.';
                errorMessage.classList.add('show');
                return;
            }

            if (!terms) {
                errorMessage.textContent = 'Please agree to the Terms of Service.';
                errorMessage.classList.add('show');
                return;
            }

            // Disable button
            registerBtn.disabled = true;
            registerBtn.textContent = 'Creating Account...';

            try {
                const username = email.split('@')[0];

                const response = await fetch(`${API_URL}/auth/register`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        email,
                        password,
                        firstName,
                        lastName,
                        username,
                        phone
                    })
                });

                const data = await response.json();

                if (response.ok && data.success) {
                    // Store token
                    localStorage.setItem('token', data.token);
                    if (data.user) {
                        localStorage.setItem('user', JSON.stringify(data.user));
                    }

                    successMessage.textContent = 'Account created successfully! Redirecting...';
                    successMessage.classList.add('show');
                    showToast('Welcome to Origin!', 'success');

                    // Redirect to dashboard
                    setTimeout(() => {
                        window.location.href = 'dashboard.html';
                    }, 1500);
                } else {
                    throw new Error(data.message || 'Registration failed');
                }
            } catch (error) {
                errorMessage.textContent = error.message || 'Registration failed. Please try again.';
                errorMessage.classList.add('show');
                showToast(error.message || 'Registration failed', 'error');
            } finally {
                registerBtn.disabled = false;
                registerBtn.textContent = 'Create Account';
            }
        }

        // Check if already logged in
        document.addEventListener('DOMContentLoaded', () => {
            const token = localStorage.getItem('token');
            if (token) {
                // Optionally redirect to dashboard if already logged in
                // window.location.href = 'dashboard.html';
            }
        });
    </script>
</body>
</html>
