<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ormonde Dispensary - Basotho Medical Herbs</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&family=Playfair+Display:wght@700;900&display=swap" rel="stylesheet">
    <style>
        :root {
            --bmh-teal: #0B8C7A;
            --bmh-teal-hover: #097563;
            --bmh-teal-light: #0EBAAA;
            --bmh-navy: #1E3A5F;
            --black: #000000;
            --charcoal: #0a0a0a;
            --dark: #111111;
            --slate: #1a1a1a;
            --gray: #2a2a2a;
            --light-gray: #666666;
            --white: #FFFFFF;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            background: var(--charcoal);
            color: var(--white);
            min-height: 100vh;
        }

        /* Hero Section with Background */
        .hero-section {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: linear-gradient(135deg, rgba(11, 140, 122, 0.3) 0%, rgba(0, 0, 0, 0.9) 100%),
                        url('images/dispensary-bg.jpg') center/cover no-repeat;
            position: relative;
            padding: 40px 20px;
        }

        .hero-section::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: radial-gradient(circle at 30% 50%, rgba(11, 140, 122, 0.15) 0%, transparent 50%);
            pointer-events: none;
        }

        /* Back Link */
        .back-link {
            position: absolute;
            top: 30px;
            left: 30px;
            color: var(--white);
            text-decoration: none;
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 14px;
            opacity: 0.8;
            transition: opacity 0.3s;
        }

        .back-link:hover {
            opacity: 1;
        }

        /* Login Card */
        .login-container {
            position: relative;
            z-index: 10;
            width: 100%;
            max-width: 480px;
        }

        .login-card {
            background: linear-gradient(135deg, var(--dark) 0%, var(--slate) 100%);
            border-radius: 24px;
            padding: 48px 40px;
            border: 1px solid rgba(11, 140, 122, 0.3);
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.5),
                        0 0 100px rgba(11, 140, 122, 0.1);
            backdrop-filter: blur(20px);
        }

        .login-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 4px;
            background: linear-gradient(90deg, var(--bmh-teal), var(--bmh-teal-light));
            border-radius: 24px 24px 0 0;
        }

        /* Logo and Branding */
        .brand-header {
            text-align: center;
            margin-bottom: 40px;
        }

        .brand-header img {
            width: 180px;
            height: auto;
            margin-bottom: 20px;
        }

        .dispensary-name {
            font-family: 'Playfair Display', serif;
            font-size: 32px;
            font-weight: 700;
            color: var(--bmh-teal-light);
            margin-bottom: 8px;
        }

        .dispensary-tagline {
            font-size: 14px;
            color: var(--light-gray);
            text-transform: uppercase;
            letter-spacing: 2px;
        }

        /* OTP Flow States */
        .otp-step {
            display: none;
        }

        .otp-step.active {
            display: block;
            animation: fadeIn 0.4s ease;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* Form Elements */
        .form-group {
            margin-bottom: 24px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            font-size: 13px;
            font-weight: 600;
            color: var(--white);
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        input {
            width: 100%;
            padding: 16px;
            background: var(--gray);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 12px;
            color: var(--white);
            font-size: 16px;
            transition: all 0.3s ease;
        }

        input:focus {
            outline: none;
            border-color: var(--bmh-teal);
            box-shadow: 0 0 0 4px rgba(11, 140, 122, 0.15);
        }

        input::placeholder {
            color: var(--light-gray);
        }

        /* OTP Input */
        .otp-inputs {
            display: flex;
            gap: 12px;
            justify-content: center;
            margin: 30px 0;
        }

        .otp-inputs input {
            width: 56px;
            height: 64px;
            text-align: center;
            font-size: 24px;
            font-weight: 700;
            border-radius: 12px;
            padding: 0;
        }

        /* Buttons */
        .btn-primary {
            width: 100%;
            padding: 16px;
            background: linear-gradient(135deg, var(--bmh-teal) 0%, var(--bmh-teal-hover) 100%);
            color: var(--white);
            border: none;
            border-radius: 12px;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 25px rgba(11, 140, 122, 0.4);
        }

        .btn-primary:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none;
        }

        .btn-secondary {
            background: transparent;
            border: 1px solid rgba(255, 255, 255, 0.3);
            color: var(--white);
        }

        .btn-secondary:hover {
            background: rgba(255, 255, 255, 0.1);
        }

        /* Messages */
        .message {
            padding: 14px 16px;
            border-radius: 10px;
            margin-bottom: 20px;
            font-size: 14px;
            display: none;
        }

        .message.error {
            background: rgba(239, 68, 68, 0.15);
            border: 1px solid rgba(239, 68, 68, 0.3);
            color: #ff6b6b;
        }

        .message.success {
            background: rgba(11, 140, 122, 0.15);
            border: 1px solid rgba(11, 140, 122, 0.3);
            color: var(--bmh-teal-light);
        }

        .message.show {
            display: block;
        }

        /* Timer */
        .resend-timer {
            text-align: center;
            margin-top: 20px;
            color: var(--light-gray);
            font-size: 14px;
        }

        .resend-timer a {
            color: var(--bmh-teal-light);
            text-decoration: none;
            cursor: pointer;
        }

        .resend-timer a:hover {
            text-decoration: underline;
        }

        .resend-timer a.disabled {
            color: var(--light-gray);
            cursor: not-allowed;
            text-decoration: none;
        }

        /* Dev Mode Banner */
        .dev-mode-banner {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            background: linear-gradient(90deg, #f59e0b, #d97706);
            color: #000;
            padding: 8px;
            text-align: center;
            font-size: 12px;
            font-weight: 600;
            z-index: 1000;
            display: none;
        }

        .dev-mode-banner.show {
            display: block;
        }

        /* Quick Login for Dev */
        .dev-quick-login {
            margin-top: 30px;
            padding-top: 20px;
            border-top: 1px solid rgba(255, 255, 255, 0.1);
            display: none;
        }

        .dev-quick-login.show {
            display: block;
        }

        .dev-quick-login h4 {
            font-size: 12px;
            color: var(--light-gray);
            margin-bottom: 12px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .role-buttons {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 8px;
        }

        .role-btn {
            padding: 10px;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.15);
            border-radius: 8px;
            color: var(--white);
            font-size: 12px;
            cursor: pointer;
            transition: all 0.2s;
        }

        .role-btn:hover {
            background: rgba(11, 140, 122, 0.2);
            border-color: var(--bmh-teal);
        }

        .role-btn i {
            display: block;
            font-size: 18px;
            margin-bottom: 4px;
        }

        /* Responsive */
        @media (max-width: 480px) {
            .login-card {
                padding: 32px 24px;
            }

            .dispensary-name {
                font-size: 26px;
            }

            .otp-inputs input {
                width: 48px;
                height: 56px;
                font-size: 20px;
            }
        }
    </style>
</head>
<body>
    <!-- Dev Mode Banner -->
    <div class="dev-mode-banner" id="devBanner">
        DEV MODE - Using test email: florisolivier7@gmail.com
    </div>

    <div class="hero-section">
        <a href="locations.html" class="back-link">
            <i class="fas fa-arrow-left"></i>
            Back to Locations
        </a>

        <div class="login-container">
            <div class="login-card">
                <div class="brand-header">
                    <img src="/images/logo-w.png" alt="Basotho Medical Herbs" onerror="this.style.display='none'">
                    <h1 class="dispensary-name">Ormonde</h1>
                    <p class="dispensary-tagline">Cannabis Dispensary</p>
                </div>

                <!-- Step 1: Email Input -->
                <div class="otp-step active" id="step-email">
                    <div class="message error" id="emailError"></div>
                    <div class="message success" id="emailSuccess"></div>

                    <form onsubmit="requestOTP(event)">
                        <div class="form-group">
                            <label>Email Address</label>
                            <input type="email" id="emailInput" required placeholder="you@example.com" autocomplete="email">
                        </div>
                        <button type="submit" class="btn-primary" id="requestOTPBtn">
                            <i class="fas fa-paper-plane"></i> Send Login Code
                        </button>
                    </form>

                    <!-- Dev Mode Quick Login -->
                    <div class="dev-quick-login" id="devQuickLogin">
                        <h4>Developer Mode Active</h4>
                        <p style="color: var(--light-gray); font-size: 13px; margin-bottom: 12px;">
                            Login as: <strong style="color: var(--bmh-teal-light);">florisolivier7@gmail.com</strong>
                        </p>
                        <button class="role-btn" onclick="devLogin()" style="width: 100%;">
                            <i class="fas fa-code"></i>
                            Developer Login (Owner Access)
                        </button>
                    </div>
                </div>

                <!-- Step 2: OTP Verification -->
                <div class="otp-step" id="step-otp">
                    <div class="message error" id="otpError"></div>
                    <div class="message success" id="otpSuccess"></div>

                    <p style="text-align: center; color: var(--light-gray); margin-bottom: 10px;">
                        Enter the 6-digit code sent to
                    </p>
                    <p style="text-align: center; color: var(--white); font-weight: 600; margin-bottom: 20px;" id="displayEmail"></p>

                    <form onsubmit="verifyOTP(event)">
                        <div class="otp-inputs" id="otpInputs">
                            <input type="text" maxlength="1" pattern="[0-9]" inputmode="numeric" required>
                            <input type="text" maxlength="1" pattern="[0-9]" inputmode="numeric" required>
                            <input type="text" maxlength="1" pattern="[0-9]" inputmode="numeric" required>
                            <input type="text" maxlength="1" pattern="[0-9]" inputmode="numeric" required>
                            <input type="text" maxlength="1" pattern="[0-9]" inputmode="numeric" required>
                            <input type="text" maxlength="1" pattern="[0-9]" inputmode="numeric" required>
                        </div>
                        <button type="submit" class="btn-primary" id="verifyOTPBtn">
                            <i class="fas fa-check"></i> Verify & Login
                        </button>
                    </form>

                    <div class="resend-timer">
                        <span id="timerText">Resend code in <strong id="countdown">60</strong>s</span>
                        <a id="resendLink" class="disabled" onclick="resendOTP()">Resend Code</a>
                    </div>

                    <button onclick="goBackToEmail()" class="btn-primary btn-secondary" style="margin-top: 15px;">
                        <i class="fas fa-arrow-left"></i> Change Email
                    </button>
                </div>
            </div>
        </div>
    </div>

    <script>
        // API URL
        const API_URL = window.location.hostname === 'localhost' || window.location.hostname === '127.0.0.1'
            ? 'http://localhost:3001/api/v1'
            : `${window.location.protocol}//${window.location.host}/api/v1`;

        // Dev mode check
        const DEV_MODE = window.location.hostname === 'localhost' || window.location.hostname === '127.0.0.1';
        const DEV_TEST_EMAIL = 'florisolivier7@gmail.com';

        let currentEmail = '';
        let countdownTimer = null;

        // Initialize
        document.addEventListener('DOMContentLoaded', function() {
            if (DEV_MODE) {
                document.getElementById('devBanner').classList.add('show');
                document.getElementById('devQuickLogin').classList.add('show');
                document.getElementById('emailInput').value = DEV_TEST_EMAIL;
            }

            // Setup OTP input navigation
            setupOTPInputs();

            // Check if already logged in
            const token = sessionStorage.getItem('token');
            if (token) {
                redirectToDashboard();
            }
        });

        function setupOTPInputs() {
            const inputs = document.querySelectorAll('#otpInputs input');
            inputs.forEach((input, index) => {
                input.addEventListener('input', (e) => {
                    const value = e.target.value;
                    if (value.length === 1 && index < inputs.length - 1) {
                        inputs[index + 1].focus();
                    }
                });

                input.addEventListener('keydown', (e) => {
                    if (e.key === 'Backspace' && !e.target.value && index > 0) {
                        inputs[index - 1].focus();
                    }
                });

                input.addEventListener('paste', (e) => {
                    e.preventDefault();
                    const pasteData = e.clipboardData.getData('text').replace(/\D/g, '').slice(0, 6);
                    pasteData.split('').forEach((char, i) => {
                        if (inputs[i]) inputs[i].value = char;
                    });
                    if (pasteData.length === 6) {
                        inputs[5].focus();
                    }
                });
            });
        }

        async function requestOTP(e) {
            e.preventDefault();
            const email = document.getElementById('emailInput').value.trim();
            const btn = document.getElementById('requestOTPBtn');
            const errorDiv = document.getElementById('emailError');
            const successDiv = document.getElementById('emailSuccess');

            btn.disabled = true;
            btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Sending...';
            errorDiv.classList.remove('show');
            successDiv.classList.remove('show');

            try {
                const response = await fetch(`${API_URL}/auth/otp/request`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email, purpose: 'login' })
                });

                const data = await response.json();

                if (data.success) {
                    currentEmail = email;
                    successDiv.textContent = 'Code sent! Check your email.';
                    successDiv.classList.add('show');

                    setTimeout(() => {
                        showOTPStep();
                    }, 1000);
                } else {
                    errorDiv.textContent = data.message || 'Failed to send code';
                    errorDiv.classList.add('show');
                }
            } catch (error) {
                console.error('OTP request error:', error);
                errorDiv.textContent = 'Connection error. Please try again.';
                errorDiv.classList.add('show');
            } finally {
                btn.disabled = false;
                btn.innerHTML = '<i class="fas fa-paper-plane"></i> Send Login Code';
            }
        }

        function showOTPStep() {
            document.getElementById('step-email').classList.remove('active');
            document.getElementById('step-otp').classList.add('active');
            document.getElementById('displayEmail').textContent = currentEmail;

            // Clear OTP inputs
            document.querySelectorAll('#otpInputs input').forEach(input => input.value = '');
            document.querySelectorAll('#otpInputs input')[0].focus();

            // Start countdown
            startCountdown(60);
        }

        function goBackToEmail() {
            document.getElementById('step-otp').classList.remove('active');
            document.getElementById('step-email').classList.add('active');
            clearInterval(countdownTimer);
        }

        function startCountdown(seconds) {
            let remaining = seconds;
            const countdownEl = document.getElementById('countdown');
            const timerText = document.getElementById('timerText');
            const resendLink = document.getElementById('resendLink');

            timerText.style.display = 'inline';
            resendLink.style.display = 'none';
            resendLink.classList.add('disabled');

            clearInterval(countdownTimer);
            countdownTimer = setInterval(() => {
                remaining--;
                countdownEl.textContent = remaining;

                if (remaining <= 0) {
                    clearInterval(countdownTimer);
                    timerText.style.display = 'none';
                    resendLink.style.display = 'inline';
                    resendLink.classList.remove('disabled');
                }
            }, 1000);
        }

        async function resendOTP() {
            const resendLink = document.getElementById('resendLink');
            if (resendLink.classList.contains('disabled')) return;

            resendLink.textContent = 'Sending...';
            resendLink.classList.add('disabled');

            try {
                const response = await fetch(`${API_URL}/auth/otp/resend`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email: currentEmail, purpose: 'login' })
                });

                const data = await response.json();

                if (data.success) {
                    document.getElementById('otpSuccess').textContent = 'New code sent!';
                    document.getElementById('otpSuccess').classList.add('show');
                    startCountdown(60);
                } else {
                    document.getElementById('otpError').textContent = data.message;
                    document.getElementById('otpError').classList.add('show');
                }
            } catch (error) {
                document.getElementById('otpError').textContent = 'Failed to resend code';
                document.getElementById('otpError').classList.add('show');
            }

            resendLink.textContent = 'Resend Code';
        }

        async function verifyOTP(e) {
            e.preventDefault();
            const inputs = document.querySelectorAll('#otpInputs input');
            const otp = Array.from(inputs).map(i => i.value).join('');

            if (otp.length !== 6) {
                document.getElementById('otpError').textContent = 'Please enter all 6 digits';
                document.getElementById('otpError').classList.add('show');
                return;
            }

            const btn = document.getElementById('verifyOTPBtn');
            const errorDiv = document.getElementById('otpError');

            btn.disabled = true;
            btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Verifying...';
            errorDiv.classList.remove('show');

            try {
                const response = await fetch(`${API_URL}/auth/otp/verify`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email: currentEmail, otpCode: otp })
                });

                const data = await response.json();

                if (data.success) {
                    // Store auth data
                    sessionStorage.setItem('token', data.token);
                    sessionStorage.setItem('user', JSON.stringify(data.user));
                    sessionStorage.setItem('currentBranch', 'ormonde');

                    // Redirect based on role
                    redirectToDashboard(data.user.role);
                } else {
                    errorDiv.textContent = data.message || 'Invalid code';
                    errorDiv.classList.add('show');
                    // Clear inputs on error
                    inputs.forEach(i => i.value = '');
                    inputs[0].focus();
                }
            } catch (error) {
                console.error('OTP verify error:', error);
                errorDiv.textContent = 'Connection error. Please try again.';
                errorDiv.classList.add('show');
            } finally {
                btn.disabled = false;
                btn.innerHTML = '<i class="fas fa-check"></i> Verify & Login';
            }
        }

        function redirectToDashboard(role) {
            // For Ormonde, redirect to the appropriate dashboard based on role
            // Owner goes to main admin, others go to store-specific views
            const roleRedirects = {
                'owner': 'admin.html',
                'admin': 'admin.html',
                'staff_manager': 'pos.html',
                'staff_assistant': 'pos.html',
                'user': 'dashboard.html'
            };

            const redirectUrl = roleRedirects[role] || 'dashboard.html';

            // Add branch context to URL
            const separator = redirectUrl.includes('?') ? '&' : '?';
            window.location.href = `${redirectUrl}${separator}branch=ormonde`;
        }

        // Dev mode quick login - Single developer account
        async function devLogin() {
            if (!DEV_MODE) return;

            try {
                const response = await fetch(`${API_URL}/auth/login`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        email: DEV_TEST_EMAIL,
                        password: 'DevMode123!'
                    })
                });

                const data = await response.json();

                if (data.success) {
                    sessionStorage.setItem('token', data.token);
                    sessionStorage.setItem('user', JSON.stringify(data.user));
                    sessionStorage.setItem('currentBranch', 'ormonde');
                    redirectToDashboard(data.user.role);
                } else {
                    // If password login fails, use OTP flow
                    document.getElementById('emailInput').value = DEV_TEST_EMAIL;
                    requestOTP({ preventDefault: () => {} });
                }
            } catch (error) {
                console.error('Dev login error:', error);
                // Fall back to OTP flow
                document.getElementById('emailInput').value = DEV_TEST_EMAIL;
            }
        }
    </script>
</body>
</html>
