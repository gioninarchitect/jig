<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Shopping Cart - Basotho Medical Herbs</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #0a0a0a;
            color: #fff;
            min-height: 100vh;
        }

        header {
            background: rgba(0, 0, 0, 0.9);
            padding: 1rem 2rem;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
        }

        nav {
            display: flex;
            justify-content: space-between;
            align-items: center;
            max-width: 1400px;
            margin: 0 auto;
        }

        .logo {
            font-size: 1.5rem;
            font-weight: bold;
            background: linear-gradient(135deg, #FFFFFF 0%, #2a2a2a 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .nav-links {
            display: flex;
            gap: 2rem;
            align-items: center;
        }

        .nav-links a {
            color: #fff;
            text-decoration: none;
        }

        .container {
            max-width: 1200px;
            margin: 2rem auto;
            padding: 0 2rem;
        }

        .cart-header {
            font-size: 2rem;
            margin-bottom: 2rem;
        }

        .cart-content {
            display: grid;
            grid-template-columns: 2fr 1fr;
            gap: 2rem;
        }

        .cart-items {
            background: rgba(255, 255, 255, 0.05);
            border-radius: 10px;
            padding: 2rem;
        }

        .cart-item {
            display: grid;
            grid-template-columns: 100px 1fr auto auto auto;
            gap: 1rem;
            align-items: center;
            padding: 1rem 0;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
        }

        .cart-item:last-child {
            border-bottom: none;
        }

        .item-image {
            width: 100px;
            height: 100px;
            border-radius: 5px;
            background: linear-gradient(135deg, rgba(102, 126, 234, 0.1), rgba(118, 75, 162, 0.1));
            object-fit: cover;
        }

        .item-details h3 {
            margin-bottom: 0.5rem;
        }

        .item-details p {
            color: rgba(255, 255, 255, 0.6);
            font-size: 0.9rem;
        }

        .quantity-controls {
            display: flex;
            align-items: center;
            background: rgba(255, 255, 255, 0.05);
            border-radius: 5px;
        }

        .quantity-btn {
            padding: 0.5rem 0.75rem;
            background: none;
            border: none;
            color: #fff;
            cursor: pointer;
            font-size: 1.2rem;
        }

        .quantity-btn:hover {
            background: rgba(255, 255, 255, 0.1);
        }

        .quantity-value {
            padding: 0 1rem;
            min-width: 40px;
            text-align: center;
        }

        .item-price {
            font-size: 1.2rem;
            color: #FFFFFF;
            font-weight: bold;
        }

        .remove-btn {
            background: none;
            border: none;
            color: #ff4757;
            cursor: pointer;
            font-size: 1.5rem;
        }

        .cart-summary {
            background: rgba(255, 255, 255, 0.05);
            border-radius: 10px;
            padding: 2rem;
            height: fit-content;
            position: sticky;
            top: 2rem;
        }

        .summary-title {
            font-size: 1.5rem;
            margin-bottom: 1.5rem;
        }

        .summary-row {
            display: flex;
            justify-content: space-between;
            margin-bottom: 1rem;
        }

        .summary-row.total {
            font-size: 1.25rem;
            font-weight: bold;
            padding-top: 1rem;
            border-top: 1px solid rgba(255, 255, 255, 0.1);
            color: #FFFFFF;
        }

        .coupon-section {
            margin: 1.5rem 0;
            padding: 1.5rem 0;
            border-top: 1px solid rgba(255, 255, 255, 0.1);
        }

        .coupon-input-group {
            display: flex;
            gap: 0.5rem;
        }

        .coupon-input {
            flex: 1;
            padding: 0.75rem;
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 5px;
            color: #fff;
        }

        .apply-btn {
            padding: 0.75rem 1.5rem;
            background: rgba(102, 126, 234, 0.2);
            border: 1px solid #FFFFFF;
            border-radius: 5px;
            color: #FFFFFF;
            cursor: pointer;
        }

        .checkout-btn {
            width: 100%;
            padding: 1rem;
            background: linear-gradient(135deg, #FFFFFF 0%, #2a2a2a 100%);
            border: none;
            border-radius: 5px;
            color: #fff;
            font-size: 1.1rem;
            cursor: pointer;
            margin-top: 2rem;
        }

        .checkout-btn:hover {
            opacity: 0.9;
        }

        .empty-cart {
            text-align: center;
            padding: 4rem;
        }

        .empty-cart h2 {
            margin-bottom: 1rem;
            color: rgba(255, 255, 255, 0.6);
        }

        .shop-now-btn {
            display: inline-block;
            padding: 1rem 2rem;
            background: linear-gradient(135deg, #FFFFFF 0%, #2a2a2a 100%);
            border-radius: 5px;
            color: #fff;
            text-decoration: none;
            margin-top: 1rem;
        }

        @media (max-width: 768px) {
            .cart-content {
                grid-template-columns: 1fr;
            }

            .cart-item {
                grid-template-columns: 80px 1fr;
                gap: 0.5rem;
            }

            .item-image {
                width: 80px;
                height: 80px;
            }

            .cart-summary {
                position: static;
            }
        }

        /* Toast Notification Styles */
        .toast-container {
            position: fixed;
            top: 20px;
            right: 20px;
            z-index: 10000;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .toast {
            min-width: 300px;
            max-width: 400px;
            padding: 16px 20px;
            border-radius: 8px;
            background: #1a1a1a;
            border: 1px solid rgba(255, 255, 255, 0.1);
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.3);
            display: flex;
            align-items: flex-start;
            gap: 12px;
            animation: slideIn 0.3s ease;
        }

        .toast.removing {
            animation: slideOut 0.3s ease forwards;
        }

        @keyframes slideIn {
            from {
                transform: translateX(100%);
                opacity: 0;
            }
            to {
                transform: translateX(0);
                opacity: 1;
            }
        }

        @keyframes slideOut {
            from {
                transform: translateX(0);
                opacity: 1;
            }
            to {
                transform: translateX(100%);
                opacity: 0;
            }
        }

        .toast-icon {
            width: 24px;
            height: 24px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
            font-size: 14px;
        }

        .toast.success .toast-icon {
            background: rgba(34, 197, 94, 0.2);
            color: #4ade80;
        }

        .toast.error .toast-icon {
            background: rgba(239, 68, 68, 0.2);
            color: #ff6b6b;
        }

        .toast.info .toast-icon {
            background: rgba(59, 130, 246, 0.2);
            color: #60a5fa;
        }

        .toast.warning .toast-icon {
            background: rgba(245, 158, 11, 0.2);
            color: #fbbf24;
        }

        .toast-content {
            flex: 1;
        }

        .toast-title {
            font-weight: 600;
            font-size: 14px;
            color: #fff;
            margin-bottom: 4px;
        }

        .toast-message {
            font-size: 13px;
            color: #888;
            line-height: 1.4;
        }

        .toast-close {
            background: none;
            border: none;
            color: #666;
            cursor: pointer;
            padding: 0;
            font-size: 18px;
            line-height: 1;
        }

        .toast-close:hover {
            color: #fff;
        }
    </style>
</head>
<body>
    <!-- Toast Container -->
    <div class="toast-container" id="toastContainer"></div>

    <header>
        <nav>
            <div class="logo">Basotho Medical Herbs</div>
            <div class="nav-links">
                <a href="index.html">Home</a>
                <a href="products.html">Products</a>
                <a href="dashboard.html">Account</a>
            </div>
        </nav>
    </header>

    <div class="container">
        <h1 class="cart-header">Shopping Cart</h1>
        
        <div id="cartContainer">
            <!-- Dynamic content -->
        </div>
    </div>

    <script>
        // Auto-detect API URL based on hostname
        const API_URL = window.location.hostname === 'localhost' || window.location.hostname === '127.0.0.1'
            ? 'http://localhost:3001/api/v1'
            : `${window.location.protocol}//${window.location.host}/api/v1`;

        // Toast notification system
        function showToast(title, message, type = 'info') {
            const container = document.getElementById('toastContainer');
            const toast = document.createElement('div');
            toast.className = `toast ${type}`;

            const icons = {
                success: '&#10003;',
                error: '!',
                warning: '!',
                info: 'i'
            };

            toast.innerHTML = `
                <div class="toast-icon">${icons[type] || icons.info}</div>
                <div class="toast-content">
                    <div class="toast-title">${title}</div>
                    <div class="toast-message">${message}</div>
                </div>
                <button class="toast-close" onclick="this.parentElement.remove()">&times;</button>
            `;

            container.appendChild(toast);

            // Auto-remove after 5 seconds
            setTimeout(() => {
                toast.classList.add('removing');
                setTimeout(() => toast.remove(), 300);
            }, 5000);
        }

        let cartItems = [];
        let couponDiscount = 0;
        let isAuthenticated = false;

        // Check if user is logged in
        async function checkAuth() {
            const token = sessionStorage.getItem('token');
            if (token) {
                try {
                    // Verify token by fetching cart
                    const response = await fetch(`${API_URL}/cart`, {
                        headers: {
                            'Authorization': `Bearer ${token}`
                        }
                    });
                    if (response.ok) {
                        isAuthenticated = true;
                        const data = await response.json();
                        cartItems = data.cart.items.map(item => ({
                            productId: item.product._id || item.product,
                            name: item.name,
                            price: item.price,
                            quantity: item.quantity,
                            image: item.image
                        }));
                    } else {
                        // Token invalid, use localStorage
                        isAuthenticated = false;
                        cartItems = JSON.parse(localStorage.getItem('cart')) || [];
                    }
                } catch (error) {
                    console.error('Auth check error:', error);
                    isAuthenticated = false;
                    cartItems = JSON.parse(localStorage.getItem('cart')) || [];
                }
            } else {
                // No token, use localStorage
                cartItems = JSON.parse(localStorage.getItem('cart')) || [];
            }
            displayCart();
        }

        function displayCart() {
            const container = document.getElementById('cartContainer');
            
            if (cartItems.length === 0) {
                container.innerHTML = `
                    <div class="empty-cart">
                        <h2>Your cart is empty</h2>
                        <p>Add some amazing products to get started!</p>
                        <a href="products.html" class="shop-now-btn">Shop Now</a>
                    </div>
                `;
                return;
            }

            const subtotal = cartItems.reduce((sum, item) => sum + (item.price * item.quantity), 0);
            const shipping = subtotal > 100 ? 0 : 10;
            const total = subtotal - couponDiscount + shipping;

            container.innerHTML = `
                <div class="cart-content">
                    <div class="cart-items">
                        ${cartItems.map((item, index) => `
                            <div class="cart-item">
                                <img src="${item.image || '/images/weedicons/cannabis.png'}" alt="${item.name}" class="item-image" onerror="this.src='/images/weedicons/cannabis.png'">
                                <div class="item-details">
                                    <h3>${item.name}</h3>
                                    ${item.size ? `<p>Size: ${item.size}</p>` : ''}
                                    ${item.color ? `<p>Color: ${item.color}</p>` : ''}
                                </div>
                                <div class="quantity-controls">
                                    <button class="quantity-btn" onclick="updateQuantity(${index}, -1)">−</button>
                                    <span class="quantity-value">${item.quantity}</span>
                                    <button class="quantity-btn" onclick="updateQuantity(${index}, 1)">+</button>
                                </div>
                                <div class="item-price">R ${(item.price * item.quantity).toFixed(2)}</div>
                                <button class="remove-btn" onclick="removeItem(${index})">×</button>
                            </div>
                        `).join('')}
                    </div>

                    <div class="cart-summary">
                        <h2 class="summary-title">Order Summary</h2>
                        
                        <div class="summary-row">
                            <span>Subtotal</span>
                            <span>R ${subtotal.toFixed(2)}</span>
                        </div>

                        ${couponDiscount > 0 ? `
                            <div class="summary-row">
                                <span>Discount</span>
                                <span style="color: #4caf50;">-R ${couponDiscount.toFixed(2)}</span>
                            </div>
                        ` : ''}

                        <div class="summary-row">
                            <span>Shipping</span>
                            <span>${shipping === 0 ? 'FREE' : 'R ' + shipping.toFixed(2)}</span>
                        </div>

                        <div class="summary-row total">
                            <span>Total</span>
                            <span>R ${total.toFixed(2)}</span>
                        </div>

                        <div class="coupon-section">
                            <div class="coupon-input-group">
                                <input type="text" class="coupon-input" id="couponCode" placeholder="Enter voucher code" style="text-transform: uppercase;">
                                <button class="apply-btn" onclick="applyVoucher()">Apply</button>
                            </div>
                            <div id="voucherSuccess" style="display: none; margin-top: 10px; padding: 10px; background: #d4edda; border: 1px solid #c3e6cb; border-radius: 4px; color: #155724;">
                                <i class="fas fa-check-circle"></i>
                                <span id="voucherSuccessMessage"></span>
                                <button onclick="removeVoucher()" style="float: right; background: none; border: none; color: #155724; cursor: pointer; font-weight: bold;">Remove</button>
                            </div>
                            <div id="voucherError" style="display: none; margin-top: 10px; padding: 10px; background: #f8d7da; border: 1px solid #f5c6cb; border-radius: 4px; color: #721c24;">
                                <i class="fas fa-exclamation-circle"></i>
                                <span id="voucherErrorMessage"></span>
                            </div>
                        </div>

                        <button class="checkout-btn" onclick="proceedToCheckout()">
                            Proceed to Checkout
                        </button>
                    </div>
                </div>
            `;
        }

        async function updateQuantity(index, change) {
            const newQuantity = Math.max(1, cartItems[index].quantity + change);

            if (isAuthenticated) {
                // Update via API
                try {
                    const token = sessionStorage.getItem('token');
                    const response = await fetch(`${API_URL}/cart/item/${index}`, {
                        method: 'PUT',
                        headers: {
                            'Content-Type': 'application/json',
                            'Authorization': `Bearer ${token}`
                        },
                        body: JSON.stringify({ quantity: newQuantity })
                    });

                    if (response.ok) {
                        const data = await response.json();
                        cartItems = data.cart.items.map(item => ({
                            productId: item.product._id || item.product,
                            name: item.name,
                            price: item.price,
                            quantity: item.quantity,
                            image: item.image
                        }));
                        displayCart();
                    } else {
                        showToast('Update Failed', 'Failed to update cart. Please try again.', 'error');
                    }
                } catch (error) {
                    console.error('Update cart error:', error);
                    showToast('Error', 'Error updating cart. Please try again.', 'error');
                }
            } else {
                // Update localStorage
                cartItems[index].quantity = newQuantity;
                localStorage.setItem('cart', JSON.stringify(cartItems));
                displayCart();
            }
        }

        async function removeItem(index) {
            if (isAuthenticated) {
                // Remove via API
                try {
                    const token = sessionStorage.getItem('token');
                    const response = await fetch(`${API_URL}/cart/item/${index}`, {
                        method: 'DELETE',
                        headers: {
                            'Authorization': `Bearer ${token}`
                        }
                    });

                    if (response.ok) {
                        const data = await response.json();
                        cartItems = data.cart.items.map(item => ({
                            productId: item.product._id || item.product,
                            name: item.name,
                            price: item.price,
                            quantity: item.quantity,
                            image: item.image
                        }));
                        displayCart();
                    } else {
                        showToast('Remove Failed', 'Failed to remove item. Please try again.', 'error');
                    }
                } catch (error) {
                    console.error('Remove item error:', error);
                    showToast('Error', 'Error removing item. Please try again.', 'error');
                }
            } else {
                // Remove from localStorage
                cartItems.splice(index, 1);
                localStorage.setItem('cart', JSON.stringify(cartItems));
                displayCart();
            }
        }

        let appliedVoucher = null;

        async function applyVoucher() {
            const code = document.getElementById('couponCode').value.trim().toUpperCase();

            if (!code) {
                showVoucherError('Please enter a voucher code');
                return;
            }

            // Hide previous messages
            document.getElementById('voucherSuccess').style.display = 'none';
            document.getElementById('voucherError').style.display = 'none';

            try {
                const token = sessionStorage.getItem('token');
                const userId = token ? JSON.parse(atob(token.split('.')[1])).id : null;

                // Calculate cart total
                const cartTotal = cartItems.reduce((sum, item) => sum + (item.price * item.quantity), 0);

                // Validate voucher with API
                const response = await fetch(`${API_URL}/vouchers/validate`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        code: code,
                        cartTotal: cartTotal,
                        cartItems: cartItems.map(item => ({
                            productId: item.id,
                            name: item.name,
                            price: item.price,
                            quantity: item.quantity,
                            requiresSection21: item.requiresSection21 || false
                        })),
                        userId: userId
                    })
                });

                const data = await response.json();

                if (data.success) {
                    appliedVoucher = data.voucher;
                    couponDiscount = data.voucher.discountAmount;

                    showVoucherSuccess(`Voucher ${code} applied! You saved R${couponDiscount.toFixed(2)}`);
                    displayCart();
                } else {
                    showVoucherError(data.error || 'Invalid voucher code');
                }
            } catch (error) {
                console.error('Voucher validation error:', error);
                showVoucherError('Failed to validate voucher. Please try again.');
            }
        }

        function removeVoucher() {
            appliedVoucher = null;
            couponDiscount = 0;
            document.getElementById('couponCode').value = '';
            document.getElementById('voucherSuccess').style.display = 'none';
            document.getElementById('voucherError').style.display = 'none';
            displayCart();
        }

        function showVoucherSuccess(message) {
            document.getElementById('voucherSuccessMessage').textContent = message;
            document.getElementById('voucherSuccess').style.display = 'block';
            document.getElementById('voucherError').style.display = 'none';
        }

        function showVoucherError(message) {
            document.getElementById('voucherErrorMessage').textContent = message;
            document.getElementById('voucherError').style.display = 'block';
            document.getElementById('voucherSuccess').style.display = 'none';
        }

        function proceedToCheckout() {
            if (cartItems.length === 0) {
                showToast('Empty Cart', 'Your cart is empty. Add some products first.', 'warning');
                return;
            }
            // Save cart and voucher to localStorage for order page
            localStorage.setItem('checkoutCart', JSON.stringify(cartItems));
            if (appliedVoucher) {
                localStorage.setItem('appliedVoucher', JSON.stringify(appliedVoucher));
            } else {
                localStorage.removeItem('appliedVoucher');
            }
            window.location.href = 'order.html';
        }

        // Initialize
        checkAuth();
    </script>
    <!-- UAT Bug Reporter -->
    <script src="/frontend/bug-reporter.js"></script>
</body>
</html>
