<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Products - Basotho Medical Herbs</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, sans-serif;
            background: #0a0a0a;
            color: #fff;
            min-height: 100vh;
        }

        /* Header */
        header {
            background: rgba(0, 0, 0, 0.9);
            padding: 1rem 2rem;
            position: sticky;
            top: 0;
            z-index: 100;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
        }

        nav {
            display: flex;
            justify-content: space-between;
            align-items: center;
            max-width: 1400px;
            margin: 0 auto;
        }

        .logo {
            font-size: 1.5rem;
            font-weight: bold;
            background: linear-gradient(135deg, #FFFFFF 0%, #2a2a2a 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            letter-spacing: 2px;
        }

        .nav-links {
            display: flex;
            gap: 2rem;
            align-items: center;
        }

        .nav-links a {
            color: #fff;
            text-decoration: none;
            transition: color 0.3s;
        }

        .nav-links a:hover {
            color: #FFFFFF;
        }

        .cart-icon {
            position: relative;
            cursor: pointer;
        }

        .cart-count {
            position: absolute;
            top: -8px;
            right: -8px;
            background: #FFFFFF;
            color: #fff;
            border-radius: 50%;
            width: 20px;
            height: 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 0.75rem;
        }

        /* Search Bar */
        .search-section {
            padding: 2rem;
            background: linear-gradient(135deg, rgba(102, 126, 234, 0.1), rgba(118, 75, 162, 0.1));
        }

        .search-container {
            max-width: 600px;
            margin: 0 auto;
            position: relative;
        }

        .search-input {
            width: 100%;
            padding: 1rem 3rem 1rem 1rem;
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 50px;
            color: #fff;
            font-size: 1rem;
        }

        .search-input::placeholder {
            color: rgba(255, 255, 255, 0.5);
        }

        .search-btn {
            position: absolute;
            right: 5px;
            top: 50%;
            transform: translateY(-50%);
            background: linear-gradient(135deg, #FFFFFF 0%, #2a2a2a 100%);
            border: none;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            cursor: pointer;
            color: #fff;
        }

        /* Main Layout */
        .main-container {
            display: flex;
            max-width: 1400px;
            margin: 0 auto;
            padding: 2rem;
            gap: 2rem;
        }

        /* Filters Sidebar */
        .filters {
            width: 250px;
            background: rgba(255, 255, 255, 0.05);
            border-radius: 10px;
            padding: 1.5rem;
            height: fit-content;
            position: sticky;
            top: 100px;
        }

        .filter-group {
            margin-bottom: 2rem;
        }

        .filter-group h3 {
            margin-bottom: 1rem;
            color: #FFFFFF;
        }

        .filter-option {
            display: flex;
            align-items: center;
            margin-bottom: 0.5rem;
            cursor: pointer;
        }

        .filter-option input {
            margin-right: 0.5rem;
        }

        .filter-option label {
            cursor: pointer;
            color: rgba(255, 255, 255, 0.8);
        }

        .price-range {
            display: flex;
            gap: 0.5rem;
            align-items: center;
        }

        .price-input {
            width: 80px;
            padding: 0.5rem;
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 5px;
            color: #fff;
        }

        /* Products Grid */
        .products-section {
            flex: 1;
        }

        .products-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 2rem;
        }

        .sort-select {
            padding: 0.5rem 1rem;
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 5px;
            color: #fff;
        }

        .products-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
            gap: 2rem;
        }

        .product-card {
            background: rgba(255, 255, 255, 0.05);
            border-radius: 10px;
            overflow: hidden;
            transition: transform 0.3s, box-shadow 0.3s;
            cursor: pointer;
        }

        .product-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 10px 30px rgba(102, 126, 234, 0.3);
        }

        .product-image {
            width: 100%;
            height: 250px;
            object-fit: cover;
            background: linear-gradient(135deg, rgba(102, 126, 234, 0.2), rgba(118, 75, 162, 0.2));
        }

        .product-info {
            padding: 1rem;
        }

        .product-name {
            font-size: 1.1rem;
            margin-bottom: 0.5rem;
        }

        .product-price {
            font-size: 1.25rem;
            color: #FFFFFF;
            font-weight: bold;
            margin-bottom: 1rem;
        }

        .add-to-cart-btn {
            width: 100%;
            padding: 0.75rem;
            background: linear-gradient(135deg, #FFFFFF 0%, #2a2a2a 100%);
            border: none;
            border-radius: 5px;
            color: #fff;
            cursor: pointer;
            transition: opacity 0.3s;
        }

        .add-to-cart-btn:hover {
            opacity: 0.9;
        }

        .out-of-stock {
            background: #555;
            cursor: not-allowed;
        }

        /* Pagination */
        .pagination {
            display: flex;
            justify-content: center;
            margin-top: 3rem;
            gap: 0.5rem;
        }

        .page-btn {
            padding: 0.5rem 1rem;
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 5px;
            color: #fff;
            cursor: pointer;
            transition: background 0.3s;
        }

        .page-btn:hover {
            background: rgba(102, 126, 234, 0.3);
        }

        .page-btn.active {
            background: linear-gradient(135deg, #FFFFFF 0%, #2a2a2a 100%);
        }

        /* Loading Spinner */
        .loading {
            text-align: center;
            padding: 3rem;
        }

        .spinner {
            border: 3px solid rgba(255, 255, 255, 0.1);
            border-top: 3px solid #FFFFFF;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
            margin: 0 auto;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        /* Mobile Responsive */
        @media (max-width: 768px) {
            .main-container {
                flex-direction: column;
            }

            .filters {
                width: 100%;
                position: static;
            }

            .products-grid {
                grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
                gap: 1rem;
            }

            .product-image {
                height: 180px;
            }
        }
    </style>
</head>
<body>
    <!-- Header -->
    <header>
        <nav>
            <div class="logo">Basotho Medical Herbs</div>
            <div class="nav-links">
                <a href="index.html">Home</a>
                <a href="about.html">About</a>
                <a href="locations.html">Locations</a>
                <a href="contact.html">Contact</a>
                <a href="products.html">Shop</a>
                <a href="dashboard.html">Account</a>
                <div class="cart-icon" onclick="window.location.href='cart.html'">
                    🛒 <span class="cart-count" id="cartCount">0</span>
                </div>
            </div>
        </nav>
    </header>

    <!-- Search Section -->
    <section class="search-section">
        <div class="search-container">
            <input type="text" class="search-input" id="searchInput" placeholder="Search for products...">
            <button class="search-btn" onclick="searchProducts()">🔍</button>
        </div>
    </section>

    <!-- Main Container -->
    <div class="main-container">
        <!-- Filters Sidebar -->
        <aside class="filters">
            <div class="filter-group">
                <h3>Categories</h3>
                <div id="categoryFilters">
                    <!-- Dynamically populated -->
                </div>
            </div>

            <div class="filter-group">
                <h3>Price Range</h3>
                <div class="price-range">
                    <input type="number" class="price-input" id="minPrice" placeholder="Min">
                    <span>-</span>
                    <input type="number" class="price-input" id="maxPrice" placeholder="Max">
                </div>
                <button class="add-to-cart-btn" onclick="applyFilters()" style="margin-top: 1rem;">Apply</button>
            </div>

            <div class="filter-group">
                <h3>Availability</h3>
                <div class="filter-option">
                    <input type="checkbox" id="inStock">
                    <label for="inStock">In Stock Only</label>
                </div>
            </div>
        </aside>

        <!-- Products Section -->
        <section class="products-section">
            <div class="products-header">
                <h2 id="resultsCount">All Products</h2>
                <select class="sort-select" id="sortSelect" onchange="sortProducts()">
                    <option value="-createdAt">Newest</option>
                    <option value="price">Price: Low to High</option>
                    <option value="-price">Price: High to Low</option>
                    <option value="-sold">Best Selling</option>
                </select>
            </div>

            <div class="products-grid" id="productsGrid">
                <div class="loading">
                    <div class="spinner"></div>
                    <p>Loading products...</p>
                </div>
            </div>

            <div class="pagination" id="pagination"></div>
        </section>
    </div>

    <script>
        // Auto-detect API URL based on hostname
        const API_URL = window.location.hostname === 'localhost' || window.location.hostname === '127.0.0.1'
            ? 'http://localhost:3001/api/v1'
            : `${window.location.protocol}//${window.location.host}/api/v1`;
        let currentPage = 1;
        let currentFilters = {};
        let cartItems = JSON.parse(localStorage.getItem('cart')) || [];

        // Update cart count
        function updateCartCount() {
            const count = cartItems.reduce((sum, item) => sum + item.quantity, 0);
            document.getElementById('cartCount').textContent = count;
        }

        // Load products
        async function loadProducts(page = 1) {
            try {
                const params = new URLSearchParams({
                    page,
                    limit: 12,
                    ...currentFilters
                });

                const response = await fetch(`${API_URL}/products?${params}`);
                const data = await response.json();

                displayProducts(data.products);
                displayPagination(data.totalPages, page);
                document.getElementById('resultsCount').textContent = 
                    `${data.totalProducts} Products Found`;

                // Load categories if not loaded
                if (document.getElementById('categoryFilters').children.length === 0) {
                    loadCategories();
                }
            } catch (error) {
                console.error('Error loading products:', error);
            }
        }

        // Display products
        function displayProducts(products) {
            const grid = document.getElementById('productsGrid');
            
            if (products.length === 0) {
                grid.innerHTML = '<p>No products found</p>';
                return;
            }

            grid.innerHTML = products.map(product => {
                const imageUrl = product.images && product.images.length > 0 && product.images[0].url
                    ? product.images[0].url
                    : '/images/weedicons/cannabis.png';

                return `
                <div class="product-card" onclick="viewProduct('${product._id}')">
                    <img src="${imageUrl}"
                         alt="${product.name}"
                         class="product-image"
                         onerror="this.src='/images/weedicons/cannabis.png'">
                    <div class="product-info">
                        <h3 class="product-name">${product.name}</h3>
                        <p class="product-price">R ${product.price.toFixed(2)}</p>
                        <button class="add-to-cart-btn ${product.stock === 0 ? 'out-of-stock' : ''}"
                                onclick="event.stopPropagation(); addToCart('${product._id}', '${product.name}', ${product.price}, '${imageUrl}')"
                                ${product.stock === 0 ? 'disabled' : ''}>
                            ${product.stock === 0 ? 'Out of Stock' : 'Add to Cart'}
                        </button>
                    </div>
                </div>
                `;
            }).join('');
        }

        // Add to cart
        function addToCart(productId, name, price, image) {
            const existingItem = cartItems.find(item => item.productId === productId);

            if (existingItem) {
                existingItem.quantity++;
            } else {
                cartItems.push({
                    productId,
                    name,
                    price,
                    image,
                    quantity: 1
                });
            }

            localStorage.setItem('cart', JSON.stringify(cartItems));
            updateCartCount();

            // Visual feedback
            event.target.textContent = 'Added!';
            setTimeout(() => {
                event.target.textContent = 'Add to Cart';
            }, 1000);
        }

        // View product details
        function viewProduct(productId) {
            window.location.href = `product.html?id=${productId}`;
        }

        // Load categories
        async function loadCategories() {
            try {
                const response = await fetch(`${API_URL}/products/categories`);
                const categories = await response.json();

                const container = document.getElementById('categoryFilters');
                container.innerHTML = categories.map(cat => `
                    <div class="filter-option">
                        <input type="radio" name="category" id="cat-${cat.name}" 
                               value="${cat.name}" onchange="filterByCategory('${cat.name}')">
                        <label for="cat-${cat.name}">${cat.name} (${cat.count})</label>
                    </div>
                `).join('');
            } catch (error) {
                console.error('Error loading categories:', error);
            }
        }

        // Filter by category
        function filterByCategory(category) {
            currentFilters.category = category;
            loadProducts(1);
        }

        // Apply price filters
        function applyFilters() {
            const minPrice = document.getElementById('minPrice').value;
            const maxPrice = document.getElementById('maxPrice').value;
            const inStock = document.getElementById('inStock').checked;

            if (minPrice) currentFilters.minPrice = minPrice;
            if (maxPrice) currentFilters.maxPrice = maxPrice;
            if (inStock) currentFilters.inStock = true;

            loadProducts(1);
        }

        // Sort products
        function sortProducts() {
            currentFilters.sort = document.getElementById('sortSelect').value;
            loadProducts(currentPage);
        }

        // Search products
        async function searchProducts() {
            const query = document.getElementById('searchInput').value;
            
            if (query.trim().length < 2) {
                alert('Please enter at least 2 characters to search');
                return;
            }

            try {
                const response = await fetch(`${API_URL}/products/search?q=${query}`);
                const data = await response.json();

                displayProducts(data.products);
                document.getElementById('resultsCount').textContent = 
                    `${data.totalProducts} Results for "${query}"`;
            } catch (error) {
                console.error('Search error:', error);
            }
        }

        // Display pagination
        function displayPagination(totalPages, currentPage) {
            const pagination = document.getElementById('pagination');
            
            if (totalPages <= 1) {
                pagination.innerHTML = '';
                return;
            }

            let pages = [];
            
            if (currentPage > 1) {
                pages.push(`<button class="page-btn" onclick="loadProducts(${currentPage - 1})">Previous</button>`);
            }

            for (let i = 1; i <= totalPages; i++) {
                if (i === currentPage) {
                    pages.push(`<button class="page-btn active">${i}</button>`);
                } else if (i === 1 || i === totalPages || (i >= currentPage - 2 && i <= currentPage + 2)) {
                    pages.push(`<button class="page-btn" onclick="loadProducts(${i})">${i}</button>`);
                }
            }

            if (currentPage < totalPages) {
                pages.push(`<button class="page-btn" onclick="loadProducts(${currentPage + 1})">Next</button>`);
            }

            pagination.innerHTML = pages.join('');
        }

        // Initialize
        updateCartCount();
        loadProducts();

        // Search on Enter key
        document.getElementById('searchInput').addEventListener('keypress', (e) => {
            if (e.key === 'Enter') {
                searchProducts();
            }
        });
    </script>
    <!-- UAT Bug Reporter -->
    <script src="/frontend/bug-reporter.js"></script>
</body>
</html>
