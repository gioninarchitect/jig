<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Product Details - Basotho Medical Herbs</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, sans-serif;
            background: #0a0a0a;
            color: #fff;
            min-height: 100vh;
        }

        /* Header */
        header {
            background: rgba(0, 0, 0, 0.9);
            padding: 1rem 2rem;
            position: sticky;
            top: 0;
            z-index: 100;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
        }

        nav {
            display: flex;
            justify-content: space-between;
            align-items: center;
            max-width: 1400px;
            margin: 0 auto;
        }

        .logo {
            font-size: 1.5rem;
            font-weight: bold;
            background: linear-gradient(135deg, #FFFFFF 0%, #2a2a2a 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .nav-links {
            display: flex;
            gap: 2rem;
            align-items: center;
        }

        .nav-links a {
            color: #fff;
            text-decoration: none;
            transition: color 0.3s;
        }

        .nav-links a:hover {
            color: #FFFFFF;
        }

        .cart-icon {
            position: relative;
            cursor: pointer;
        }

        .cart-count {
            position: absolute;
            top: -8px;
            right: -8px;
            background: #2a2a2a;
            color: #fff;
            border-radius: 50%;
            width: 20px;
            height: 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 0.75rem;
        }

        /* Breadcrumb */
        .breadcrumb {
            max-width: 1400px;
            margin: 2rem auto;
            padding: 0 2rem;
            color: rgba(255, 255, 255, 0.6);
        }

        .breadcrumb a {
            color: rgba(255, 255, 255, 0.6);
            text-decoration: none;
        }

        .breadcrumb a:hover {
            color: #FFFFFF;
        }

        /* Product Container */
        .product-container {
            max-width: 1400px;
            margin: 0 auto;
            padding: 0 2rem 4rem;
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 4rem;
        }

        /* Product Images */
        .product-images {
            position: sticky;
            top: 100px;
            height: fit-content;
        }

        .main-image {
            width: 100%;
            height: 500px;
            background: linear-gradient(135deg, rgba(102, 126, 234, 0.1), rgba(118, 75, 162, 0.1));
            border-radius: 10px;
            overflow: hidden;
            margin-bottom: 1rem;
        }

        .main-image img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .thumbnail-container {
            display: flex;
            gap: 1rem;
            overflow-x: auto;
        }

        .thumbnail {
            width: 80px;
            height: 80px;
            border-radius: 5px;
            overflow: hidden;
            cursor: pointer;
            opacity: 0.6;
            transition: opacity 0.3s;
            flex-shrink: 0;
        }

        .thumbnail.active {
            opacity: 1;
            border: 2px solid #FFFFFF;
        }

        .thumbnail img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        /* Product Details */
        .product-details {
            padding-top: 2rem;
        }

        .product-title {
            font-size: 2.5rem;
            margin-bottom: 1rem;
        }

        .product-price {
            font-size: 2rem;
            color: #FFFFFF;
            margin-bottom: 1rem;
        }

        .old-price {
            text-decoration: line-through;
            color: rgba(255, 255, 255, 0.5);
            margin-right: 1rem;
        }

        .discount-badge {
            background: #ff4757;
            padding: 0.25rem 0.5rem;
            border-radius: 5px;
            font-size: 0.875rem;
        }

        .stock-status {
            margin-bottom: 2rem;
            padding: 0.5rem 1rem;
            background: rgba(255, 255, 255, 0.05);
            border-radius: 5px;
            display: inline-block;
        }

        .in-stock {
            color: #4caf50;
        }

        .low-stock {
            color: #ff9800;
        }

        .out-of-stock {
            color: #f44336;
        }

        /* Options */
        .product-options {
            margin-bottom: 2rem;
        }

        .option-group {
            margin-bottom: 1.5rem;
        }

        .option-label {
            display: block;
            margin-bottom: 0.5rem;
            color: rgba(255, 255, 255, 0.8);
        }

        .size-options, .color-options {
            display: flex;
            gap: 1rem;
            flex-wrap: wrap;
        }

        .size-option, .color-option {
            padding: 0.5rem 1rem;
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 5px;
            background: rgba(255, 255, 255, 0.05);
            cursor: pointer;
            transition: all 0.3s;
        }

        .size-option:hover, .color-option:hover {
            border-color: #FFFFFF;
        }

        .size-option.selected, .color-option.selected {
            background: linear-gradient(135deg, #FFFFFF 0%, #2a2a2a 100%);
            border-color: transparent;
        }

        .color-option {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            padding: 0;
        }

        /* Quantity and Add to Cart */
        .purchase-section {
            display: flex;
            gap: 1rem;
            margin-bottom: 2rem;
        }

        .quantity-selector {
            display: flex;
            align-items: center;
            background: rgba(255, 255, 255, 0.05);
            border-radius: 5px;
            overflow: hidden;
        }

        .quantity-btn {
            padding: 1rem;
            background: none;
            border: none;
            color: #fff;
            cursor: pointer;
            font-size: 1.25rem;
        }

        .quantity-btn:hover {
            background: rgba(255, 255, 255, 0.1);
        }

        .quantity-input {
            width: 60px;
            padding: 1rem;
            background: none;
            border: none;
            color: #fff;
            text-align: center;
            font-size: 1rem;
        }

        .add-to-cart {
            flex: 1;
            padding: 1rem 2rem;
            background: linear-gradient(135deg, #FFFFFF 0%, #2a2a2a 100%);
            border: none;
            border-radius: 5px;
            color: #fff;
            font-size: 1.1rem;
            cursor: pointer;
            transition: opacity 0.3s;
        }

        .add-to-cart:hover {
            opacity: 0.9;
        }

        .buy-now {
            padding: 1rem 2rem;
            background: transparent;
            border: 2px solid #FFFFFF;
            border-radius: 5px;
            color: #FFFFFF;
            font-size: 1.1rem;
            cursor: pointer;
            transition: all 0.3s;
        }

        .buy-now:hover {
            background: #FFFFFF;
            color: #fff;
        }

        /* Product Description */
        .product-description {
            margin-bottom: 3rem;
        }

        .description-title {
            font-size: 1.5rem;
            margin-bottom: 1rem;
            color: #FFFFFF;
        }

        .description-content {
            line-height: 1.6;
            color: rgba(255, 255, 255, 0.8);
        }

        /* Product Features */
        .product-features {
            margin-bottom: 3rem;
        }

        .features-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 1rem;
            margin-top: 1rem;
        }

        .feature-item {
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        .feature-icon {
            color: #FFFFFF;
        }

        /* Related Products */
        .related-section {
            max-width: 1400px;
            margin: 4rem auto;
            padding: 0 2rem;
        }

        .related-title {
            font-size: 2rem;
            margin-bottom: 2rem;
        }

        .related-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 2rem;
        }

        .related-product {
            background: rgba(255, 255, 255, 0.05);
            border-radius: 10px;
            overflow: hidden;
            cursor: pointer;
            transition: transform 0.3s;
        }

        .related-product:hover {
            transform: translateY(-5px);
        }

        .related-image {
            width: 100%;
            height: 200px;
            object-fit: cover;
            background: linear-gradient(135deg, rgba(102, 126, 234, 0.1), rgba(118, 75, 162, 0.1));
        }

        .related-info {
            padding: 1rem;
        }

        .related-name {
            margin-bottom: 0.5rem;
        }

        .related-price {
            color: #FFFFFF;
            font-weight: bold;
        }

        /* Loading */
        .loading {
            text-align: center;
            padding: 3rem;
        }

        .spinner {
            border: 3px solid rgba(255, 255, 255, 0.1);
            border-top: 3px solid #FFFFFF;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
            margin: 0 auto;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        /* Mobile Responsive */
        @media (max-width: 768px) {
            .product-container {
                grid-template-columns: 1fr;
                gap: 2rem;
            }

            .product-images {
                position: static;
            }

            .main-image {
                height: 300px;
            }

            .purchase-section {
                flex-direction: column;
            }

            .related-grid {
                grid-template-columns: repeat(2, 1fr);
                gap: 1rem;
            }
        }

        /* Toast Notification Styles */
        .toast-container {
            position: fixed;
            top: 20px;
            right: 20px;
            z-index: 10000;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .toast {
            min-width: 300px;
            max-width: 400px;
            padding: 16px 20px;
            border-radius: 8px;
            background: #1a1a1a;
            border: 1px solid rgba(255, 255, 255, 0.1);
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.3);
            display: flex;
            align-items: flex-start;
            gap: 12px;
            animation: toastSlideIn 0.3s ease;
        }

        .toast.removing { animation: toastSlideOut 0.3s ease forwards; }
        @keyframes toastSlideIn { from { transform: translateX(100%); opacity: 0; } to { transform: translateX(0); opacity: 1; } }
        @keyframes toastSlideOut { from { transform: translateX(0); opacity: 1; } to { transform: translateX(100%); opacity: 0; } }

        .toast-icon {
            width: 24px; height: 24px; border-radius: 50%;
            display: flex; align-items: center; justify-content: center;
            flex-shrink: 0; font-size: 14px;
        }
        .toast.success .toast-icon { background: rgba(34, 197, 94, 0.2); color: #4ade80; }
        .toast.error .toast-icon { background: rgba(239, 68, 68, 0.2); color: #ff6b6b; }
        .toast.warning .toast-icon { background: rgba(245, 158, 11, 0.2); color: #fbbf24; }
        .toast.info .toast-icon { background: rgba(59, 130, 246, 0.2); color: #60a5fa; }
        .toast-content { flex: 1; }
        .toast-title { font-weight: 600; font-size: 14px; color: #fff; margin-bottom: 4px; }
        .toast-message { font-size: 13px; color: #888; line-height: 1.4; }
        .toast-close { background: none; border: none; color: #666; cursor: pointer; padding: 0; font-size: 18px; }
        .toast-close:hover { color: #fff; }
    </style>
</head>
<body>
    <!-- Toast Container -->
    <div class="toast-container" id="toastContainer"></div>

    <!-- Header -->
    <header>
        <nav>
            <div class="logo">Basotho Medical Herbs</div>
            <div class="nav-links">
                <a href="index.html">Home</a>
                <a href="products.html">Products</a>
                <a href="dashboard.html">Account</a>
                <div class="cart-icon" onclick="window.location.href='cart.html'">
                    🛒 <span class="cart-count" id="cartCount">0</span>
                </div>
            </div>
        </nav>
    </header>

    <!-- Breadcrumb -->
    <div class="breadcrumb" id="breadcrumb">
        <a href="index.html">Home</a> / 
        <a href="products.html">Products</a> / 
        <span id="breadcrumbName">Loading...</span>
    </div>

    <!-- Product Container -->
    <div class="product-container" id="productContainer">
        <div class="loading">
            <div class="spinner"></div>
            <p>Loading product...</p>
        </div>
    </div>

    <!-- Related Products -->
    <section class="related-section" id="relatedSection" style="display: none;">
        <h2 class="related-title">You May Also Like</h2>
        <div class="related-grid" id="relatedGrid">
            <!-- Dynamically populated -->
        </div>
    </section>

    <script>
        // Auto-detect API URL based on hostname
        const API_URL = window.location.hostname === 'localhost' || window.location.hostname === '127.0.0.1'
            ? 'http://localhost:3001/api/v1'
            : `${window.location.protocol}//${window.location.host}/api/v1`;

        // Toast notification system
        function showToast(title, message, type = 'info') {
            const container = document.getElementById('toastContainer');
            const toast = document.createElement('div');
            toast.className = `toast ${type}`;
            const icons = { success: '&#10003;', error: '!', warning: '!', info: 'i' };
            toast.innerHTML = `
                <div class="toast-icon">${icons[type] || icons.info}</div>
                <div class="toast-content">
                    <div class="toast-title">${title}</div>
                    <div class="toast-message">${message}</div>
                </div>
                <button class="toast-close" onclick="this.parentElement.remove()">&times;</button>
            `;
            container.appendChild(toast);
            setTimeout(() => {
                toast.classList.add('removing');
                setTimeout(() => toast.remove(), 300);
            }, 5000);
        }

        let currentProduct = null;
        let selectedSize = null;
        let selectedColor = null;
        let cartItems = JSON.parse(localStorage.getItem('cart')) || [];

        // Get product ID from URL
        const urlParams = new URLSearchParams(window.location.search);
        const productId = urlParams.get('id');

        // Update cart count
        function updateCartCount() {
            const count = cartItems.reduce((sum, item) => sum + item.quantity, 0);
            document.getElementById('cartCount').textContent = count;
        }

        // Load product details
        async function loadProduct() {
            if (!productId) {
                window.location.href = 'products.html';
                return;
            }

            try {
                const response = await fetch(`${API_URL}/products/${productId}`);
                
                if (!response.ok) {
                    throw new Error('Product not found');
                }

                const data = await response.json();
                currentProduct = data.product || data;
                displayProduct(currentProduct);
                document.getElementById('breadcrumbName').textContent = currentProduct.name;
                
                // Load related products
                loadRelatedProducts();
            } catch (error) {
                console.error('Error loading product:', error);
                document.getElementById('productContainer').innerHTML = 
                    '<p>Product not found</p>';
            }
        }

        // Display product
        function displayProduct(product) {
            const container = document.getElementById('productContainer');

            // Get stock from inventory object or fallback
            const stock = product.inventory?.quantity || product.stock || 0;

            const stockStatus = stock > 10
                ? '<span class="in-stock">In Stock</span>'
                : stock > 0
                ? `<span class="low-stock">Only ${stock} left!</span>`
                : '<span class="out-of-stock">Out of Stock</span>';

            // Handle images - can be array of strings or objects with url property
            const getImageUrl = (img) => {
                if (typeof img === 'string') return img;
                return img?.url || '/images/logo-w.png';
            };
            const mainImageUrl = product.images?.length ? getImageUrl(product.images[0]) : '/images/logo-w.png';

            container.innerHTML = `
                <!-- Product Images -->
                <div class="product-images">
                    <div class="main-image">
                        <img src="${mainImageUrl}"
                             alt="${product.name}" id="mainImage">
                    </div>
                    <div class="thumbnail-container">
                        ${product.images?.map((img, index) => {
                            const imgUrl = getImageUrl(img);
                            return `
                            <div class="thumbnail ${index === 0 ? 'active' : ''}"
                                 onclick="changeImage('${imgUrl}', this)">
                                <img src="${imgUrl}" alt="Product ${index + 1}">
                            </div>
                        `;}).join('') || ''}
                    </div>
                </div>

                <!-- Product Details -->
                <div class="product-details">
                    <h1 class="product-title">${product.name}</h1>

                    <div class="product-price">
                        ${product.originalPrice ? `
                            <span class="old-price">R${product.originalPrice.toFixed(2)}</span>
                        ` : ''}
                        R${product.price.toFixed(2)}
                        ${product.discount ? `
                            <span class="discount-badge">-${product.discount}%</span>
                        ` : ''}
                    </div>

                    <div class="stock-status">${stockStatus}</div>

                    <!-- Options -->
                    <div class="product-options">
                        ${product.sizes?.length ? `
                            <div class="option-group">
                                <label class="option-label">Size:</label>
                                <div class="size-options">
                                    ${product.sizes.map(size => `
                                        <div class="size-option" onclick="selectSize('${size}', this)">
                                            ${size}
                                        </div>
                                    `).join('')}
                                </div>
                            </div>
                        ` : ''}

                        ${product.colors?.length ? `
                            <div class="option-group">
                                <label class="option-label">Color:</label>
                                <div class="color-options">
                                    ${product.colors.map(color => `
                                        <div class="color-option" 
                                             style="background: ${color};"
                                             onclick="selectColor('${color}', this)"
                                             title="${color}">
                                        </div>
                                    `).join('')}
                                </div>
                            </div>
                        ` : ''}
                    </div>

                    <!-- Purchase Section -->
                    <div class="purchase-section">
                        <div class="quantity-selector">
                            <button class="quantity-btn" onclick="decreaseQuantity()">-</button>
                            <input type="number" class="quantity-input" id="quantity" value="1" min="1" max="${stock}">
                            <button class="quantity-btn" onclick="increaseQuantity()">+</button>
                        </div>
                        <button class="add-to-cart" onclick="addToCart()" ${stock === 0 ? 'disabled' : ''}>
                            Add to Cart
                        </button>
                        <button class="buy-now" onclick="buyNow()" ${stock === 0 ? 'disabled' : ''}>
                            Buy Now
                        </button>
                    </div>

                    <!-- Description -->
                    <div class="product-description">
                        <h3 class="description-title">Description</h3>
                        <div class="description-content">
                            ${product.description || 'No description available.'}
                        </div>
                    </div>

                    <!-- Features -->
                    ${product.features?.length ? `
                        <div class="product-features">
                            <h3 class="description-title">Features</h3>
                            <div class="features-grid">
                                ${product.features.map(feature => `
                                    <div class="feature-item">
                                        <span class="feature-icon">✓</span>
                                        <span>${feature}</span>
                                    </div>
                                `).join('')}
                            </div>
                        </div>
                    ` : ''}
                </div>
            `;
        }

        // Change main image
        function changeImage(src, thumbnail) {
            document.getElementById('mainImage').src = src;
            document.querySelectorAll('.thumbnail').forEach(t => t.classList.remove('active'));
            thumbnail.classList.add('active');
        }

        // Select size
        function selectSize(size, element) {
            selectedSize = size;
            document.querySelectorAll('.size-option').forEach(s => s.classList.remove('selected'));
            element.classList.add('selected');
        }

        // Select color
        function selectColor(color, element) {
            selectedColor = color;
            document.querySelectorAll('.color-option').forEach(c => c.classList.remove('selected'));
            element.classList.add('selected');
        }

        // Quantity controls
        function increaseQuantity() {
            const input = document.getElementById('quantity');
            const max = parseInt(input.max);
            const current = parseInt(input.value);
            if (current < max) {
                input.value = current + 1;
            }
        }

        function decreaseQuantity() {
            const input = document.getElementById('quantity');
            const current = parseInt(input.value);
            if (current > 1) {
                input.value = current - 1;
            }
        }

        // Add to cart
        function addToCart() {
            if (currentProduct.sizes?.length && !selectedSize) {
                showToast('Selection Required', 'Please select a size before adding to cart.', 'warning');
                return;
            }

            if (currentProduct.colors?.length && !selectedColor) {
                showToast('Selection Required', 'Please select a color before adding to cart.', 'warning');
                return;
            }

            const quantity = parseInt(document.getElementById('quantity').value);
            
            // Get image URL - handle both string and object formats
            const imageUrl = currentProduct.images?.[0]?.url || currentProduct.images?.[0] || '/images/logo-w.png';

            const cartItem = {
                productId: currentProduct._id,
                name: currentProduct.name,
                price: currentProduct.price,
                image: imageUrl,
                quantity,
                size: selectedSize,
                color: selectedColor
            };

            // Check if item already exists
            const existingIndex = cartItems.findIndex(item => 
                item.productId === cartItem.productId &&
                item.size === cartItem.size &&
                item.color === cartItem.color
            );

            if (existingIndex > -1) {
                cartItems[existingIndex].quantity += quantity;
            } else {
                cartItems.push(cartItem);
            }

            localStorage.setItem('cart', JSON.stringify(cartItems));
            updateCartCount();

            // Visual feedback
            const button = event.target;
            button.textContent = 'Added to Cart!';
            setTimeout(() => {
                button.textContent = 'Add to Cart';
            }, 2000);
        }

        // Buy now
        function buyNow() {
            addToCart();
            window.location.href = 'checkout.html';
        }

        // Load related products
        async function loadRelatedProducts() {
            try {
                const response = await fetch(`${API_URL}/products/${productId}/related`);
                const data = await response.json();
                const related = data.products || data || [];

                if (related.length > 0) {
                    document.getElementById('relatedSection').style.display = 'block';
                    document.getElementById('relatedGrid').innerHTML = related.map(product => {
                        const imgUrl = product.images?.[0]?.url || product.images?.[0] || '/images/logo-w.png';
                        return `
                        <div class="related-product" onclick="window.location.href='product.html?id=${product._id}'">
                            <img src="${imgUrl}"
                                 alt="${product.name}" class="related-image">
                            <div class="related-info">
                                <h4 class="related-name">${product.name}</h4>
                                <p class="related-price">R${product.price.toFixed(2)}</p>
                            </div>
                        </div>
                    `;}).join('');
                }
            } catch (error) {
                console.error('Error loading related products:', error);
            }
        }

        // Initialize
        updateCartCount();
        loadProduct();
    </script>
    <!-- UAT Bug Reporter -->
    <script src="/frontend/bug-reporter.js"></script>
</body>
</html>
