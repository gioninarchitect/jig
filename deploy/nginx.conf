# ──────────────────────────────────────────────
# Origin by ILCO Farming - nginx Site Configuration
#
# Three zones behind one domain:
#   /              → POS Marketing Site + Multi-App (port 3004)
#   /b2b/          → B2B Wholesale SPA (port 3002)
#   /api/          → B2B API (port 3002)
#
# Install:  cp nginx.conf /etc/nginx/sites-available/origin
# Enable:   ln -sf /etc/nginx/sites-available/origin /etc/nginx/sites-enabled/
# Test:     nginx -t
# Reload:   systemctl reload nginx
# SSL:      certbot --nginx -d origin.cleva-ai.co.za
# ──────────────────────────────────────────────

server {
    listen 80;
    listen [::]:80;
    server_name origin.cleva-ai.co.za;

    # ── Security Headers ─────────────────────────
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # ── Gzip ─────────────────────────────────────
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml text/javascript image/svg+xml;

    # ── Shared uploads ───────────────────────────
    location /uploads/ {
        alias /var/www/origin/uploads/;
        expires 30d;
        add_header Cache-Control "public";
        access_log off;
    }

    # ─────────────────────────────────────────────
    # B2B Wholesale Portal (port 3002) — moved to /b2b/
    # ─────────────────────────────────────────────

    # B2B API — NEVER cache API responses
    location /api/ {
        proxy_pass http://127.0.0.1:3002;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
        proxy_read_timeout 30s;
        proxy_send_timeout 30s;
        client_max_body_size 10m;
        add_header Cache-Control "no-store, no-cache, must-revalidate" always;
        add_header Pragma "no-cache" always;
    }

    # B2B internal API (proxied with server-side auth key)
    location /b2b/api/v1/ {
        proxy_pass http://127.0.0.1:3002/api/v1/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Internal-Key "origin_internal_2026";
        proxy_read_timeout 30s;
        add_header Cache-Control "no-cache, no-store" always;
    }

    # B2B Health check
    location /health {
        proxy_pass http://127.0.0.1:3002;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # B2B static assets (Vite hashed files)
    location /b2b/assets/ {
        alias /var/www/origin/b2b/dist/frontend/b2b/assets/;
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # B2B SPA — serve from /b2b/, fallback to index.html for client-side routing
    location /b2b/ {
        alias /var/www/origin/b2b/dist/frontend/b2b/;
        index index.html;
        try_files $uri $uri/ /b2b/index.html;
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        add_header Pragma "no-cache" always;
    }

    # ─────────────────────────────────────────────
    # POS Marketing Site + Multi-App (port 3004)
    # ─────────────────────────────────────────────

    # POS API endpoints — NEVER cache
    location /pos/api/ {
        rewrite ^/pos/api/(.*)$ /api/$1 break;
        proxy_pass http://127.0.0.1:3008;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
        proxy_read_timeout 30s;
        proxy_send_timeout 30s;
        client_max_body_size 10m;
        add_header Cache-Control "no-store, no-cache, must-revalidate" always;
        add_header Pragma "no-cache" always;
    }

    # POS WebSocket
    location /pos/socket.io/ {
        rewrite ^/pos/socket\.io/(.*)$ /socket.io/$1 break;
        proxy_pass http://127.0.0.1:3008;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ── Root: POS static files (marketing site + all POS HTML apps) ──
    root /var/www/origin/pos;
    index index.html;

    # SPA fallback — serve POS marketing site for all unmatched routes
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        add_header Pragma "no-cache" always;
    }

    # ── Logging ──────────────────────────────────
    access_log /var/log/nginx/origin-access.log;
    error_log /var/log/nginx/origin-error.log;
}
