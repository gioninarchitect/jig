# ──────────────────────────────────────────────
# JIG Craft Cannabis - nginx Site Configuration
#
# Initial HTTP config. Certbot will add HTTPS block automatically.
#
# Install:  cp nginx.conf /etc/nginx/sites-available/jig
# Enable:   ln -s /etc/nginx/sites-available/jig /etc/nginx/sites-enabled/
# Test:     nginx -t
# Reload:   systemctl reload nginx
# SSL:      certbot --nginx -d jig.cleva-ai.co.za
# ──────────────────────────────────────────────

server {
    listen 80;
    listen [::]:80;
    server_name jig.cleva-ai.co.za;

    # ── Security Headers ─────────────────────────
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # ── Gzip ─────────────────────────────────────
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml text/javascript image/svg+xml;

    # ── API: Reverse proxy to Node.js ────────────
    location /api/ {
        proxy_pass http://127.0.0.1:3002;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
        proxy_read_timeout 30s;
        proxy_send_timeout 30s;
        client_max_body_size 10m;
    }

    # ── POP uploads: serve uploaded files ──────
    location /uploads/ {
        alias /var/www/jig/uploads/;
        expires 30d;
        add_header Cache-Control "public";
        access_log off;
    }

    # ── Health check proxy ───────────────────────
    location /health {
        proxy_pass http://127.0.0.1:3002;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ── Frontend: Static files ───────────────────
    root /var/www/jig/dist/frontend;
    index index.html;

    # Cache static assets aggressively
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # SPA fallback: all other routes → index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # ── Logging ──────────────────────────────────
    access_log /var/log/nginx/jig-access.log;
    error_log /var/log/nginx/jig-error.log;
}
